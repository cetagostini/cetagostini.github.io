# Spanish site profile: `quarto render --profile es`
#
# Merges over _quarto.yml. Quarto CONCATENATES list-valued keys across profiles
# (navbar.right, page-footer, filters, post-render) and appends profile entries
# AFTER base entries — so this file deliberately declares NONE of them:
#   * filters          -> translate.lua is base-declared first (ordering matters)
#   * post-render      -> base scripts self-dispatch on QUARTO_PROFILE
#   * navbar/page-footer-> one base config; labels are rewritten server-side by
#                          translate.lua's envelope pass; remaining footer prose
#                          is swapped by js/site-i18n.js
#
# `lang` is a TOP-LEVEL key (not a website: key) — mis-nesting fails the render.

lang: es

project:
  output-dir: docs/es
  pre-render:
    # Compile the reviewed YAML dictionaries into the JSON the Lua filter reads,
    # then enforce the coverage floor. Both run before any page is rendered, so a
    # broken or under-translated dictionary aborts the build instead of shipping
    # an English tree under Spanish SEO signals.
    - python3 scripts/i18n_extract.py --lang es --compile
    - python3 scripts/i18n_coverage_gate.py

website:
  site-url: https://cetagostini.github.io/es
  title: "Blog de ciencia del marketing"
