  para-eede6661509e:
    kind: para
    context: body
    en: |-
      Based on the provided DAG, we can create some synthetic data to test how
      our model performs when we have a complex causal structures. Using the
      same data, we can test different model compositions and see how could we
      improve our model to uncover the true causal impact of each channel on
      the target variable.
    es: Basándonos en el DAG proporcionado, podemos crear datos sintéticos para probar qué tan bien funciona
      nuestro modelo cuando tenemos estructuras causales complejas. Usando los mismos datos, podemos probar
      diferentes composiciones de modelos y ver cómo podríamos mejorar nuestro modelo para descubrir el
      verdadero impacto causal de cada canal en la variable objetivo.
  para-4e0d8345533b:
    kind: para
    context: body
    en: |-
      Bayesian regression models allow us to estimate the conditional
      expectation of an outcome given a set of predictors, effectively
      uncovering the underlying conditional probabilities. In a bayesian
      linear regression, for example, we estimate
      $E(Y \mid X) = \beta_0 + \beta_1X_1 + \ldots + \beta_kX_k$, which
      represents the average outcome $Y$ when the predictors $X_1, \dots, X_k$
      are held at specific values.
    es: Los modelos de regresión Bayesiana nos permiten estimar la expectativa condicional de un resultado
      dado un conjunto de predictores, descubriendo efectivamente las probabilidades condicionales subyacentes.
      En una regresión lineal Bayesiana, por ejemplo, estimamos $E(Y \mid X) = \beta_0 + \beta_1X_1 +
      \ldots + \beta_kX_k$, que representa el resultado promedio $Y$ cuando los predictores $X_1, \dots,
      X_k$ se mantienen en valores específicos.
  para-3604bed2bfa8:
    kind: para
    context: body
    en: |-
      Causal Learn allows use to use different algorithms to infer the markov
      equivalent class of the causal graph. The previous class is a wrapper
      that allows us to use the different algorithms implemented in the causal
      learn library, and plot them more easily.
    es: Causal Learn nos permite usar diferentes algoritmos para inferir la clase equivalente de Markov
      del grafo causal. La clase anterior es un wrapper que nos permite usar los diferentes algoritmos
      implementados en la biblioteca causal learn, y graficarlos más fácilmente.
  para-67aa9e7239f2:
    kind: para
    context: body
    en: |-
      Causal Markov Assumption: Each variable is independent of its
      non-effects given its direct causes, meaning that the joint probability
      distribution can be factorized according to the directed acyclic graph
      structure. This implies that once you condition on a variable's
      immediate causes, any further upstream or parallel influences are
      rendered statistically irrelevant.
    es: 'Suposición de Markov Causal: Cada variable es independiente de sus no-efectos dados sus causas
      directas, lo que significa que la distribución de probabilidad conjunta puede factorizarse de acuerdo
      con la estructura del grafo acíclico dirigido. Esto implica que una vez que condicionas sobre las
      causas inmediatas de una variable, cualquier influencia adicional aguas arriba o paralela se vuelve
      estadísticamente irrelevante.'
  para-b928f186e0be:
    kind: para
    context: body
    en: |-
      Causal discovery infers directional cause-and-effect relationships from
      observational data. It uses computational algorithms to construct
      directed acyclic graphs that represent potential causal mechanisms.
      These techniques are based on the causal Markov condition and the
      assumption of statistical faithfulness. They employ statistical tests
      for conditional independence to differentiate direct influences from
      indirect associations. This approach integrates statistical inference
      and graph theory to model complex systems. Overall, it uncovers hidden
      causal structures that enhance our understanding and estimations of
      dynamic phenomena.
    es: El descubrimiento causal infiere relaciones direccionales de causa y efecto a partir de datos
      observacionales. Utiliza algoritmos computacionales para construir grafos acíclicos dirigidos que
      representan posibles mecanismos causales. Estas técnicas se basan en la condición de Markov causal
      y la suposición de fidelidad estadística. Emplean pruebas estadísticas de independencia condicional
      para diferenciar las influencias directas de las asociaciones indirectas. Este enfoque integra inferencia
      estadística y teoría de grafos para modelar sistemas complejos. En general, descubre estructuras
      causales ocultas que mejoran nuestra comprensión y estimaciones de fenómenos dinámicos.
  para-9b4a2fc7b370:
    kind: para
    context: body
    en: |-
      Causal structures play a crucial role in various causal inference
      methods, serving as the foundation for their functionality. For
      instance, chain structures are key to methods like instrumental
      variables (IV). In IV analysis, this chain structure comes into play by
      introducing an instrument---a variable that impacts the exposure but
      does not directly affect the outcome, except through that exposure. This
      approach helps break the confounding path, allowing us to isolate the
      exogenous variation in treatment.
    es: 'Las estructuras causales juegan un papel crucial en diversos métodos de inferencia causal, sirviendo
      como base para su funcionamiento. Por ejemplo, las estructuras de cadena son clave para métodos
      como las variables instrumentales (VI). En el análisis de VI, esta estructura de cadena entra en
      juego al introducir un instrumento: una variable que afecta la exposición pero no afecta directamente
      el resultado, excepto a través de esa exposición. Este enfoque ayuda a romper la vía de confusión,
      permitiéndonos aislar la variación exógena en el tratamiento.'
  para-6fe6f862e8b3:
    kind: para
    context: body
    en: |-
      Certain holidays, like Christmas, can have a significant impact on
      consumer behavior before and after the specific date, leading to
      seasonal spikes in sales. To capture these effects, we introduce a
      holiday signal based on Gaussian (normal) distributions centered around
      specific holiday dates.
    es: Ciertos días festivos, como la Navidad, pueden tener un impacto significativo en el comportamiento
      del consumidor antes y después de la fecha específica, generando picos estacionales en ventas. Para
      capturar estos efectos, introducimos una señal de días festivos basada en distribuciones gaussianas
      (normales) centradas en fechas festivas específicas.
  para-8add77ddfced:
    kind: para
    context: body
    en: |-
      Conditional independence is a core concept in probability theory and
      statistics where two variables are independent of each other once a
      third variable is held constant. This means that, given the value of the
      conditioning variable, the two variables do not provide additional
      information about one another. In causal discovery, conditional
      independencies are crucial because they reveal the underlying structure
      of causal relationships in a model or a directed acyclic graph (DAG). By
      identifying these independencies, we can determine how variables are
      related to each other, or not.
    es: La independencia condicional es un concepto central en la teoría de probabilidad y la estadística
      donde dos variables son independientes entre sí una vez que una tercera variable se mantiene constante.
      Esto significa que, dado el valor de la variable de condicionamiento, las dos variables no proporcionan
      información adicional la una sobre la otra. En el descubrimiento causal, las independencias condicionales
      son cruciales porque revelan la estructura subyacente de las relaciones causales en un modelo o
      un grafo acíclico dirigido (DAG). Al identificar estas independencias, podemos determinar cómo están
      relacionadas las variables entre sí, o no.
  para-6317164c45b4:
    kind: para
