    en: |-
      "Find" the Causal Truth: Dive into the world of causal structures and
      learn how to map out the hidden pathways that influence your outcomes.
      Not consider causal structures will drive you to consider more simple
      causal structures, which can be problematic in a real world enviroment.
    es: '"Encuentra" la Verdad Causal: Sumérgete en el mundo de las estructuras causales y aprende a mapear
      los caminos ocultos que influyen en tus resultados. No considerar las estructuras causales te llevará
      a considerar estructuras más simples, lo cual puede ser problemático en un entorno del mundo real.'
