  para-1a08d8e0d183:
    kind: para
    context: body
    en: |-
      During the notebook, we have seen how we can use bayesian regression
      models to identify the causal structure of a dataset, and how we can use
      this information to make better decisions. We have also seen how we can
      use this information to make better decisions. In short, we start with a
      simple naive understanding of the world, which was evolved through the
