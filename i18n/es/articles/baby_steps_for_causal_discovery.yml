    es: Entonces, ¿por qué es problemático controlar por ciertas variables? Cada variable debería agregar
      más poder explicativo, ¿no? Empecemos a aprender sobre estructuras para entenderlo.
  para-61e28a330bb5:
    kind: para
    context: body
    en: |-
      Statistical Faithfulness: This assumption posits that all and only the
      conditional independence relations observed in the data are those
      implied by the causal graph. In other words, there are no accidental
      cancellations or coincidental independencies beyond what the causal
      structure predicts.
    es: 'Fidelidad Estadística: Esta suposición postula que todas y solo las relaciones de independencia
      condicional observadas en los datos son las implicadas por el grafo causal. En otras palabras, no
      hay cancelaciones accidentales ni independencias coincidentes más allá de lo que la estructura causal
      predice.'
  para-6350664e9a39:
    kind: para
    context: body
    en: |-
      The **Peter-Clark algorithm** is a constraint-based method that infers
      causal structures from observational data using conditional independence
      tests. It starts with a fully connected undirected graph where every
      variable is initially connected to every other variable. The algorithm
      systematically tests conditional independence between pairs of
      variables, conditioning on increasingly larger subsets of other
      variables. When a conditional independence is detected, the
      corresponding edge is removed from the graph.
    es: El **algoritmo Peter-Clark** es un método basado en restricciones que infiere estructuras causales
      a partir de datos observacionales usando pruebas de independencia condicional. Comienza con un grafo
      completamente conectado no dirigido donde cada variable está inicialmente conectada a todas las
      demás. El algoritmo prueba sistemáticamente la independencia condicional entre pares de variables,
      condicionando sobre subconjuntos cada vez más grandes de otras variables. Cuando se detecta una
      independencia condicional, la arista correspondiente se elimina del grafo.
  para-fa6c1d5937d7:
    kind: para
    context: body
    en: |-
      The DAG above represents the causal structure that we are implicitly
      assuming when we fit the model. Here all variables are independent of
