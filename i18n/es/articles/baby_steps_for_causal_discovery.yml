    es: '**Canal $x3$**: Para la última variable, generamos $x3$ que es afectado solo por $x1$.'
  para-5a0684716d79:
    kind: para
    context: body
    en: |-
      **Colliders**: A collider is a variable that is the common effect of two
      or more causal factors. It sits at the convergence of different causal
      paths and can introduce spurious associations when conditioned upon.
      Controlling for a collider can inadvertently open up non-causal,
      backdoor paths, leading to biased estimates. This phenomenon, known as
      collider bias, distorts the true relationships among the causal
      variables. Avoiding conditioning on colliders is crucial for maintaining
      the validity of causal models.
    es: '**Colisionadores**: Un colisionador es una variable que es el efecto común de dos o más factores
      causales. Se sitúa en la convergencia de diferentes vías causales y puede introducir asociaciones
      espurias cuando se condiciona sobre él. Controlar por un colisionador puede abrir inadvertidamente
      vías no causales de retroceso (backdoor), llevando a estimaciones sesgadas. Este fenómeno, conocido
      como sesgo de colisión, distorsiona las relaciones verdaderas entre las variables causales. Evitar
      condicionar sobre colisionadores es crucial para mantener la validez de los modelos causales.'
  para-22e510d51d6d:
    kind: para
    context: body
    en: '**Confounding paths:**'
    es: '**Vías de confusión:**'
  para-f60878f3482d:
    kind: para
    context: body
    en: |-
      **Forks**: A fork is a causal structure where a single variable acts as
      a common cause for two or more other variables. This common cause
      transmits its influence to all its direct descendants. The existence of
      a fork creates confounding, making the relationship between the
      descendant variables appear related. Controlling for the common cause
      can effectively block the backdoor paths created by this structure.
    es: '**Bifurcaciones**: Una bifurcación es una estructura causal donde una sola variable actúa como
      causa común para dos o más variables. Esta causa común transmite su influencia a todos sus descendientes
      directos. La existencia de una bifurcación crea confusión, haciendo que la relación entre las variables
      descendientes parezca estar relacionada. Controlar por la causa común puede bloquear efectivamente
      las vías de retroceso creadas por esta estructura.'
  para-ab328ae31442:
    kind: para
    context: body
    en: '**Mediating path:**'
    es: '**Vía de mediación:**'
  para-bdff1e556bac:
    kind: para
    context: body
    en: '**What needs to be controlled?**'
    es: '**¿Qué necesita ser controlado?**'
  para-c6bd650e77e1:
    kind: para
    context: body
    en: |-
      **Why not control for x3?** Since x3 is a mediator (i.e., it transmits
      part of the effect of x2 to y), including it in your regression would
      block the indirect effect of x2 on y. This "over-control" would result
      in an estimate that reflects only the direct effect of x2 on y, not the
      total effect. Additionally, controlling for mediators can sometimes
      introduce bias if there are other complex relationships in the graph.
    es: '**¿Por qué no controlar por x3?** Dado que x3 es un mediador (es decir, transmite parte del efecto
      de x2 a y), incluirlo en tu regresión bloquearía el efecto indirecto de x2 sobre y. Este "sobre-control"
      resultaría en una estimación que refleja solo el efecto directo de x2 sobre y, no el efecto total.
      Además, controlar por mediadores puede a veces introducir sesgo si existen otras relaciones complejas
      en el grafo.'
  para-00aead078cf3:
    kind: para
    context: body
    en: |-
      Any causal discovery algorithm is based on the assumption that all the
      relevant variables are observed. If some relevant variable is not
      observed, the algorithm will not be able to infer the correct causal
      graph. Each variable, even the unobserved ones, should be represented in
      the dataset, so the algorithm can include them in the causal graph and
      validation tests.
    es: Suposición de Suficiencia Causal
  para-3d063a959a2d:
    kind: para
    context: body
    en: |-
      As a company we probably invest in different channels to acquire new
      customers. Some actions are more direct, like paid ads, and others are
      more indirect, like offline media marketing, as marketers and scientist,
      we want to understand the impact of each channel on the target variable
      (number of new customers).
    es: Como empresa probablemente invertimos en diferentes canales para adquirir nuevos clientes. Algunas
      acciones son más directas, como la publicidad pagada, y otras son más indirectas, como el marketing
      en medios offline. Como profesionales del marketing y científicos, queremos entender el impacto
      de cada canal en la variable objetivo (número de nuevos clientes).
  para-f5f62eb8a49d:
    kind: para
    context: body
    en: |-
      As a result, it enables a consistent estimation of causal effects, even
      when we encounter endogeneity. Therefore, grasping chain structures is
      essential, as it not only supports the rationale behind IV methods but
      also underscores the significance of identifying valid instruments.
    es: Como resultado, permite una estimación consistente de los efectos causales, incluso cuando encontramos
