  para-1b3d90b49f41:
    kind: para
    context: body
    en: |-
      **Chains**: A chain represents a sequential causal pathway where one
      variable influences another, which in turn affects a third variable.
      This structure highlights the mediation process through which causal
      effects are transmitted. The intermediate variable acts as a mediator,
      carrying the influence from the initial cause to the final outcome.
      Analyzing chains helps distinguish between direct and indirect effects
      in a causal system. Controlling for the mediator inappropriately may
      block parts of the causal effect that are of interest.
    es: '**Cadenas**: Una cadena representa una vía causal secuencial donde una variable influye en otra,
      que a su vez afecta a una tercera. Esta estructura destaca el proceso de mediación a través del
      cual se transmiten los efectos causales. La variable intermedia actúa como mediadora, transmitiendo
      la influencia desde la causa inicial hasta el resultado final. Analizar cadenas ayuda a distinguir
      entre efectos directos e indirectos en un sistema causal. Controlar por el mediador de manera inapropiada
      puede bloquear partes del efecto causal que son de interés.'
  para-2504adc38110:
    kind: para
    context: body
    en: |-
      **Channel $x1$**: As mentioned before, we generate $x1$ which is
      affected by the holiday signal, we could define it as:
    es: '**Canal $x1$**: Como mencionamos antes, generamos $x1$ que es afectado por la señal de días festivos,
      podríamos definirlo como:'
  para-ac1a73e7e2fb:
