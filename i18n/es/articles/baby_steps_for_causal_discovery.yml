  para-c85c31744949:
    kind: para
    context: body
    en: |-
      The bias in the reverse regression arises because conditioning on $x_2$
      introduces variability from the noise inherent in $x_2$. This
      misattribution conflates the independent variability of $x_1$ with that
      induced by $x_2$, leading to residuals that systematically deviate from
      zero. Respect to the null model, the residuals are further from zero.
    es: El sesgo en la regresión inversa surge porque condicionar sobre $x_2$ introduce variabilidad del
      ruido inherente en $x_2$. Esta mala atribución confunde la variabilidad independiente de $x_1$ con
      la inducida por $x_2$, llevando a residuos que se desvían sistemáticamente del cero. Respecto al
      modelo nulo, los residuos están más lejos de cero.
  para-783fd4d51e98:
    kind: para
    context: body
    en: |-
      The causal graph capture by greedy search is very similar to the true
      causal graph. Some arrows are directed to variables that are not
      related, but this is expected given the nature of the data, we still
      have noise in the data, and sporious correlations that can't be fully
      falsify by the independence tests. Additionally, the finded graph can
      lie in the markov equivalence class of the true causal graph, meaning
      that there are multiple DAGs that are compatible with the data.
    es: 'El grafo causal capturado por la búsqueda voraz es muy similar al grafo causal verdadero. Algunas
      flechas apuntan a variables que no están relacionadas, pero esto es esperado dada la naturaleza
      de los datos: aún tenemos ruido en los datos y correlaciones espurias que no pueden ser completamente
      falsificadas por las pruebas de independencia. Además, el grafo encontrado puede estar en la clase
      equivalente de Markov del grafo causal verdadero, lo que significa que hay múltiples DAGs compatibles
      con los datos.'
  para-a8160d8be629:
    kind: para
    context: body
    en: |-
      The effect was recovered perfectly, using this model, we can safely
      inform how much we'll get back if we invest in x3. Nevertheless, we need
      to control by holiday and inflation to get the total effect. What happen
      if we don't have this control variables?
    es: El efecto se recuperó perfectamente. Usando este modelo, podemos informar de forma segura cuánto
      obtendremos si invertimos en x3. Sin embargo, necesitamos controlar por día festivo e inflación
      para obtener el efecto total. ¿Qué pasa si no tenemos estas variables de control?
  para-77ba0b77963a:
    kind: para
    context: body
    en: |-
      The explanation is straightforward: by neglecting any causal structure,
      we inadvertently impose one onto the data. The issue lies in our
      assumption of the simplest causal framework, which rarely aligns with
      real-world complexity.
    es: 'La explicación es sencilla: al descuidar cualquier estructura causal, inadvertidamente imponemos
      una sobre los datos. El problema radica en nuestra suposición del marco causal más simple, que rara
      vez se alinea con la complejidad del mundo real.'
  para-4c5e72677379:
    kind: para
    context: body
    en: |-
      The following DAG shows a possible causal structure of the problem.
      Let's say we have the following variables:
    es: 'El siguiente DAG muestra una posible estructura causal del problema. Digamos que tenemos las
      siguientes variables:'
  para-61a10d227a67:
    kind: para
    context: body
    en: |-
      The following example shows the causal graph inferred using the Greedy
      Search algorithm.
    es: El siguiente ejemplo muestra el grafo causal inferido usando el algoritmo de Búsqueda Voraz.
  para-70939e2da262:
    kind: para
    context: body
    en: 'The function used to model the holiday effect is defined as follows:'
    es: 'La función utilizada para modelar el efecto de días festivos se define de la siguiente manera:'
  para-3f3c1a033b38:
    kind: para
    context: body
    en: |-
      The number of possible models we can generate with two out of five
      variables as parents is around 12,000, while having just one parent
      increases that number to approximately 52,000. Interestingly, removing a
      single parent node triples the potential models we can create,
      effectively multiplying the number of possible scenarios.
    es: El número de modelos posibles que podemos generar con dos de cinco variables como padres es de
      alrededor de 12.000, mientras que tener solo un padre aumenta ese número a aproximadamente 52.000.
      Curiosamente, eliminar un solo nodo padre triplica los modelos potenciales que podemos crear, multiplicando
      efectivamente el número de escenarios posibles.
  para-9e8d87c1d68b:
    kind: para
    context: body
    en: |-
      The previous plot shows how the transformations affect each variable,
      and what would be the true contribution after each transformation.
    es: El gráfico anterior muestra cómo las transformaciones afectan a cada variable, y cuál sería la
      contribución real después de cada transformación.
  para-0af1b84dd0d5:
    kind: para
    context: body
    en: |-
      The target variable is a combination of all variables before. The
      mathematical formula can be expressed as:
    es: 'La variable objetivo es una combinación de todas las variables anteriores. La fórmula matemática
      se puede expresar como:'
  para-070fc012e0e3:
    kind: para
    context: body
    en: |-
      These equations allow us to capture the complex dynamics influencing
      each marketing channel: - **Holiday Effects** increase channel activity
      around specific dates, simulating seasonal spikes. - **Cross-channel
      Influences** introduce interdependencies, modeling how one channel's
      success can amplify another's.
    es: 'Estas ecuaciones nos permiten capturar la dinámica compleja que influye en cada canal de marketing:
      - Los **Efectos de Días Festivos** aumentan la actividad del canal alrededor de fechas específicas,
      simulando picos estacionales. - Las **Influencias entre Canales** introducen interdependencias,
      modelando cómo el éxito de un canal puede amplificar el de otro.'
  para-9f034bcf6935:
    kind: para
    context: body
    en: |-
      This creates a complex causal structure, where variables are not fully
      independent and it is not easy to infer the causal impact of each
      channel on the target variable.
    es: Esto crea una estructura causal compleja, donde las variables no son completamente independientes
      y no es fácil inferir el impacto causal de cada canal en la variable objetivo.
  para-deb719afbf82:
    kind: para
    context: body
    en: |-
      This discrepancy underscores the importance of preserving the correct
      causal direction to avoid bias, as reversing the regression violates the
      causal Markov condition.
    es: Esta discrepancia subraya la importancia de preservar la dirección causal correcta para evitar
      sesgo, ya que invertir la regresión viola la condición de Markov causal.
  para-9572e537014c:
    kind: para
    context: body
    en: |-
      This instead of being a problem, is a great news because we can now
      start to work with experimentation to test the current structure, and
      improve it iteratively, without the need to wait for these answers to
      get the right estimates in a regression model.
    es: En lugar de ser un problema, esto es una gran noticia porque ahora podemos empezar a trabajar
      con experimentación para probar la estructura actual, y mejorarla de forma iterativa, sin necesidad
      de esperar a estas respuestas para obtener las estimaciones correctas en un modelo de regresión.
  para-4375664fe399:
    kind: para
    context: body
    en: |-
      This is great! Our new causal graph is more complex, but it is more
      accurate to the one defined before. Nevertheless, we need a significant
      amount of time, and manual work to arrive to this conclusion.
    es: ¡Esto es genial! Nuestro nuevo grafo causal es más complejo, pero es más preciso que el definido
      anteriormente. Sin embargo, necesitamos una cantidad significativa de tiempo y trabajo manual para
      llegar a esta conclusión.
  para-e2f466fa5292:
    kind: para
    context: body
    en: |-
      This latter point aligns with our earlier observation: if we control for
      inappropriate variables, the model fails to recover the true causal
      structure.
    es: 'Este último punto se alinea con nuestra observación anterior: si controlamos por variables inapropiadas,
      el modelo no logra recuperar la verdadera estructura causal.'
  para-3ed52890c08d:
    kind: para
    context: body
    en: |-
      This leads us to which causal DAG we assume is correct, based on our
      previous assumptions. If you recognize this process, congratulations!
      You've created a generative model or Structural Causal Model, with a
      Structural Causal Equation, using PyMC-marketing.
    es: Esto nos lleva a qué DAG causal asumimos como correcto, basándonos en nuestras suposiciones previas.
      Si reconoces este proceso, ¡felicidades! Has creado un modelo generativo o Modelo Causal Estructural,
      con una Ecuación Causal Estructural, usando PyMC-Marketing.
  para-e451cdb8c2da:
    kind: para
    context: body
    en: |-
      This means that each possible graph with N number of variables can be a
      specific model. How many models could we specify if we have 5 variables
      for one target?
    es: Esto significa que cada posible grafo con N número de variables puede ser un modelo específico.
      ¿Cuántos modelos podríamos especificar si tenemos 5 variables para un objetivo?
  para-6b1250ee543d:
    kind: para
    context: body
    en: |-
      This sheds light on the challenges posed by large models:\
      a) As the number of variables increases, the exponential growth in
      potential relationships becomes overwhelming, making it difficult to
      pinpoint our actual situation.\
      b) With more variables, the likelihood of mistakenly controlling for the
      wrong variables also increases.
    es: |-
      Esto arroja luz sobre los desafíos que plantean los modelos grandes:\
      a) A medida que aumenta el número de variables, el crecimiento exponencial en relaciones potenciales se vuelve abrumador, dificultando identificar nuestra situación real.\
      b) Con más variables, la probabilidad de controlar erróneamente por las variables equivocadas también aumenta.
  para-e377108c13e3:
    kind: para
    context: body
    en: |-
      To estimate the total effect of x2 on y without bias, you need to block
      all backdoor (confounding) paths. This means controlling for the common
      causes:
    es: 'Para estimar el efecto total de x2 sobre y sin sesgo, necesitas bloquear todas las vías de retroceso
      (confusión). Esto significa controlar por las causas comunes:'
  para-3fb3df5abada:
    kind: para
    context: body
    en: |-
      To systematically identify potential parent variables in our causal
      graph, we'll create a class that evaluates different regression models
      and compares their residual distributions. This approach leverages the
      principle that when we correctly model the causal direction, residuals
      should be more tightly centered around zero compared to misspecified
      models.
    es: Para identificar sistemáticamente las variables padres potenciales en nuestro grafo causal, crearemos
      una clase que evalúe diferentes modelos de regresión y compare sus distribuciones de residuos. Este
      enfoque aprovecha el principio de que cuando modelamos correctamente la dirección causal, los residuos
      deberían estar más concentrados alrededor de cero en comparación con modelos mal especificados.
  para-437b2febc044:
    kind: para
    context: body
    en: |-
      Ultimately, each of these causal structures exhibits different
      observational behaviors. This means that based on the observational
      data, we can deduce which structure is present, and consecuently
      determinate whats the right variable set to control.
    es: En última instancia, cada una de estas estructuras causales exhibe diferentes comportamientos
      observacionales. Esto significa que, basándonos en los datos observacionales, podemos deducir qué
      estructura está presente y, en consecuencia, determinar cuál es el conjunto correcto de variables
      a controlar.
  para-c2bb30a2fb44:
    kind: para
    context: body
    en: |-
      Understanding the conditional independencies of the variables in our
      dataset allows us to identify the parents of each variable. Currently,
      we have identified that $x_3$ and $x_2$ are children of $x_1$, and $x_1$
      is independent or truly exogenous.
    es: Comprender las independencias condicionales de las variables en nuestro conjunto de datos nos
      permite identificar los padres de cada variable. Actualmente, hemos identificado que $x_3$ y $x_2$
      son hijos de $x_1$, y que $x_1$ es independiente o verdaderamente exógeno.
  para-46c0ba61eafa:
    kind: para
    context: body
    en: |-
      Using this logic, we can identify not only independent variables but
      also the candidate parents for each variable based on how they deviate
      from the null model.
    es: Usando esta lógica, podemos identificar no solo variables independientes sino también los padres
      candidatos para cada variable basándonos en cómo se desvían del modelo nulo.
  para-aae88c541e9a:
    kind: para
    context: body
    en: We can again, update our causal graph to reflect the new findings.
    es: Podemos nuevamente actualizar nuestro grafo causal para reflejar los nuevos hallazgos.
  para-2a5868356b9f:
    kind: para
    context: body
    en: We can now use this information to update our causal graph.
    es: Ahora podemos usar esta información para actualizar nuestro grafo causal.
  para-879eee3240ad:
    kind: para
    context: body
    en: |-
      We can repeat this process for all the variables in our dataset to start
      to identify the parents of each variable, and thus identifying sections
      of the true causal graph.
    es: Podemos repetir este proceso para todas las variables en nuestro conjunto de datos para empezar
      a identificar los padres de cada variable, y así identificar secciones del grafo causal verdadero.
  para-f79535362206:
    kind: para
    context: body
    en: |-
      We can scale the full dataset and we'll have finally something very
      similar to reality.
    es: Podemos escalar el conjunto de datos completo y finalmente tendremos algo muy similar a la realidad.
  para-3dd4847cdab0:
    kind: para
    context: body
    en: |-
      We can see by the parameters of the model is able to recover the effect
      of x2 on y, even though we removed x3 from the model.
    es: Podemos ver por los parámetros del modelo que es capaz de recuperar el efecto de x2 sobre y, aunque
      eliminamos x3 del modelo.
  para-4810e6201054:
    kind: para
    context: body
    en: |-
      We'll assume all of marketing activities suffer the same transformations
      Adstock and Saturation. This means, each channel will have individual
      parameters for the selected transformations, in this case Geometrick
      adstock and michaelis menten.
    es: Asumiremos que todas las actividades de marketing sufren las mismas transformaciones de Adstock
      y Saturación. Esto significa que cada canal tendrá parámetros individuales para las transformaciones
      seleccionadas, en este caso adstock geométrico y Michaelis-Menten.
  para-78523fc2cfcc:
    kind: para
    context: body
    en: |-
      We'll start by setting the date range. Here we'll use a date range from
      2022-01-01 to 2024-11-06, meaning we have almost 3 years of data (1041
      days).
    es: Comenzaremos estableciendo el rango de fechas. Aquí usaremos un rango de fechas del 2022-01-01
      al 2024-11-06, lo que significa que tenemos casi 3 años de datos (1041 días).
  para-a73a9c48c768:
    kind: para
    context: body
    en: |-
      What kind of causal structure are we implicitly assuming when we fit the
      model?
    es: ¿Qué tipo de estructura causal estamos asumiendo implícitamente cuando ajustamos el modelo?
  para-d6659ccf23e1:
    kind: para
    context: body
    en: |-
      When regressing $x_2$ on $x_1$, the model leverages the causal
      direction, and the conditional distribution $P(x_2 \mid do(x_1))$ is
      more concentrated than the marginal $P(x_2)$. This results in residuals
      that are centered around zero, indicating that most variability in $x_2$
      is explained by $x_1$.
    es: Al regresar $x_2$ sobre $x_1$, el modelo aprovecha la dirección causal, y la distribución condicional
      $P(x_2 \mid do(x_1))$ está más concentrada que la marginal $P(x_2)$. Esto resulta en residuos centrados
      alrededor de cero, indicando que la mayor parte de la variabilidad en $x_2$ es explicada por $x_1$.
  para-589357cfd48b:
    kind: para
    context: body
    en: |-
      Where: - $\Delta t$ is the time difference (in days) between the current
      date and the holiday date. - $\sigma$ is the standard deviation that
      controls the spread of the effect around the holiday date.
    es: 'Donde: - $\Delta t$ es la diferencia de tiempo (en días) entre la fecha actual y la fecha festiva.
      - $\sigma$ es la desviación estándar que controla la dispersión del efecto alrededor de la fecha
      festiva.'
  para-1b30854ff7a7:
    kind: para
    context: body
    en: |-
      Where: - $t$: The time index, representing days since the start of the
      date range. - $baseline$: A constant added to $t$ to shift the starting
      point of the trend. This value affects the initial level of market
      growth. The starting value of the function will be
      $(baseline)^{exponent} - 1$, not 0. - $exponent$: The power to which the
      time index is raised, determining the rate at which the trend
      accelerates over time.
    es: 'Donde: - $t$: El índice temporal, representando los días desde el inicio del rango de fechas.
      - $baseline$: Una constante sumada a $t$ para desplazar el punto de inicio de la tendencia. Este
      valor afecta el nivel inicial de crecimiento del mercado. El valor inicial de la función será $(baseline)^{exponent}
      - 1$, no 0. - $exponent$: La potencia a la que se eleva el índice temporal, determinando la tasa
      a la que la tendencia se acelera con el tiempo.'
  para-f0c5e92c1c2b:
    kind: para
    context: body
    en: |-
      Where: - **Intercept**: A baseline level of sales, set to 1.5,
      representing the base sales level in the absence of other effects. -
      **Inflation**: Represents the underlying market inflation, with an
      implicit negative coefficient of 1, adding a steady downward
      influence. - **Holiday Contributions**: Adds sales spikes around holiday
      periods, capturing the seasonal increase in consumer demand. -
      **$m(Impressions_{x3_t})$ and $m(Impressions_{x2_t})$**: Represent the
      **saturated adstock** values for the marketing channels $x3$ and $x2$. -
      **Noise $\epsilon$**: A small random error term, drawn from a normal
      distribution with mean 0 and standard deviation 0.08, to account for
      unexplained variability in sales.
    es: 'Donde: - **Intercepto**: Un nivel base de ventas, establecido en 1.5, representando el nivel
      base de ventas en ausencia de otros efectos. - **Inflación**: Representa la inflación subyacente
      del mercado, con un coeficiente negativo implícito de 1, añadiendo una influencia descendente constante.
      - **Contribuciones de Días Festivos**: Añade picos de ventas alrededor de los períodos festivos,
      capturando el aumento estacional en la demanda del consumidor. - **$m(Impressions_{x3_t})$ y $m(Impressions_{x2_t})$**:
      Representan los valores de **adstock saturado** para los canales de marketing $x3$ y $x2$. - **Ruido
      $\epsilon$**: Un término de error aleatorio pequeño, extraído de una distribución normal con media
      0 y desviación estándar 0.08, para dar cuenta de la variabilidad inexplicada en las ventas.'
  para-e3bb1f1ed337:
    kind: para
    context: body
    en: |-
      While this approach provides a good initial signal for causal
      relationships, it has limitations. The method assumes linear
      relationships, doesn't account for hidden confounders, and may struggle
      with complex causal structures. Results should be considered as
      preliminary evidence rather than definitive proof of causal
      relationships.
    es: Aunque este enfoque proporciona una buena señal inicial para las relaciones causales, tiene limitaciones.
      El método asume relaciones lineales, no tiene en cuenta los factores de confusión ocultos, y puede
      tener dificultades con estructuras causales complejas. Los resultados deben considerarse como evidencia
      preliminar más que como prueba definitiva de relaciones causales.
  para-4572d92d3f24:
    kind: para
    context: body
    en: |-
      Why do this on top of the causal discovery we have already done? The
      reason is that we can use the mediation analysis to verify the causal
      relationships we have identified, becuase if a node is parent the other
      then some effect is mediated, if we can detect that mediation, then we
      can decide if the causal relationship is direct or indirect. If we fail
      to detect mediation, then probably our findings are not robust to the
      causal discovery we have done.
    es: ¿Por qué hacer esto sobre el descubrimiento causal que ya hemos realizado? La razón es que podemos
      usar el análisis de mediación para verificar las relaciones causales que hemos identificado, porque
      si un nodo es padre del otro, entonces algún efecto está mediado. Si podemos detectar esa mediación,
      entonces podemos decidir si la relación causal es directa o indirecta. Si no logramos detectar mediación,
      entonces probablemente nuestros hallazgos no son robustos al descubrimiento causal que hemos realizado.
  para-dff316fea92f:
    kind: para
    context: body
    en: |-
      Yes, it is possible! We can use causal discovery algorithms to automate
      this process.
    es: ¡Sí, es posible! Podemos usar algoritmos de descubrimiento causal para automatizar este proceso.
  para-303991ab7b79:
    kind: para
    context: body
    en: |-
      You've even defined the direction of your relationships. By defining
      these relationships and assuming no direct causal connections between
      our variables, we can conclude that, if the nature of their relationship
      is accurately represented by the provided equation, then by controlling
      the relevant channels, we could uncover their true effects.
    es: Incluso has definido la dirección de tus relaciones. Al definir estas relaciones y asumir que
      no hay conexiones causales directas entre nuestras variables, podemos concluir que, si la naturaleza
      de su relación está representada con precisión por la ecuación proporcionada, entonces al controlar
      los canales relevantes, podríamos descubrir sus verdaderos efectos.
  para-61f483d20333:
    kind: para
    context: body
    en: |-
      where $x_1$ is exogenous and independent of any effects. This structure
      reflects that $x_1$'s distribution remains unchanged regardless of the
      downstream variable $x_2$.
    es: donde $x_1$ es exógeno e independiente de cualquier efecto. Esta estructura refleja que la distribución
      de $x_1$ permanece sin cambios independientemente de la variable aguas abajo $x_2$.
  plain-62abb49798c9:
    kind: plain
    context: body
    en: Causal Sufficiency Assumption
    es: Suposición de Suficiencia Causal
