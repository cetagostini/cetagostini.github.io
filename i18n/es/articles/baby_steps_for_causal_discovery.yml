  para-0cde32e92170:
    kind: para
    context: body
    en: |-
      On the other hand, **Greedy Search** is a score-based method that
      iteratively improves a candidate causal model by locally modifying its
      structure. It begins with an initial directed acyclic graph and
      evaluates a scoring metric that balances goodness-of-fit with model
      complexity. The algorithm explores modifications such as adding,
      deleting, or reversing edges to find local improvements in the score. At
      each iteration, it selects the change that produces the highest increase
      in the score, following a step-by-step improvement strategy. The search
      continues until no single modification can further enhance the model's
      score. This method efficiently navigates the combinatorial search space
      of possible graphs by making locally optimal choices.
    es: Por otro lado, **Búsqueda Voraz** es un método basado en puntuación que mejora iterativamente
      un modelo causal candidato modificando localmente su estructura. Comienza con un grafo acíclico
      dirigido inicial y evalúa una métrica de puntuación que equilibra el ajuste con la complejidad del
      modelo. El algoritmo explora modificaciones como agregar, eliminar o invertir aristas para encontrar
      mejoras locales en la puntuación. En cada iteración, selecciona el cambio que produce el mayor aumento
      en la puntuación, siguiendo una estrategia de mejora paso a paso. La búsqueda continúa hasta que
      ninguna modificación individual puede mejorar más la puntuación del modelo. Este método navega eficientemente
      por el espacio de búsqueda combinatorio de grafos posibles mediante decisiones localmente óptimas.
  para-2b8fd258ff33:
