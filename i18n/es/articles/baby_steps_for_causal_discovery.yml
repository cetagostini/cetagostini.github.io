  para-2bd5a21b09c7:
    kind: para
    context: body
    en: |-
      In a causal system where the true direction is $x_1$ to $x_2$, the joint
      distribution factorizes as $$
      P(x_1, x_2) = P(x_1) \, P(x_2 \mid x_1),
      $$
    es: |-
      En un sistema causal donde la dirección verdadera es $x_1$ a $x_2$, la distribución conjunta se factoriza como $$
      P(x_1, x_2) = P(x_1) \, P(x_2 \mid x_1),
      $$
  para-72d945ea98da:
    kind: para
    context: body
    en: |-
      In contrast, reversing the regression by modeling $x_1$ as a function of
      $x_2$ disrupts the causal order. The conditional distribution
      $P(x_1 \mid do(x2))$ deviates from the true marginal $P(x_1)$, as it
      attempts to capture the cause from its effect, which is not supported by
      the causal structure.
    es: En contraste, invertir la regresión modelando $x_1$ como función de $x_2$ interrumpe el orden
      causal. La distribución condicional $P(x_1 \mid do(x2))$ se desvía de la marginal verdadera $P(x_1)$,
      ya que intenta capturar la causa a partir de su efecto, lo cual no está respaldado por la estructura
      causal.
  para-6fe2604732e2:
    kind: para
    context: body
    en: |-
      In mediation analysis, the total effect of a predictor $X1$ on a target
      $T$ is decomposed into direct and indirect components. The indirect
      effect operates through a mediator $M$, modeled as
      $M = \alpha_m + a \times X1 + \text{error}$. Simultaneously, the outcome
      is modeled as $T = \alpha_y + c' \times X1 + b \times M + \text{error}$.
      Here, the product $a \times b$ quantifies the indirect effect, while
      $c'$ represents the direct effect of $X1$ on $T$. By estimating these
      coefficients, we can assess whether the influence of $X1$ on $T$ is
      transmitted via $M$, entirely direct, or a combination of both.
      Statistical inference is performed using credible intervals, where
      intervals excluding zero indicate significant effects.
    es: En el análisis de mediación, el efecto total de un predictor $X1$ sobre un objetivo $T$ se descompone
      en componentes directos e indirectos. El efecto indirecto opera a través de un mediador $M$, modelado
      como $M = \alpha_m + a \times X1 + \text{error}$. Simultáneamente, el resultado se modela como $T
      = \alpha_y + c' \times X1 + b \times M + \text{error}$. Aquí, el producto $a \times b$ cuantifica
      el efecto indirecto, mientras que $c'$ representa el efecto directo de $X1$ sobre $T$. Al estimar
      estos coeficientes, podemos evaluar si la influencia de $X1$ sobre $T$ se transmite a través de
      $M$, es completamente directa, o una combinación de ambas. La inferencia estadística se realiza
      usando intervalos credibles, donde los intervalos que excluyen cero indican efectos significativos.
  para-de4430acd29d:
    kind: para
    context: body
    en: |-
      In simple terms, mediation analysis helps us determine whether a
      predictor $X1$ influences an outcome $T$ directly or mainly by first
      affecting a mediator $M$, which then impacts $T$. If the mediator's
      effect is significant while the direct effect is not, it suggests that
      $X1$ affects $T$ primarily through its influence on $M$.
    es: En términos simples, el análisis de mediación nos ayuda a determinar si un predictor $X1$ influye
      en un resultado $T$ directamente o principalmente al afectar primero a un mediador $M$, que luego
      impacta a $T$. Si el efecto del mediador es significativo mientras que el efecto directo no lo es,
      sugiere que $X1$ afecta a $T$ principalmente a través de su influencia sobre $M$.
