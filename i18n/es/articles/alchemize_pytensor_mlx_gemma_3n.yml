    context: body
    en: Write the equations once
    es: Escribe las ecuaciones una sola vez
  list-item-0f54e37e4dfa:
    kind: list-item
    context: list
    en: |-
      **A graph you can open.** Every operation is inspectable and rewritable.
      You can ask what a rewrite changed instead of trusting a black box.
    es: '**Un grafo que puedes abrir.** Cada operación es inspeccionable y reescribible. Puedes preguntar
      qué cambió una reescritura en vez de confiar en una caja negra.'
  list-item-6d22104d1860:
    kind: list-item
    context: list
    en: |-
      **Building LLM inference in PyTensor is straightforward.** Weight
      loaders, symbolic transformers, KV caches, generation loops, and
      numerical validation---all assembled from Python without modifying the
      framework.
    es: '**Construir inferencia LLM en PyTensor es sencillo.** Cargadores de pesos, transformadores simbólicos,
      caches KV, bucles de generación y validación numérica — todo ensamblado desde Python sin modificar
      el framework.'
  list-item-ced24aee7fe7:
    kind: list-item
    context: list
    en: |-
      **Independent logits beat plausible prose.** Exact tokens and
      all-position numerical agreement are stronger evidence than
      plausible-looking text.
    es: '**Los logits independientes superan a la prosa plausible.** Tokens exactos y concordancia numérica
      en todas las posiciones son evidencia más fuerte que un texto que simplemente parece correcto.'
  list-item-dd86d2233184:
    kind: list-item
    context: list
    en: |-
      **Inference that composes.** The model is a graph inside the scientific
      Python stack---chain it with a PyMC posterior, a SciPy optimizer, or any
      custom computation, all in the same framework.
    es: '**Inferencia que compone.** El modelo es un grafo dentro del ecosistema científico de Python
      — encadénalo con un posterior de PyMC, un optimizador de SciPy o cualquier cálculo personalizado,
      todo en el mismo framework.'
  list-item-4476eac090b5:
    kind: list-item
    context: list
    en: |-
      **One definition, any backend.** The same symbolic equations compile
      through C, Numba, MLX, or JAX. Swapping hardware targets is a
      one-argument change, not a rewrite.
    es: '**Una definición, cualquier backend.** Las mismas ecuaciones simbólicas se compilan a través
      de C, Numba, MLX o JAX. Cambiar el objetivo de hardware es un cambio de un argumento, no una reescritura.'
  list-item-9bc0e8d35fa9:
    kind: list-item
    context: list
    en: |-
      **One symbolic definition survives multiple backends.** Gemma 3n
      executes through C/CVM, Numba, and MLX without a second model
      implementation.
    es: '**Una definición simbólica sobrevive a múltiples backends.** Gemma 3n se ejecuta a través de
      C/CVM, Numba y MLX sin una segunda implementación del modelo.'
  list-item-d9f5fc732373:
    kind: list-item
    context: list
    en: |-
      **PyTensor and `llama.cpp` are complementary.** `llama.cpp` owns
      production serving. PyTensor owns graph transparency and composability
      with scientific Python.
    es: '**PyTensor y `llama.cpp` son complementarios.** `llama.cpp` domina el serving en producción.
      PyTensor domina la transparencia del grafo y la composabilidad con Python científico.'
  list-item-a9988e436e90:
    kind: list-item
    context: list
    en: |-
      **PyTensor is a general graph compiler.** PyMC is its most visible
      consumer, not the boundary of what it can express.
    es: '**PyTensor es un compilador de grafos general.** PyMC es su consumidor más visible, no el límite
      de lo que puede expresar.'
  list-item-54947065d633:
    kind: list-item
    context: list
    en: |-
      **PyTensor** is the Python-native graph compiler for studying,
      modifying, and composing LLM inference. You do not just run a
      model---you can ask what a rewrite changed, compile the same equations
      through another linker, chain inference with a Bayesian posterior or a
      custom optimization loop, and validate every contract numerically.
    es: '**PyTensor** es el compilador de grafos nativo en Python para estudiar, modificar y componer
      inferencia LLM. No solo ejecutas un modelo — puedes preguntar qué cambió una reescritura, compilar
      las mismas ecuaciones a través de otro linker, encadenar la inferencia con un posterior Bayesiano
      o un bucle de optimización personalizado, y validar cada contrato numéricamente.'
  list-item-6e74f45039b8:
    kind: list-item
    context: list
    en: |-
      **The remaining gaps are engineering, not architecture.** Native
      quantized kernels, paged KV caching, mmap zero-copy loading, and broader
      backend coverage are all buildable on PyTensor's existing foundation.
      The pytensor-ml project has already begun this work.
    es: '**Las brechas restantes son de ingeniería, no de arquitectura.** Kernels cuantizados nativos,
      cacheo KV paginado, carga mmap zero-copy y cobertura más amplia de backends son todo construible
      sobre el fundamento existente de PyTensor. El proyecto pytensor-ml ya ha comenzado este trabajo.'
  list-item-38910fd52bf5:
    kind: list-item
    context: list
    en: |-
      **`llama.cpp`** is the C++ engine for running any GGUF model fast. It
      owns the full serving stack: quantized kernels, KV cache management,
      continuous batching, broad architecture support. If you need to serve
      models at production scale today, `llama.cpp` is the answer.
    es: '**`llama.cpp`** es el motor en C++ para ejecutar cualquier modelo GGUF rápido. Posee todo el
      stack de serving: kernels cuantizados, gestión de cache KV, batching continuo y soporte amplio de
      arquitecturas. Si necesitas servir modelos a escala de producción hoy, `llama.cpp` es la respuesta.'
