    es: Controles de calidad del muestreador
  plain-b59664c1be08:
    kind: plain
    context: body
    en: Spill-graph structural invariants (by construction)
    es: Invariancias estructurales del grafo de derrame (por construcción)
  plain-48bf46c57b7a:
    kind: plain
    context: body
    en: |-
      The Caracas--Valencia corridor, roughly 124.9 km end to end. Broadcast,
      search, and ecommerce are the kinds of mechanism that could carry media
      effects across a corridor like this one.
    es: El corredor Caracas--Valencia, aproximadamente 124.9 km de extremo a extremo. Radiodifusión, búsqueda
      y comercio electrónico son los tipos de mecanismo que podrían transportar efectos mediáticos a través
      de un corredor como este.
  plain-b81dba5f159f:
    kind: plain
    context: body
    en: |-
      The target changes by the shape of media from the other city, not by
      random noise. An independent-city MMM has no named component for the
      shaded difference.
    es: El objetivo cambia por la forma del medio de la otra ciudad, no por ruido aleatorio. Un MMM de
      ciudades independientes no tiene un componente nombrado para la diferencia sombreada.
  plain-6c899e0350ac:
    kind: plain
    context: body
    en: The whole API idea
    es: La idea completa de la API
  plain-3395a1409bf7:
    kind: plain
    context: body
    en: |-
      Valencia pools two source routes, so its city-level lift is more
      informative than either route split. Caracas receives one route; its
      city and route uncertainty coincide.
    es: Valencia agrupa dos rutas de origen, por lo que su elevación a nivel de ciudad es más informativa
      que cualquiera de las divisiones por ruta. Caracas recibe una ruta; su incertidumbre a nivel de
      ciudad y de ruta coincide.
