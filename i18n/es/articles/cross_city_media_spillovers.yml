  list-item-7333017e9646:
    kind: list-item
    context: list
    en: $C_{r,t}$ is the contribution of the observed controls;
    es: $C_{r,t}$ es la contribución de los controles observados;
  list-item-df27ae05ee1c:
    kind: list-item
    context: list
    en: $M_{r,s,k}\in\{0,1\}$ is the pre-specified route mask;
    es: $M_{r,s,k}\in\{0,1\}$ es la máscara de rutas pre-especificada;
  list-item-448f12822034:
    kind: list-item
    context: list
    en: $S_{r,t}$ is the total spill arriving in receiving city $r$;
    es: $S_{r,t}$ es el derrame total que llega a la ciudad receptora $r$;
  list-item-20a183b3debf:
    kind: list-item
    context: list
    en: |-
      $\beta_{r}$ is the baseline, the intercept the model learns for city
      $r$;
    es: $\beta_{r}$ es la línea base, el intercepto que el modelo aprende para la ciudad $r$;
  list-item-b15df26c32f9:
    kind: list-item
    context: list
    en: $\epsilon_{r,t}$ is the residual noise.
    es: $\epsilon_{r,t}$ es el ruido residual.
  list-item-c33b043e2ea6:
    kind: list-item
    context: list
    en: |-
      $\mu^{\text{direct}}_{r,t}$ is the contribution of that city's own
      media, after adstock and saturation;
    es: $\mu^{\text{direct}}_{r,t}$ es la contribución de los medios propios de esa ciudad, después de
      adstock y saturación;
  list-item-ecdaceea8a73:
    kind: list-item
    context: list
    en: |-
      $\rho_{s,k}$ is the learned share exported by source city $s$ and
      channel $k$;
    es: $\rho_{s,k}$ es la proporción aprendida exportada por la ciudad de origen $s$ y el canal $k$;
  list-item-0bd9fdbef450:
    kind: list-item
    context: list
    en: |-
      $g_{s,k}(X_{s,k,t})$ is the direct contribution evaluated from the same
      model graph after adstock and saturation;
    es: $g_{s,k}(X_{s,k,t})$ es la contribución directa evaluada desde el mismo grafo del modelo después
      de adstock y saturación;
  list-item-454585c30349:
    kind: list-item
    context: list
    en: |-
      **Adjacent-category TV demand.** A TV spot for one product category may
      shift demand toward a related category that shares shelf space.
    es: '**Demanda de TV en categorías adyacentes.** Un anuncio de TV para una categoría de producto puede
      desplazar la demanda hacia una categoría relacionada que comparte espacio en anaquel.'
  list-item-82e21d1c5dbc:
    kind: list-item
    context: list
    en: |-
      **Causal geo experiments.** Randomized geographic holdouts or switchback
      designs remain the strongest tool for identifying cross-market effects.
      An observational model can represent the mechanism; an experiment can
      measure it.
    es: '**Experimentos geo causales.** Las retenciones geográficas aleatorizadas o los diseños de switchback
      siguen siendo la herramienta más sólida para identificar efectos entre mercados. Un modelo observacional
      puede representar el mecanismo; un experimento puede medirlo.'
  list-item-129307e09a2c:
    kind: list-item
    context: list
    en: |-
      **Hierarchical geo-level models.** [Sun et
      al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3804.pdf)
      pool response information across geographies with partial pooling. That
      can reduce data sparsity, but it does not explicitly route exposure from
      a source city to a receiver.
    es: '**Modelos geo jerárquicos.** [Sun et al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3804.pdf)
      agrupan información de respuesta entre geografías con agrupamiento parcial. Eso puede reducir la
      dispersión de datos, pero no enruta explícitamente la exposición de una ciudad de origen a una receptora.'
  list-item-5748cf0dd883:
    kind: list-item
    context: list
    en: |-
      **Independent city MMMs encode a strong assumption.** They say media
      cannot move outcomes across city boundaries.
    es: '**Los MMM de ciudades independientes codifican una suposición fuerte.** Dicen que los medios
      no pueden mover resultados a través de las fronteras de la ciudad.'
  list-item-b5c08ae4c5aa:
    kind: list-item
    context: list
    en: |-
      **Outcome-dependent spill.** The current mask is fixed before seeing the
      data. If spill magnitude depends on the receiver city's demand state,
      the routing needs a richer structure --- for example, a multiplicative
      interaction or a state-dependent kernel.
    es: '**Derrame dependiente del resultado.** La máscara actual se fija antes de ver los datos. Si la
      magnitud del derrame depende del estado de demanda de la ciudad receptora, el enrutamiento necesita
      una estructura más rica ---por ejemplo, una interacción multiplicativa o un kernel dependiente del
      estado.'
  list-item-c17437536226:
    kind: list-item
    context: list
    en: |-
      **Paid-search brand halo.** A national brand campaign can lift branded
      search conversions in regions where no search ads were active that week.
    es: '**Halo de búsqueda de marca pagada.** Una campaña de marca nacional puede elevar las conversiones
      de búsqueda de marca en regiones donde no hubo anuncios de búsqueda activos esa semana.'
  list-item-739542db7fc6:
    kind: list-item
    context: list
    en: |-
      **PyMC-Marketing already exposes the right seam.** A custom `MuEffect`
      adds the missing mechanism without rewriting the base MMM.
    es: '**PyMC-Marketing ya expone la costura correcta.** Un `MuEffect` personalizado agrega el mecanismo
      faltante sin reescribir el MMM base.'
  list-item-93e62995be80:
    kind: list-item
    context: list
    en: |-
      **Receiver-specific response and adstock.** A receiver city may respond
      to the same channel with a different lag structure or saturation curve.
      Estimating those separately costs more parameters but captures
      asymmetric timing.
    es: '**Respuesta y adstock específicos del receptor.** Una ciudad receptora puede responder al mismo
      canal con una estructura de retardo o curva de saturación diferente. Estimar esas por separado cuesta
      más parámetros pero captura una temporalidad asimétrica.'
  list-item-2935aaf150a5:
    kind: list-item
    context: list
    en: |-
      **Register spatial coordinates and the pre-specified route mask.**
      `create_data` adds a `spend_city` coordinate (mirroring `city`) and
      stores the Boolean path mask as a model constant. The mask comes from
      prior business knowledge---broadcast footprints, campaign eligibility,
      distribution territories---not from the outcome.
    es: '**Registrar coordenadas espaciales y la máscara de rutas pre-especificada.** `create_data` agrega
      una coordenada `spend_city` (espejo de `city`) y almacena la máscara booleana de rutas como una
      constante del modelo. La máscara proviene de conocimiento empresarial previo ---coberturas de radiodifusión,
      elegibilidad de campañas, territorios de distribución--- no del resultado.'
  list-item-e7eafcef1100:
    kind: list-item
    context: list
    en: |-
      **Representation is not identification.** The model can express spill
      and quantify uncertainty, but causal claims still require a credible
      design.
    es: '**La representación no es identificación.** El modelo puede expresar derrame y cuantificar incertidumbre,
      pero las afirmaciones causales aún requieren un diseño creíble.'
  list-item-6cb7699f12a4:
    kind: list-item
    context: list
    en: |-
      **Retail-store proximity.** A new store opening can cannibalise sales at
      nearby locations --- a geographic spillover in the opposite direction.
    es: '**Proximidad de tiendas minoristas.** La apertura de una nueva tienda puede canibalizar ventas
      en ubicaciones cercanas ---un derrame geográfico en la dirección opuesta.'
  list-item-4af1e6832081:
    kind: list-item
    context: list
    en: |-
      **Richer kernels.** Gaussian-process or spectral kernels over geographic
      distance can capture gradual decay rather than binary route presence.
    es: '**Kernels más ricos.** Los kernels de procesos gaussianos o espectrales sobre distancia geográfica
      pueden capturar una degradación gradual en lugar de presencia binaria de ruta.'
  list-item-7076af5c018e:
    kind: list-item
    context: list
    en: |-
      **Route the model-owned direct contribution to the receiving city and
      return `(date, city)`.** The effect reads `channel_contribution` from
      the model's own forward pass, multiplies by the bounded share and the
      route mask, and sums over sources.
    es: '**Enrutar la contribución directa del modelo a la ciudad receptora y devolver `(date, city)`.**
      El efecto lee `channel_contribution` del pase hacia adelante propio del modelo, multiplica por la
      proporción acotada y la máscara de rutas, y suma sobre los orígenes.'
  list-item-c61ce9b0984e:
    kind: list-item
    context: list
    en: |-
      **Sample bounded spill shares only on active source-channel pairs.**
      `create_effect` wraps a `MaskedPrior` over a $\operatorname{Beta}(1,1)$
      base prior, so only the allowed routes receive a free parameter.
    es: '**Muestrear proporciones de derrame acotadas solo en pares canal-ciudad activos.** `create_effect`
      envuelve un `MaskedPrior` sobre un prior base $\operatorname{Beta}(1,1)$, así que solo las rutas
      permitidas reciben un parámetro libre.'
  list-item-7a05e9b08477:
    kind: list-item
    context: list
    en: |-
      **Sparsity belongs in the graph.** `MaskedPrior` creates three
      coefficients for three plausible routes; it does not waste computation
      estimating seventeen coefficients that I rule out by design.
    es: '**La dispersidad pertenece al grafo.** `MaskedPrior` crea tres coeficientes para tres rutas plausibles;
      no desperdicia cómputo estimando diecisiete coeficientes que yo descarto por diseño.'
  list-item-a9f96f8995e7:
    kind: list-item
    context: list
    en: |-
      **The PyMC-Marketing extension:** a custom `MuEffect` that routes a
      share of one city's media contribution into another city's mean.
    es: '**La extensión de PyMC-Marketing:** un `MuEffect` personalizado que enruta una proporción de
      la contribución mediática de una ciudad a la media de otra ciudad.'
  list-item-e7c1563ebf8a:
    kind: list-item
    context: list
    en: |-
      **The data laboratory:** two synthetic cities with three known spill
      routes, each carrying exactly 10% of the source channel's true
      contribution.
    es: '**El laboratorio de datos:** dos ciudades sintéticas con tres rutas de derrame conocidas, cada
      una transportando exactamente el 10% de la contribución verdadera del canal de origen.'
  list-item-c1675c3be746:
    kind: list-item
    context: list
    en: |-
      **The result:** sampler diagnostics, direct-effect recovery, and
      posterior spill recovery against known ground truth.
    es: '**El resultado:** diagnósticos del muestreador, recuperación del efecto directo y recuperación
      del derrame posterior contra la verdad conocida.'
  list-item-2ed4636dbfd5:
    kind: list-item
    context: list
    en: |-
      **The source response curve should be reused.** Spill inherits the
      source channel's modeled adstock and saturation instead of estimating a
      duplicate curve.
    es: '**La curva de respuesta del origen debe reutilizarse.** El derrame hereda el adstock y la saturación
      modelados del canal de origen en lugar de estimar una curva duplicada.'
  list-item-f3012f7c7560:
    kind: list-item
    context: list
    en: |-
      **The sparse policy:** `MaskedPrior` samples only three plausible spill
      coefficients rather than all twenty source-city-by-channel candidates.
    es: '**La política dispersa:** `MaskedPrior` muestrea solo tres coeficientes de derrame plausibles
      en lugar de los veinte candidatos de ciudad origen por canal.'
