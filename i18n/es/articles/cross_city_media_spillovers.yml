    en: |-
      the sum returns one spill contribution for each receiving city $r$ and
      week $t$.
    es: la suma devuelve una contribución de derrame para cada ciudad receptora $r$ y semana $t$.
  para-b45d532eb6f5:
    kind: para
    context: body
    en: |-
      "I fit one marketing mix model per city, so every campaign belongs to
      the city where I booked the spend."
    es: '"Ajusto un modelo de mezcla de marketing por ciudad, así que cada campaña pertenece a la ciudad
      donde registré el gasto."'
  para-427e0184601b:
    kind: para
    context: body
    en: |-
      $r$ is a city index, $t$ is a time index, and everything on the
      right-hand side is learned from that city's own spend, its own controls,
      and its own target. Many teams also carry a seasonality term. I leave it
      out here so the only structural difference between the two models in
      this article is the one the article is about. This is the base formula,
      and the most common in industry.
    es: $r$ es un índice de ciudad, $t$ es un índice de tiempo, y todo el lado derecho se aprende del
      gasto propio de esa ciudad, sus propios controles y su propio objetivo. Muchos equipos también incluyen
      un término de estacionalidad. Lo omito aquí para que la única diferencia estructural entre los dos
      modelos de este artículo sea la que el artículo trata. Esta es la fórmula base, y la más común en
      la industria.
  para-44bf6c435692:
    kind: para
    context: body
    en: |-
      **Could I just add the other city's raw spend as controls?** I could,
      but then I would estimate a second response curve disconnected from the
      source campaign's adstock and saturation. Reusing the source
      contribution is both more parsimonious and easier to interpret.
    es: '**¿Podría simplemente agregar el gasto bruto de la otra ciudad como control?** Podría, pero entonces
      estimaría una segunda curva de respuesta desconectada del adstock y la saturación de la campaña
      de origen. Reutilizar la contribución del origen es tanto más parsimonioso como más fácil de interpretar.'
  para-a46dd54885e6:
    kind: para
    context: body
    en: |-
      **Which cross-market route in your own media plan is currently being
      forced to look like noise?**
    es: '**¿Qué ruta entre mercados en tu propio plan de medios está siendo obligada actualmente a parecer
      ruido?**'
  para-01ac2a8170ee:
    kind: para
    context: body
    en: |-
      A multidimensional `MMM(dims=("city",))` already produces
      `channel_contribution` with city and channel coordinates. A custom
      `MuEffect` can read that tensor, route a bounded share to another city,
      and return a `(date, city)` contribution to the model mean.
    es: Un `MMM(dims=("city",))` multidimensional ya produce `channel_contribution` con coordenadas de
      ciudad y canal. Un `MuEffect` personalizado puede leer ese tensor, enrutar una proporción acotada
      a otra ciudad, y devolver una contribución `(date, city)` a la media del modelo.
  para-66712fcc94ac:
    kind: para
    context: body
    en: |-
      A posterior is only useful after it passes basic sampler diagnostics.
      The thresholds in that gate---zero divergences, $\hat{R} < 1.01$, and
      effective sample sizes above 400---follow standard MCMC practice.
      Divergent transitions signal regions of high curvature where the sampler
      cannot explore reliably ([Betancourt, 2017,
      §6.2](https://arxiv.org/abs/1701.02434)). The $\hat{R}$ threshold and
      the ESS floor of 400 total draws (≈100 per chain with four chains) come
      from the rank-normalized convergence diagnostic of [Vehtari et
      al. (2021)](https://arxiv.org/abs/1903.08008).
    es: Un posterior solo es útil después de pasar los diagnósticos básicos del muestreador. Los umbrales
      de ese control ---cero divergencias, $\hat{R} < 1.01$, y tamaños de muestra efectiva superiores
      a 400--- siguen la práctica estándar de MCMC. Las transiciones divergentes señalan regiones de alta
      curvatura donde el muestreador no puede explorar de manera confiable ([Betancourt, 2017, §6.2](https://arxiv.org/abs/1701.02434)).
      El umbral de $\hat{R}$ y el piso de ESS de 400 muestras totales (≈100 por cadena con cuatro cadenas)
      provienen del diagnóstico de convergencia por normalización de rangos de [Vehtari et al. (2021)](https://arxiv.org/abs/1903.08008).
  para-c05efc5304a0:
    kind: para
    context: body
    en: |-
      A regular MMM predicts the target $Y_{r,t}$ in receiving city $r$ at
      week $t$ as a sum of different components:
    es: 'Un MMM regular predice el objetivo $Y_{r,t}$ en la ciudad receptora $r$ en la semana $t$ como
      una suma de diferentes componentes:'
  para-6d5fafd0e6a3:
    kind: para
    context: body
    en: |-
      Because channels and targets are max-scaled, the response priors below
      live on a comparable scale across cities. A positive intercept removes a
      spurious negative-baseline mode, while a log-normal half-saturation
      prior keeps the sampler away from a zero-boundary funnel. These are
      identifiability and sampling choices, not evidence about the spill
      routes.
    es: Dado que los canales y objetivos están escalados al máximo, los priors de respuesta a continuación
      viven en una escala comparable entre ciudades. Un intercepto positivo elimina un modo de línea base
      negativa espuria, mientras que un prior de media log-normal mantiene al muestreador lejos de un
      embudo en el límite cero. Estas son decisiones de identificabilidad y muestreo, no evidencia sobre
      las rutas de derrame.
  para-4b2e19223614:
    kind: para
    context: body
    en: |-
      Because the spill term is a share of a contribution that has already
      been through that chain, it arrives in the receiving city carrying the
      source channel's own carryover and saturation.
    es: Como el término de derrame es una proporción de una contribución que ya pasó por esa cadena, llega
      a la ciudad receptora cargando el propio adstock y la saturación del canal de origen.
  para-e068b0578318:
    kind: para
    context: body
    en: |-
      Before trusting the spill result, I check the base MMM. Each point below
      is one active own-city channel. Perfect cumulative recovery lies on the
      diagonal. Several paths are close; Facebook, Programmatic Display, and
      Email are understated. That miss matters: spill inherits the source
      channel's modeled contribution, so error in direct attribution travels
      with it.
    es: 'Antes de confiar en el resultado del derrame, verifico el MMM base. Cada punto a continuación
      es un canal propio activo de la ciudad. La recuperación acumulada perfecta yace en la diagonal.
      Varias trayectorias están cerca; Facebook, Programmatic Display y Email están subestimados. Ese
      fallo importa: el derrame hereda la contribución modelada del canal de origen, así que el error
      en la atribución directa viaja con él.'
  para-560f0ee195ab:
    kind: para
    context: body
    en: 'But it is not the only solution. Other approaches worth considering:'
    es: 'Pero no es la única solución. Otros enfoques que vale la pena considerar:'
  para-6aba51a1fb55:
    kind: para
    context: body
    en: |-
      Each path transfers 10% of the source channel's true own-city
      contribution. Everything else is structurally absent.
    es: Cada trayectoria transfiere 10% de la contribución verdadera del canal de origen en su propia
      ciudad. Todo lo demás está estructuralmente ausente.
  para-f7e8f92a22df:
    kind: para
    context: body
    en: |-
      Even with the right route graph, endogenous campaign placement can mimic
      spill. If regional demand raises Caracas spend and Valencia sales at the
      same time, the posterior can load that shared movement onto $\rho$.
      Geographic experiments, reach data, and institutional knowledge remain
      part of the identification strategy.
    es: Incluso con el grafo de rutas correcto, la colocación endógena de campañas puede simular derrame.
      Si la demanda regional eleva el gasto en Caracas y las ventas en Valencia al mismo tiempo, el posterior
      puede cargar ese movimiento compartido en $\rho$. Los experimentos geográficos, los datos de alcance
      y el conocimiento institucional siguen siendo parte de la estrategia de identificación.
  para-c827758b6820:
    kind: para
    context: body
    en: |-
      Finally, I return to the business unit: weekly sales contribution in the
      receiving city.
    es: 'Finalmente, regreso a la unidad de negocio: contribución semanal a las ventas en la ciudad receptora.'
  para-ce513751bef9:
    kind: para
    context: body
    en: |-
      First the sampler diagnostics and the structural invariants, then what
      the data can actually say about the size of the three allowed routes.
    es: Primero los diagnósticos del muestreador y las invariancias estructurales, luego lo que los datos
      realmente pueden decir sobre el tamaño de las tres rutas permitidas.
  para-3a44b6e3f2ef:
    kind: para
    context: body
    en: First, the notebook setup and the imports.
    es: Primero, la configuración del notebook y las importaciones.
  para-dff0cdefc297:
    kind: para
    context: body
    en: |-
      Here $S_{r,t}$ is the spill arriving in receiving city $r$: a bounded
      share of the direct contribution that another city's media already
      produced. Every route share is capped at $\rho_{\max}$, so one route can
      never move more than $\rho_{\max}$ of its source contribution across the
      border. In this article $\rho_{\max}=0.20$ and the synthetic truth is
      $0.10$.
    es: 'Aquí $S_{r,t}$ es el derrame que llega a la ciudad receptora $r$: una proporción acotada de la
      contribución directa que los medios de otra ciudad ya produjeron. Cada proporción de ruta está limitada
      a $\rho_{\max}$, así que una ruta nunca puede mover más de $\rho_{\max}$ de su contribución de origen
      a través de la frontera. En este artículo $\rho_{\max}=0.20$ y la verdad sintética es $0.10$.'
  para-c4a1c69e4d33:
    kind: para
    context: body
    en: |-
      I call this class `SpillEffect`. It inherits PyMC-Marketing's
      [`MuEffect`](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.additive_effect.html)
      protocol.
    es: Llamo a esta clase `SpillEffect`. Hereda el protocolo [`MuEffect`](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.additive_effect.html)
      de PyMC-Marketing.
  para-006ba2bed2e5:
    kind: para
    context: body
    en: I model
    es: Modelo
  para-ca3ceb3df5f6:
    kind: para
    context: body
    en: |-
      I name them **Caracas** and **Valencia**. The names are a convenience:
      the two real cities sit close enough to make a cross-city corridor easy
      to picture, not because these synthetic routes describe anything that
      happens between them. Each has ten media channels, two observed
      controls, and 104 weekly observations. Three direct media paths reach
      the *other* city:
    es: 'Las llamo **Caracas** y **Valencia**. Los nombres son una comodidad: las dos ciudades reales
      están lo suficientemente cerca como para hacer que un corredor entre ciudades sea fácil de imaginar,
      no porque estas rutas sintéticas describan algo que suceda entre ellas. Cada una tiene diez canales
      de medios, dos controles observados y 104 observaciones semanales. Tres trayectorias de medios directos
      alcanzan la *otra* ciudad:'
  para-5be5da2980d6:
    kind: para
    context: body
    en: |-
      It matters that the multiplier stays there. Adstock is linear, so a
      scalar does pass through it:
      $\text{adstock}(\rho x) = \rho \cdot \text{adstock}(x)$. Saturation is
      not, so $\rho \cdot f(\bar{x}) \neq f(\rho \bar{x})$ --- pushing the
      share inside the curve would move the half-saturation point and bend the
      response into a different shape. Applying the share after saturation is
      what keeps the receiving city on the source city's response curve
      instead of a distorted copy of it.
    es: 'Importa que el multiplicador se quede ahí. El adstock es lineal, así que un escalar sí pasa a
      través: $\text{adstock}(\rho x) = \rho \cdot \text{adstock}(x)$. La saturación no lo es, así que
      $\rho \cdot f(\bar{x}) \neq f(\rho \bar{x})$ ---empujar la proporción dentro de la curva movería
      el punto de media saturación y doblaría la respuesta en una forma diferente. Aplicar la proporción
      después de la saturación es lo que mantiene a la ciudad receptora en la curva de respuesta de la
      ciudad de origen en lugar de una copia distorsionada.'
  para-067011094f8a:
    kind: para
    context: body
    en: |-
      Let $V$ and $C$ abbreviate Valencia and Caracas, and let $\tau_{s,k,t}$
      denote channel $k$'s true own-city contribution in source city $s$ at
      week $t$. Then:
    es: 'Sea $V$ y $C$ abreviaturas de Valencia y Caracas, y sea $\tau_{s,k,t}$ la contribución verdadera
      del canal $k$ en su propia ciudad de origen $s$ en la semana $t$. Entonces:'
  para-d812d4dc0ce4:
    kind: para
    context: body
    en: |-
      Like any other MMM, the model transforms spend before it reaches the
      mean: [geometric
      adstock](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.adstock.GeometricAdstock.html)
      followed by [Michaelis-Menten
      saturation](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.saturation.MichaelisMentenSaturation.html).
      That is the same carryover-and-shape idea described by [Jin et
      al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3806.pdf),
      though not the same functional form: their paper uses a Hill response
      curve, and Michaelis-Menten is the member of that family with the
      exponent fixed at one.
    es: 'Como cualquier otro MMM, el modelo transforma el gasto antes de que llegue a la media: [adstock
      geométrico](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.adstock.GeometricAdstock.html)
      seguido de [saturación Michaelis-Menten](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.saturation.MichaelisMentenSaturation.html).
      Esa es la misma idea de retención y forma descrita por [Jin et al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3806.pdf),
      aunque no la misma forma funcional: su artículo usa una curva de respuesta Hill, y Michaelis-Menten
      es el miembro de esa familia con el exponente fijado en uno.'
  para-46b6232650da:
    kind: para
    context: body
    en: |-
      Most of the class is named tensor bookkeeping. The actual model change
      is the short chain inside `create_effect`:
    es: 'La mayor parte de la clase es contabilidad de tensores con nombres. El cambio real del modelo
      es la cadena corta dentro de `create_effect`:'
  para-36ad2653c426:
    kind: para
    context: body
    en: |-
      Now the synthetic data. I start from two weekly time series --- think
      cities, regions, or countries --- generated independently of each other,
      and then add spill from one to the other, in both directions.
    es: Ahora los datos sintéticos. Empiezo con dos series de tiempo semanales ---piensa en ciudades,
      regiones o países--- generadas independientemente una de otra, y luego agrego derrame de una a la
      otra, en ambas direcciones.
  para-c7305005a7cc:
    kind: para
    context: body
    en: |-
      Reusing the source contribution and masking a handful of plausible
      routes is the easiest way to add cross-market spill when the source
      city's adstock and saturation shapes are already well estimated. The
      effect reads one tensor, multiplies by a small coefficient, and returns
      a contribution of the right dimension. That parsimony is the point.
    es: Reutilizar la contribución del origen y enmascarar un puñado de rutas plausibles es la forma más
      fácil de agregar derrame entre mercados cuando las formas de adstock y saturación de la ciudad de
      origen ya están bien estimadas. El efecto lee un tensor, multiplica por un coeficiente pequeño,
      y devuelve una contribución de la dimensión correcta. Esa parsimonia es el punto.
  para-8f36d04ee571:
    kind: para
    context: body
    en: |-
      Separately, I verify structural invariants encoded by the tensor
      algebra: diagonal routes are exactly zero, inactive paths remain zero,
      and every spill share stays below the 20% cap. These are implementation
      sanity checks, not posterior-quality diagnostics.
    es: 'Por separado, verifico invariancias estructurales codificadas por el álgebra de tensores: las
      rutas diagonales son exactamente cero, las trayectorias inactivas permanecen en cero, y cada proporción
      de derrame se mantiene por debajo del tope del 20%. Estas son verificaciones de cordura de la implementación,
      no diagnósticos de calidad del posterior.'
  para-26817ded4e0b:
    kind: para
    context: body
    en: |-
      Spill parameters are coupled to the source response curve. If direct
      adstock or saturation is weakly identified, spill will be weakly
      identified too. Check divergences, r-hat, bulk and tail ESS, and
      direct-effect recovery before interpreting the cross-city posterior.
    es: Los parámetros de derrame están acoplados a la curva de respuesta del origen. Si el adstock o
      la saturación directa están débilmente identificados, el derrame también lo estará. Verifique divergencias,
      r-hat, ESS de cola y masa, y la recuperación del efecto directo antes de interpretar el posterior
      entre ciudades.
  para-62f6ef1b0b5c:
    kind: para
    context: body
    en: |-
      That model may predict well. It still has no route where a source city
      $s$ differs from the receiving city $r$. The shaded signal in
      @fig-target-spill must leak into direct attribution, the baseline,
      controls, or residual noise.
    es: Ese modelo puede predecir bien. Aún no tiene ruta donde una ciudad de origen $s$ difiera de la
      ciudad receptora $r$. La señal sombreada en @fig-target-spill debe filtrarse en la atribución directa,
      la línea base, los controles o el ruido residual.
  para-6c2d8e0de0e3:
    kind: para
    context: body
    en: |-
      The Bayesian measurement lens now becomes an engineering constraint:
      preserve the source response, fix the routes supplied by prior
      knowledge, and estimate only their uncertain magnitudes.
    es: 'La lente de medición Bayesiana ahora se convierte en una restricción de ingeniería: preservar
      la respuesta del origen, fijar las rutas proporcionadas por el conocimiento previo, y estimar solo
      sus magnitudes inciertas.'
  para-2aec3d21ca9f:
    kind: para
    context: body
    en: |-
      The algebra is the whole argument: $\rho_{s,k}$ scales the ceiling
      $\alpha_{s,k}$ and leaves the half-saturation $\lambda_{s,k}$ untouched.
      A multiplier applied after saturation is therefore identical to fitting
      a separate saturation curve for each route, with capacity
      $\rho_{s,k} \cdot \alpha_{s,k}$ and the same $\lambda_{s,k}$ --- the
      same contribution, at one parameter instead of two.
    es: 'El álgebra es todo el argumento: $\rho_{s,k}$ escala el techo $\alpha_{s,k}$ y deja la media
      saturación $\lambda_{s,k}$ sin tocar. Un multiplicador aplicado después de la saturación es por
      lo tanto idéntico a ajustar una curva de saturación separada para cada ruta, con capacidad $\rho_{s,k}
      \cdot \alpha_{s,k}$ y el mismo $\lambda_{s,k}$ ---la misma contribución, con un parámetro en lugar
      de dos.'
  para-a4c7833faebc:
    kind: para
    context: body
    en: |-
      The contribution files (`caracas_contributions.csv`,
      `valencia_contributions.csv`) record the true channel-level
      decomposition used for scoring. Their magnitudes remain held out; the
      only information derived from that decomposition and supplied to the MMM
      is the six-path direct-activity mask I build later, when the model is
      assembled. The likelihood otherwise sees the target, observed media
      spend, and controls.
    es: Los archivos de contribución (`caracas_contributions.csv`, `valencia_contributions.csv`) registran
      la verdadera descomposición a nivel de canal usada para la evaluación. Sus magnitudes permanecen
      reservadas; la única información derivada de esa descomposición y proporcionada al MMM es la máscara
      de actividad directa de seis rutas que construyo más tarde, cuando se ensambla el modelo. La verosimilitud
      por lo demás ve el objetivo, el gasto mediático observado y los controles.
  para-8fecffa0d2a7:
    kind: para
    context: body
    en: |-
      The direct contribution of source channel $k$ in city $s$, after adstock
      and Michaelis-Menten saturation, is
    es: La contribución directa del canal de origen $k$ en la ciudad $s$, después de adstock y saturación
      Michaelis-Menten, es
  para-fde9a1823d35:
    kind: para
    context: body
    en: |-
      The extension's main test is therefore not "did every path land exactly
      on 10%?" It is: **what can the data distinguish once the correct
      mechanism exists?**
    es: 'La prueba principal de la extensión no es por lo tanto "¿cada trayectoria dio exactamente 10%?"
      Es: **¿qué pueden distinguir los datos una vez que existe el mecanismo correcto?**'
  para-9ba2b5793725:
    kind: para
    context: body
    en: |-
      The familiar model fits each city with its own channels, controls, and
      baseline:
    es: 'El modelo familiar ajusta cada ciudad con sus propios canales, controles y línea base:'
  para-33b583047629:
    kind: para
    context: body
    en: |-
      The framework's final discipline is to separate what was encoded from
      what was learned: the route mask supplied the possible cross-city paths,
      while the posterior quantified their uncertain shares.
    es: 'La disciplina final del marco es separar lo que fue codificado de lo que fue aprendido: la máscara
      de rutas proporcionó las posibles trayectorias entre ciudades, mientras que el posterior cuantificó
      sus proporciones inciertas.'
  para-8ba9a86b1647:
    kind: para
    context: body
    en: |-
      The graph above is computational, not causal. It is a focused subgraph
      of the built PyMC model: raw channel spend enters through adstock and
      saturation, produces `channel_contribution`, and the `SpillEffect`
      multiplies that tensor by the bounded spill share and route mask. The
      diagram stops at `spill_contribution` for readability; the base MMM then
      adds that output to its direct, baseline, and control terms in the
      target likelihood.
    es: 'El grafo de arriba es computacional, no causal. Es un subgrafo enfocado del modelo PyMC construido:
      el gasto bruto del canal entra a través de adstock y saturación, produce `channel_contribution`,
      y el `SpillEffect` multiplica ese tensor por la proporción de derrame acotada y la máscara de rutas.
      El diagrama se detiene en `spill_contribution` para mayor legibilidad; el MMM base luego agrega
      esa salida a sus términos directo, de línea base y de controles en la verosimilitud del objetivo.'
  para-72b73ee411db:
    kind: para
    context: body
    en: |-
      The hierarchy in these results is the lesson. Valencia's individual
      route shares are broad while their city-level total is close to truth.
      Caracas has only one incoming route, so its city and route uncertainty
      coincide. Every interval carries direct-response uncertainty forward:
      adding the right mechanism does not manufacture information; it makes
      the remaining uncertainty legible.
    es: 'La jerarquía en estos resultados es la lección. Las proporciones de rutas individuales de Valencia
      son amplias mientras que su total a nivel de ciudad está cerca de la verdad. Caracas tiene solo
      una ruta entrante, así que su incertidumbre a nivel de ciudad y de ruta coincide. Cada intervalo
      lleva la incertidumbre de la respuesta directa: agregar el mecanismo correcto no fabrica información;
      hace que la incertidumbre restante sea legible.'
  para-ce0d4a298d8a:
    kind: para
    context: body
    en: 'The likelihood family stays the same. One term is added to the mean:'
    es: 'La familia de verosimilitud permanece igual. Un término se agrega a la media:'
  para-0e6f5d932f07:
    kind: para
    context: body
    en: |-
      The model graph should contain exactly three free spill parameters. That
      is the computational payoff of the mask.
    es: El grafo del modelo debe contener exactamente tres parámetros de derrame libres. Esa es la recompensa
      computacional de la máscara.
  para-e082716454ee:
    kind: para
    context: body
    en: |-
      The multiplier is fixed at 10% in the data-generating process. The model
      will not receive those contribution columns; they remain behind the
      curtain for scoring.
    es: El multiplicador está fijado en 10% en el proceso generador de datos. El modelo no recibirá esas
      columnas de contribución; permanecen detrás del telón para evaluación.
  para-1112f761d280:
    kind: para
    context: body
    en: |-
      The panel that enters the MMM contains 208 weekly rows (104 weeks × 2
      cities). Each row carries the ten raw media-spend channels, two observed
      controls, and the sales target. The generator writes two panel files ---
      `mmm_data_raw.csv` for the observables and `mmm_data_contributions.csv`
      for the true per-channel decomposition used only in scoring ---
      alongside the per-city inputs and contribution breakdowns under `data/`.
    es: El panel que entra al MMM contiene 208 filas semanales (104 semanas × 2 ciudades). Cada fila lleva
      los diez canales de gasto mediático bruto, dos controles observados y el objetivo de ventas. El
      generador escribe dos archivos de panel ---`mmm_data_raw.csv` para los observables y `mmm_data_contributions.csv`
      para la verdadera descomposición por canal usada solo en evaluación--- junto con las entradas por
      ciudad y desgloses de contribución bajo `data/`.
  para-837d0f908ecb:
    kind: para
    context: body
    en: |-
      The practical "so what?" is budget allocation. If a campaign creates
      value outside the market where spend is booked, city-by-city
      optimization can understate its return and shift money away from
      campaigns with regional reach. A small modeling extension can change
      which city receives credit --- and therefore which campaign survives the
      next planning round.
    es: El "¿y qué?" práctico es la asignación de presupuesto. Si una campaña crea valor fuera del mercado
      donde se registra el gasto, la optimización ciudad por ciudad puede subestimar su retorno y desviar
      dinero de campañas con alcance regional. Una pequeña extensión de modelado puede cambiar qué ciudad
      recibe crédito ---y por lo tanto qué campaña sobrevive la próxima ronda de planificación.
  para-9c9ffc831c3a:
    kind: para
    context: body
    en: |-
      The remainder of this article will delve into the details of that line.
      We'll start with the business context, followed by the equation, the
      tensor shapes, and finally, we'll present the complete class.
    es: El resto de este artículo profundizará en los detalles de esa línea. Comenzaremos con el contexto
      empresarial, seguido de la ecuación, las formas de los tensores, y finalmente presentaremos la clase
      completa.
  para-708a5eebfbdd:
    kind: para
    context: body
    en: |-
      The representative rows below show a subset of the columns the MMM
      actually sees.
    es: Las filas representativas a continuación muestran un subconjunto de las columnas que el MMM realmente
      ve.
  para-daf9d7e446e5:
    kind: para
    context: body
    en: |-
      The silver lining is that
      [PyMC-Marketing](https://www.pymc-marketing.io/) offers us an extension
      point to address this issue. We can maintain the foundational
      multidimensional `MMM`, implement an additive `MuEffect`, outline the
      possible routes using a Boolean mask, and seamlessly register it with a
      single line:
    es: 'El lado positivo es que [PyMC-Marketing](https://www.pymc-marketing.io/) nos ofrece un punto
      de extensión para abordar este problema. Podemos mantener el `MMM` multidimensional base, implementar
      un `MuEffect` aditivo, esbozar las rutas posibles usando una máscara booleana, y registrarlo sin
      fricciones con una sola línea:'
  para-2c0ad814dd83:
    kind: para
    context: body
    en: |-
      The source-unit $\to$ receiver-unit structure appears whenever one
      marketing touch creates value outside its original target:
    es: 'La estructura unidad de origen $\to$ unidad receptora aparece siempre que un punto de contacto
      de marketing crea valor fuera de su objetivo original:'
  para-77330de97669:
    kind: para
    context: body
    en: |-
      The spill model multiplies that already-saturated contribution by the
      route share $\rho_{s,k}$, giving the amount a single route delivers to
      the receiving city:
    es: 'El modelo de derrame multiplica esa contribución ya saturada por la proporción de ruta $\rho_{s,k}$,
      dando la cantidad que una sola ruta entrega a la ciudad receptora:'
  para-180c90ad93d5:
    kind: para
    context: body
    en: |-
      The takeaway is pragmatic: start with the simplest version that respects
      the business structure, check whether the posterior is identifiable, and
      add complexity only when the data and the question demand it.
    es: 'La conclusión es pragmática: empezar con la versión más simple que respete la estructura empresarial,
      verificar si el posterior es identificable, y agregar complejidad solo cuando los datos y la pregunta
      lo demanden.'
  para-2b4bcc99863d:
    kind: para
    context: body
    en: |-
      The three allowed paths came from the experiment design. In a real
      organization, they might come from broadcast footprints, campaign
      eligibility, distribution territories, ecommerce shipping patterns, or a
      pre-registered spill hypothesis. `MaskedPrior` makes that assumption
      computationally honest, but it does not validate it.
    es: Las tres trayectorias permitidas vinieron del diseño del experimento. En una organización real,
      podrían venir de coberturas de radiodifusión, elegibilidad de campañas, territorios de distribución,
      patrones de envío de comercio electrónico, o una hipótesis de derrame pre-registrada. `MaskedPrior`
      hace que esa suposición sea computacionalmente honesta, pero no la valida.
  para-824b3ca9d8f2:
    kind: para
    context: body
    en: |-
      The wrapped prior is sampled only where the mask is `True`, then
      expanded back to the full labeled tensor with exact zeros elsewhere.
    es: El prior envuelto se muestrea solo donde la máscara es `True`, luego se expande al tensor etiquetado
      completo con ceros exactos en todas las demás posiciones.
  para-0ec116f4faaa:
    kind: para
    context: body
    en: |-
      These are reasons to *consider* shared mechanisms in your own data, not
      evidence that the Caracas-Valencia routes in this demonstration exist in
      any real market.
    es: Estas son razones para *considerar* mecanismos compartidos en tus propios datos, no evidencia
      de que las rutas Caracas-Valencia en esta demostración existan en algún mercado real.
  para-64738f2b044c:
    kind: para
    context: body
    en: 'This article walks you through:'
    es: 'Este artículo te guía a través de:'
  para-1c5cfbabb449:
    kind: para
    context: body
    en: |-
      This is the Bayesian measurement payoff: the model can preserve a
      credible route graph while admitting that the data identify an aggregate
      receiving-city effect more sharply than its route-by-route allocation.
    es: 'Esta es la recompensa de medición Bayesiana: el modelo puede preservar un grafo de rutas creíble
      mientras admite que los datos identifican un efecto agregado de ciudad receptora con más nitidez
      que su asignación ruta por ruta.'
  para-5c1d6c1a1c43:
    kind: para
    context: body
    en: |-
      This is the controlled failure. **The problem is not that the base MMM
      is badly implemented. The problem is that its mean function cannot
      express the business mechanism.**
    es: Este es el fracaso controlado. **El problema no es que el MMM base esté mal implementado. El problema
      es que su función de media no puede expresar el mecanismo empresarial.**
  para-8e21695f5bb8:
    kind: para
    context: body
    en: |-
      This reporting convention can be quite beneficial, but it doesn't always
      reflect the complexities of the real world. Media doesn't know about
      boundaries; for instance, a launch in Caracas might boost branded
      searches in Valencia. Additionally, a creator campaign targeting
      Valencia could generate orders in entirely different locations. If we
      insist on treating each city as an isolated unit, those extra orders
      don't just vanish; rather, the model simply mislabels them.
    es: Esta convención de reporte puede ser bastante beneficiosa, pero no siempre refleja las complejidades
      del mundo real. Los medios no conocen las fronteras; por ejemplo, un lanzamiento en Caracas podría
      impulsar búsquedas de marca en Valencia. Además, una campaña de creadores dirigida a Valencia podría
      generar pedidos en ubicaciones completamente diferentes. Si insistimos en tratar cada ciudad como
      una unidad aislada, esos pedidos extra no simplemente desaparecen; más bien, el modelo simplemente
      los etiqueta mal.
  para-87dfd1837c0d:
    kind: para
    context: body
    en: |-
      To keep the demonstration about spill rather than variable selection,
      the synthetic generator supplies a pre-specified direct activity mask:
      six city-channel response curves are known to exist before the MMM is
      fitted. It is not inferred from the observed target. In real work,
      define that mask from channel availability, prior business knowledge, or
      a proper variable-selection strategy.
    es: 'Para mantener la demostración sobre el derrame en lugar de la selección de variables, el generador
      sintético proporciona una máscara de actividad directa pre-especificada: se sabe que existen seis
      curvas de respuesta ciudad-canal antes de que el MMM se ajuste. No se infiere del objetivo observado.
      En trabajo real, defina esa máscara a partir de la disponibilidad de canales, conocimiento empresarial
      previo, o una estrategia adecuada de selección de variables.'
  para-af5386361139:
    kind: para
    context: body
    en: |-
      Today I approach this as a **Bayesian measurement problem with
      structural knowledge**. I design a mask that encodes which cross-city
      routes the business considers possible, and the posterior estimates how
      large those allowed effects are. That distinction matters. I am not
      running causal discovery to find out whether a route exists; I assume
      the topology and estimate the magnitudes. In causal-inference terms this
      is an [interference
      problem](https://pmc.ncbi.nlm.nih.gov/articles/PMC2600548/): exposure
      assigned to one unit can change another unit's outcome.
    es: 'Hoy abordo esto como un **problema de medición Bayesiana con conocimiento estructural**. Diseño
      una máscara que codifica qué rutas entre ciudades considera posibles el negocio, y el posterior
      estima qué tan grandes son esos efectos permitidos. Esa distinción importa. No estoy ejecutando
      descubrimiento causal para averiguar si una ruta existe; asumo la topología y estimo las magnitudes.
      En términos de inferencia causal, este es un [problema de interferencia](https://pmc.ncbi.nlm.nih.gov/articles/PMC2600548/):
      la exposición asignada a una unidad puede cambiar el resultado de otra unidad.'
  para-81d9657198a7:
    kind: para
    context: body
    en: 'Where:'
    es: 'Donde:'
  para-6fade5354fd7:
    kind: para
    context: body
    en: |-
      With two cities and ten channels, there are twenty possible
      source-city-by-channel spill coefficients. In this synthetic design, I
      allow three. The other seventeen should not be weakly regularized or
      estimated near zero. They should not exist in the graph.
    es: Con dos ciudades y diez canales, hay veinte posibles coeficientes de derrame de ciudad origen
      por canal. En este diseño sintético, permito tres. Los otros diecisiete no deberían estar débilmente
      regularizados ni estimados cerca de cero. No deberían existir en el grafo.
  para-fe569e6846c0:
    kind: para
    context: body
    en: |-
      With two cities, every exporting source has only one possible receiver.
      With three or more, a source channel may reach several markets. I would
      then need either receiver-specific shares $\rho_{r,s,k}$ or a total
      exported share plus an allocation simplex. The `MuEffect` protocol stays
      the same; only the routing tensor becomes richer.
    es: Con dos ciudades, cada origen exportador tiene solo un posible receptor. Con tres o más, un canal
      de origen puede alcanzar varios mercados. Entonces necesitaría proporciones específicas del receptor
      $\rho_{r,s,k}$ o una proporción exportada total más un simplejo de asignación. El protocolo `MuEffect`
      permanece igual; solo el tensor de enrutamiento se vuelve más rico.
  para-2019558a9245:
    kind: para
    context: body
    en: 'Written out route by route, the new term is:'
    es: 'Escrito ruta por ruta, el nuevo término es:'
  para-c208036728c9:
    kind: para
    context: body
    en: '`SpillEffect` has three responsibilities:'
    es: '`SpillEffect` tiene tres responsabilidades:'
  para-7f302e9d5853:
    kind: para
    context: body
    en: |-
      where $\bar{x}_{s,k,t}$ is the adstocked spend, $\alpha_{s,k}$ is the
      saturation capacity (the asymptotic ceiling), and $\lambda_{s,k}$ is the
      half-saturation constant (the spend level at which contribution reaches
      half the ceiling).
    es: donde $\bar{x}_{s,k,t}$ es el gasto con adstock, $\alpha_{s,k}$ es la capacidad de saturación
      (el techo asintótico), y $\lambda_{s,k}$ es la constante de media saturación (el nivel de gasto
      al cual la contribución alcanza la mitad del techo).
  para-dca317f10e2c:
    kind: para
    context: body
    en: 'where:'
    es: 'donde:'
  para-483d92803a27:
    kind: para
    context: body
    en: |-
      with $\rho_{\max}=0.20$. The synthetic truth is 0.10, so it sits inside
      --- not on the boundary of --- the model's plausible interval.
    es: con $\rho_{\max}=0.20$. La verdad sintética es 0.10, así que se encuentra dentro ---no en el límite
      del--- intervalo plausible del modelo.
  plain-e84a1ce8b74b:
    kind: plain
    context: body
    en: |-
      All three 94% intervals contain the known 10% share, but the route-level
      posteriors remain wide. The graph can represent the mechanism without
      pretending that every route is sharply identified.
    es: Los tres intervalos del 94% contienen la proporción conocida del 10%, pero los posteriores a nivel
      de ruta permanecen amplios. El grafo puede representar el mecanismo sin pretender que cada ruta
      está nítidamente identificada.
  plain-da326eb74daa:
    kind: plain
    context: body
    en: Check identifiability before interpreting spill
    es: Verificar la identificabilidad antes de interpretar el derrame
  plain-91407175542a:
    kind: plain
    context: body
    en: Cumulative cross-city contribution by receiving city
    es: Contribución acumulada entre ciudades por ciudad receptora
  plain-0b4f54342b39:
    kind: plain
    context: body
    en: Cumulative direct-contribution recovery
    es: Recuperación acumulada de la contribución directa
  plain-1342b1799067:
    kind: plain
    context: body
    en: |-
      Direct-contribution recovery is good for some channels and materially
      low for Facebook, Programmatic Display, and Email. Because spill reuses
      these paths, direct attribution uncertainty propagates into spill
      attribution.
    es: La recuperación de la contribución directa es buena para algunos canales y significativamente
      baja para Facebook, Programmatic Display y Email. Como el derrame reutiliza estas rutas, la incertidumbre
      de la atribución directa se propaga a la atribución del derrame.
  plain-4c14731cf832:
    kind: plain
    context: body
    en: |-
      Focused PyMC dependency graph for the custom spill branch. It is
      generated from the built model, but it is a computational graph---not a
      causal DAG or evidence of causal identification.
    es: Grafo de dependencia de PyMC enfocado en la rama personalizada de derrame. Se genera a partir
      del modelo construido, pero es un grafo computacional ---no un DAG causal ni evidencia de identificación
      causal.
  plain-88165873a0cc:
    kind: plain
    context: body
    en: Input panel schema
    es: Esquema del panel de entrada
  plain-70f5b0c108fa:
    kind: plain
    context: body
    en: |-
      MaskedPrior turns twenty possible source-city-by-channel coefficients
      into three sampled parameters. The remaining seventeen are structural
      zeros, not uncertain near-zero estimates.
    es: MaskedPrior convierte veinte posibles coeficientes de ciudad origen por canal en tres parámetros
      muestreados. Los diecisiete restantes son ceros estructurales, no estimaciones inciertas cercanas
      a cero.
  plain-5b4f1fa4ebb0:
    kind: plain
    context: body
    en: |-
      Observed spend flows into each city's unobserved response oval. Three
      green edges cross the boundary: Caracas Facebook and Google Search
      contribute 10% each to Valencia response; Valencia Linear TV contributes
      10% to Caracas response.
    es: 'El gasto observado fluye al óvalo de respuesta no observado de cada ciudad. Tres aristas verdes
      cruzan la frontera: Facebook y Google Search de Caracas contribuyen 10% cada uno a la respuesta
      de Valencia; Linear TV de Valencia contribuye 10% a la respuesta de Caracas.'
  plain-f9aeedba18c3:
    kind: plain
    context: body
    en: Posterior spill shares by allowed route
    es: Proporciones de derrame posteriores por ruta permitida
  plain-e679c14ca60e:
    kind: plain
