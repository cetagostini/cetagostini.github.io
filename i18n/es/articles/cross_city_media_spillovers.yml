meta:
  title:
    en: 'Media Does Not Stop at the City Border: Cross-City Spillovers with PyMC-Marketing'
    es: 'Los medios no se detienen en la frontera de la ciudad: derrames entre ciudades con PyMC-Marketing'
  pagetitle:
    en: ''
    es: ''
  description:
    en: A geo-level Bayesian MMM with sparse cross-city spillovers built on PyMC-Marketing MuEffect, MaskedPrior,
      and a pre-specified route mask for multi-market media measurement.
    es: Un MMM Bayesiano a nivel geográfico con derrames dispersos entre ciudades, construido con MuEffect
      y MaskedPrior de PyMC-Marketing, y una máscara de rutas pre-especificada para la medición de medios
      en múltiples mercados.
  image-alt:
    en: A stylized route diagram showing cross-city media spill from Caracas to Valencia and back, with
      green arrows on a cream background.
    es: Un diagrama estilizado de rutas mostrando derrame mediático entre Caracas y Valencia, con flechas
      verdes sobre un fondo crema.
  categories:
    en:
    - mmmpymc-marketingspilloversbayesianpython
    es: []
