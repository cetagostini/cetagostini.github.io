  description:
    en: A Bayesian framework using placebo tests and ROPE-based inference to audit whether your quasi-experimental
      causal estimates are trustworthy.
    es: Un marco Bayesiano que utiliza pruebas placebo e inferencia basada en ROPE para auditar si tus
      estimaciones causales cuasi-experimentales son confiables.
