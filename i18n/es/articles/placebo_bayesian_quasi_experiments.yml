  title:
    en: Can You Trust Your Quasi-Experiment? A Bayesian Framework for Auditing Time-Series Causal Estimates
    es: ¿Puedes confiar en tu cuasi-experimento? Un marco Bayesiano para auditar estimaciones causales
      de series temporales
  pagetitle:
    en: ''
