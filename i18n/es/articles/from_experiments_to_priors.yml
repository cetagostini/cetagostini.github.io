    en: $\alpha$ is the maximum achievable effect (the asymptote)
    es: $\alpha$ es el efecto máximo alcanzable (la asíntota)
  list-item-f18ee2795f82:
    kind: list-item
    context: list
    en: |-
      $\lambda$ is the half-saturation point (the spend level at which we
      reach half the maximum effect)
    es: $\lambda$ es el punto de media saturación (el nivel de gasto en el que alcanzamos la mitad del
      efecto máximo)
  list-item-ef53b60af710:
    kind: list-item
    context: list
    en: |-
      **A small PyMC prior elicitation model replaces point optimization.**
      The Bayesian elicitation model produces a full joint posterior that
      honestly represents what the experiment tells us --- and multiple
      experiments pin down the curve further. Run experiments across different
      spend levels and time periods for the strongest elicitation.
    es: '**Un pequeño modelo de elicitation de priors de PyMC reemplaza la optimización por punto.** El
      modelo bayesiano de elicitation produce un posterior conjunto completo que representa honestamente
      lo que el experimento nos dice --- y múltiples experimentos acotan aún más la curva. Ejecuta experimentos
      con diferentes niveles de gasto y periodos de tiempo para la elicitation más robusta.'
  list-item-7ccb034f4824:
    kind: list-item
    context: list
    en: |-
      **Bottom panel**: The cumulative causal impact --- the running total of
      the pointwise differences over time.
    es: '**Panel inferior**: El impacto causal acumulado --- el total acumulado de las diferencias puntuales
      a lo largo del tiempo.'
  list-item-e9a6409adb4a:
    kind: list-item
    context: list
    en: '**Build on existing work** --- leverage community intelligence.'
    es: '**Aprovecha el trabajo existente** --- capitaliza la inteligencia de la comunidad.'
  list-item-68dba4582c19:
    kind: list-item
    context: list
    en: |-
      **Create custom workflows** --- combine causal inference and Bayesian
      modeling in ways no single tool supports.
    es: '**Crea flujos de trabajo personalizados** --- combina inferencia causal y modelado bayesiano
      de formas que ninguna herramienta individual soporta.'
  list-item-1faeade69c9c:
    kind: list-item
    context: list
    en: |-
      **Ensure transparency** --- methodologies are open for inspection and
      validation.
    es: '**Asegura transparencia** --- las metodologías están abiertas para inspección y validación.'
  list-item-43045efafd1d:
    kind: list-item
    context: list
    en: |-
      **Even a single experiment dramatically improves priors.** The
      experiment-informed model's priors were far more concentrated around the
      true values than the generic defaults, giving MCMC a much better
      starting point.
    es: '**Incluso un solo experimento mejora drásticamente los priors.** Los priors del modelo informado
      por experimentos estaban mucho más concentrados alrededor de los valores verdaderos que los genéricos
      por defecto, dando a MCMC un punto de partida mucho mejor.'
  list-item-2a43098d8144:
    kind: list-item
    context: list
    en: |-
      **Extend functionality** --- contribute to the codebase or build
      complementary tools.
    es: '**Extiende la funcionalidad** --- contribuye al código base o construye herramientas complementarias.'
  list-item-d3a1ce8ee047:
    kind: list-item
    context: list
    en: |-
      **Middle panel**: The pointwise causal impact --- the difference between
      observed and synthetic at each time step. Near zero pre-intervention;
      distinctly negative afterward.
    es: '**Panel central**: El impacto causal puntual --- la diferencia entre lo observado y lo sintético
      en cada paso temporal. Cerca de cero antes de la intervención; claramente negativo después.'
  list-item-52002c7f8f2a:
    kind: list-item
    context: list
    en: |-
      **Quasi-experiments are a natural source of prior information.** Using
      CausalPy's `SyntheticControl`, we estimated the causal effect of
      reducing advertising spend --- and translated that estimate into
      actionable prior distributions.
    es: '**Los cuasi-experimentos son una fuente natural de información para priors.** Usando `SyntheticControl`
      de CausalPy, estimamos el efecto causal de reducir el gasto publicitario --- y tradujimos esa estimación
      en distribuciones prior accionables.'
  list-item-e85c238d6003:
    kind: list-item
    context: list
    en: |-
      **The derivative of the saturation function is the bridge.** By placing
      our experimental observation in derivative space, we connect real-world
      causal evidence to the parameters ($\alpha$, $\lambda$) of the
      saturation curve.
    es: '**La derivada de la función de saturación es el puente.** Al ubicar nuestra observación experimental
      en el espacio de derivadas, conectamos la evidencia causal del mundo real con los parámetros ($\alpha$,
      $\lambda$) de la curva de saturación.'
  list-item-538788b67426:
    kind: list-item
    context: list
    en: |-
      **The multidimensional MMM from `pymc-marketing` makes this seamless.**
      The `Prior` class, transformation objects (`GeometricAdstock`,
      `MichaelisMentenSaturation`), and the unified `MMM` class let us inject
      experimental knowledge directly into the model specification --- no
      hacks required.
    es: '**El MMM multidimensional de `pymc-marketing` hace esto fluido.** La clase `Prior`, los objetos
      de transformación (`GeometricAdstock`, `MichaelisMentenSaturation`) y la clase unificada `MMM` nos
      permiten inyectar conocimiento experimental directamente en la especificación del modelo --- sin
      hacks necesarios.'
  list-item-c5cca97545cf:
    kind: list-item
    context: list
    en: |-
      **Top panel**: Observed Venezuela sales versus the synthetic
      counterfactual constructed from Colombia. Before the intervention the
      synthetic closely tracks reality; after the intervention a visible gap
      opens --- the divergence between the synthetic and the observed.
    es: '**Panel superior**: Ventas observadas de Venezuela versus el contrafactual sintético construido
      a partir de Colombia. Antes de la intervención, el sintético rastrea de cerca la realidad; después
      de la intervención se abre un espacio visible --- la divergencia entre el sintético y lo observado.'
  list-item-57e276874790:
