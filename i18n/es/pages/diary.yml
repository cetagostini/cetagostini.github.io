  para-604d13b8d3a6:
    kind: para
    context: body
    en: |-
      Redesigned the whole thing. Green, brown, DAGs everywhere. It feels like
      me now.
    es: |-
      Rediseñé todo. Verde, marrón, DAGs por todos lados. Ahora sí se siente
      como yo.
  para-c4af39e95318:
    kind: para
    context: body
    en: |-
      Set up Hermes on an old HP Pavilion. Named my bot Merlin Vieira saar.
      MiMo voice is insane.
    es: |-
      Instalé Hermes en una vieja HP Pavilion. Le puse Merlin Vieira saar a mi
      bot. La voz de MiMo es una locura.
  para-1999439d2d47:
    kind: para
    context: body
    en: The hour was always a proxy for value. AI just made the proxy collapse.
    es: La hora siempre fue un proxy del valor. La IA simplemente hizo que el proxy colapsara.
  para-5d2664d28a90:
    kind: para
    context: body
    en: |-
      just random thoughts, things I'm working on, stuff I find interesting.
      no structure, no plan. sometimes about Bayesian stuff, sometimes about
      the site, sometimes just whatever.
    es: |-
      solo pensamientos random, cosas en las que estoy trabajando, cosas que me
      parecen interesantes. sin estructura, sin plan. a veces sobre Bayes, a
      veces sobre el sitio, a veces lo que sea.
