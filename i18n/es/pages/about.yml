        <section class="about-hero" aria-labelledby="about-name">
          <div class="hero-section">
            <p class="hero-eyebrow"><span class="hero-status" aria-hidden="true"></span>Sobre mí · Venezuela → Chile → Estonia</p>
            <h1 class="hero-name" id="about-name">Un viaje causal hacia las aplicaciones bayesianas<span class="hero-period">.</span></h1>
            <p class="hero-intro">Soy un profesional de datos globetrotter con pasión por las estadísticas y las matemáticas. Desde estudiar en Venezuela hasta colaborar con equipos en distintos continentes, mi trayectoria ha sido un torbellino de experiencias diversas. Me apasiona usar datos para transformar negocios y resolver problemas complejos.</p>
            <div class="hero-cta">
              <a class="btn btn-primary" href="files/cv_carlos.pdf" target="_blank" rel="noopener">Descargar CV <span aria-hidden="true">↗</span></a>
              <a class="btn btn-quiet" href="mailto:carlos.trujillo@outlook.cl">Escríbeme <span aria-hidden="true">↗</span></a>
            </div>
            <div class="hero-profile">
              <p class="profile-affiliation">Dirigiendo investigación en <a href="https://www.pymc-labs.com" target="_blank" rel="noopener">PyMC Labs</a><br><span>Inferencia bayesiana · Modelamiento causal</span></p>
            </div>
          </div>
          <div class="about-portrait">
            <img src="images/profile.jpg" class="profile-photo" alt="Retrato de Carlos Trujillo" width="250" height="250">
          </div>
        </section>

