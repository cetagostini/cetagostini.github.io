                <p class="panel-company" id="role-company-pymc">PyMC Labs</p>
                <p class="panel-summary">Liderando investigación, resolviendo problemas de negocio complejos mediante métodos estadísticos bayesianos avanzados.</p>
                <ul class="panel-list">
                  <li>Liderando iniciativas de investigación en métodos bayesianos e inferencia causal</li>
                  <li>Resolviendo problemas de negocio mediante Estadística Bayesiana</li>
                  <li>Contribuyendo a los proyectos de código abierto PyMC y PyMC-Marketing</li>
                  <li>Asesorando a clientes en modelamiento bayesiano, MMM y optimización de presupuesto</li>
                </ul>
              </article>
