                <p class="panel-meta">2018 — 2019 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-oym" tabindex="-1">Performance Manager</h3>
                <p class="panel-company" id="role-company-oym">OYM Agencia</p>
                <p class="panel-summary">Gestioné estrategias de marketing digital para múltiples marcas, incluyendo análisis, optimización e inversión en las principales plataformas.</p>
                <ul class="panel-list">
                  <li>Gestioné análisis, optimización e inversión en plataformas digitales incluyendo Facebook, Google Ads y LinkedIn</li>
                  <li>Desarrollé dashboards en Cyfe y DataStudio</li>
                  <li>Trabajé con marcas como Jansport, BodyAndSoul, Ursus Trotter y más de 15 inmobiliarias chilenas</li>
                </ul>
              </article>

              <article class="career-panel" id="role-raya" aria-labelledby="role-company-raya role-title-raya" data-node="raya">
                <p class="panel-meta">2019 — 2020 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-raya" tabindex="-1">Analista de Datos</h3>
                <p class="panel-company" id="role-company-raya">Raya</p>
                <p class="panel-summary">Gestioné análisis y reportes para diferentes marcas de la agencia incluyendo Huawei, MercadoLibre, Concha y Toro y Walmart Chile.</p>
                <ul class="panel-list">
                  <li>Responsable de interpretación, análisis y reportes para diferentes marcas de la agencia</li>
                  <li>Gestioné Brandwatch, Google Analytics, Tag Manager y herramientas similares para determinar directrices de campañas pagas u orgánicas</li>
                  <li>Desarrollé modelos de categorización y predicción en Python para optimización de procesos y análisis avanzado de variables</li>
                  <li>Trabajé con marcas como Huawei, MercadoLibre, Concha y Toro y Walmart Chile</li>
                </ul>
              </article>

              <article class="career-panel" id="role-omnicom" aria-labelledby="role-company-omnicom role-title-omnicom" data-node="omnicom">
                <p class="panel-meta">2020 — 2022 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-omnicom" tabindex="-1">Jefe de Analítica de Datos</h3>
                <p class="panel-company" id="role-company-omnicom">Omnicom Media Group</p>
                <p class="panel-summary">Lideré el departamento de datos del grupo Marketing Science LATAM, desarrollando soluciones de valor y creando servicios analíticos en la región.</p>
                <h4 class="panel-subhead">Evolución profesional</h4>
                <div class="panel-step">
                  <span class="panel-step-role">Jefe de Analítica de Datos</span>
                  <span class="panel-step-period">octubre 2021 — enero 2022</span>
                </div>
                <ul class="panel-list">
                  <li>Lideré el departamento de datos del grupo Marketing Science LATAM</li>
                  <li>Desarrollé soluciones de valor y creé servicios analíticos en la región</li>
                  <li>Utilicé tecnologías en la nube (AWS/GCP) para desarrollar estructuras de datos sostenibles</li>
                  <li>Mantenía comunicación directa con los equipos de Google y Facebook para desarrollar casos de uso y optimización de servicios</li>
                  <li>Creé propuestas de innovación y fomenté la cultura de datos para optimizar procesos operativos</li>
                </ul>
                <div class="panel-step">
                  <span class="panel-step-role">Gerente de Analítica de Datos</span>
                  <span class="panel-step-period">julio 2020 — octubre 2021</span>
                </div>
                <ul class="panel-list">
                  <li>Gestioné el equipo de analistas y aseguré la entrega correcta de dashboards en plataformas como Tableau, Power BI y Data Studio</li>
                  <li>Desarrollé arquitecturas en GCP y gestioné bases de datos en AWS</li>
                  <li>Mantenía contacto directo con los equipos de OMG en Miami para centralización de datos y optimización de flujos de información</li>
                  <li>Utilicé herramientas de visualización, Python/R, SQL y NoSQL para preprocesamiento de datos</li>
                </ul>
              </article>

              <article class="career-panel" id="role-bolt" aria-labelledby="role-company-bolt role-title-bolt" data-node="bolt">
                <p class="panel-meta">2022 — 2024 · Tallin, Estonia</p>
                <h3 class="panel-title" id="role-title-bolt" tabindex="-1">Analista Funcional de Marketing Ads</h3>
                <p class="panel-company" id="role-company-bolt">Bolt</p>
                <p class="panel-summary">Me relocalicé de Chile a Estonia, aplicando analítica de datos para determinar las estrategias más efectivas de optimización de esfuerzos de marketing de adquisición basados en rentabilidad.</p>
                <ul class="panel-list">
                  <li>Apliqué analítica de datos para determinar las mejores estrategias de optimización de esfuerzos de marketing de adquisición basados en rentabilidad en Europa y Sudáfrica</li>
                  <li>Realicé análisis diarios usando Python o R para ejecutar modelos de mezcla de marketing, impacto causal y asignación de presupuesto</li>
                  <li>Estimé efectos de marketing alrededor del mundo para alcanzar los objetivos de la empresa</li>
                </ul>
              </article>

              <article class="career-panel" id="role-wise" aria-labelledby="role-company-wise role-title-wise" data-node="wise">
                <p class="panel-meta">2024 — julio 2026 · Tallin, Estonia</p>
                <h3 class="panel-title" id="role-title-wise" tabindex="-1">Científico de Marketing</h3>
                <p class="panel-company" id="role-company-wise">Wise</p>
                <p class="panel-summary">Científico de datos para el equipo de Marketing, dedicado a medir y mejorar las estrategias globales de la región mediante el uso de datos.</p>
                <h4 class="panel-subhead">Evolución profesional</h4>
                <div class="panel-step">
                  <span class="panel-step-role">Científico de Datos Líder</span>
                  <span class="panel-step-period">marzo 2025 — julio 2026</span>
                </div>
                <ul class="panel-list">
                  <li>Lideré el workstream de ciencia del marketing, estableciendo la estrategia y prioridades de medición</li>
                  <li>Fui responsable del marketing mix modeling y pruebas de incrementalidad en Python y PyMC</li>
                  <li>Colaboré con el liderazgo de marketing para traducir los resultados del modelo en decisiones de presupuesto</li>
                </ul>
                <div class="panel-step">
                  <span class="panel-step-role">Científico de Marketing Senior</span>
                  <span class="panel-step-period">enero 2024 — marzo 2025</span>
                </div>
                <ul class="panel-list">
                  <li>Construí y mantuve modelos bayesianos de mezcla de marketing para medir la contribución por canal</li>
                  <li>Diseñé y analicé cuasi-experimentos para cuantificar la incrementalidad de campañas</li>
                  <li>Entregué insights accionables basados en datos a los equipos regionales de marketing</li>
                </ul>
              </article>

              <article class="career-panel" id="role-pymc" aria-labelledby="role-company-pymc role-title-pymc" data-node="pymc">
