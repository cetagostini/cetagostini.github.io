      \ href=\"mailto:carlos.trujillo@outlook.cl\">Email me <span aria-hidden=\"true\">↗</span></a>\n\
      \      </div>\n      <div class=\"hero-profile\">\n        <p class=\"profile-affiliation\">Leading\
