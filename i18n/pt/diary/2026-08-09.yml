meta:
  title:
    en: hourly billing is dead, long live the hybrid
    es: a faturação por hora morreu, viva o modelo híbrido
  pagetitle:
    en: ''
    es: ''
  description:
    en: The hour was always a proxy for value. AI just made the proxy collapse.
    es: A hora foi sempre um proxy do valor. A IA apenas fez o proxy colapsar.
  image-alt:
    en: ''
    es: ''
  categories:
