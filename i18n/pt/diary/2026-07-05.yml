blocks:
  para-abe20219736c:
    kind: para
    context: body
    en: |-
      anyway. gonna try actually writing here regularly. we'll see how long
      that lasts lol.
    es: enfim. vou tentar escrever aqui regularmente a sério. vamos ver quanto tempo dura lol.
  para-0674d6e671d1:
    kind: para
    context: body
    en: |-
      made the new one with GLM 5.2. it's not wow but it's functional and I
      like that.
    es: fiz o novo com GLM 5.2. não é wow mas é funcional e gosto disso.
  para-90d0f41a9cbb:
    kind: para
    context: body
    en: |-
      oh and I made it work for LLMs too. there's a `llms.txt` file, clean
      markdown mirrors of every page, structured data with JSON-LD. I have no
      idea if google actually cares about any of this but chatgpt and claude
      can read my site now so that's cool I guess.
    es: ah e também fiz isto funcionar para LLMs. há um ficheiro `llms.txt`, espelhos em markdown limpo
      de todas as páginas, dados estruturados com JSON-LD. não faço ideia se o Google quer saber disto
      mas o ChatGPT e o Claude já conseguem ler o meu site por isso é fixe, suponho.
  para-2afd4d705307:
    kind: para
    context: body
    en: |-
      ok so I just pushed the whole site redesign and honestly? it slaps. been
      tinkering with this for a while and it finally feels right.
    es: ok então acabei de publicar o redesign do site todo e honestamente? está incrível. tenho andado
      a mexer nisto há um tempo e finalmente está a sentir-se certo.
  para-1dbf10568c50:
    kind: para
    context: body
    en: |-
      the DAG thing is maybe my favorite part? there's this faint animated
      graph behind my name on the homepage and then on the about page my
      actual career is a DAG. which is dumb and nerdy but like... that's the
      whole point. I do causal inference. DAGs are my thing. might as well
      lean into it.
    es: a cena dos DAGs é talvez a minha parte preferida? há um gráfico animado desvanecido por trás do
      meu nome na homepage e depois na página about a minha carreira real é um DAG. o que é parvo e nerd
      mas tipo... é esse o ponto. faço inferência causal. DAGs são a minha cena. mais vale abraçar a coisa.
  para-1df9c8a543f8:
    kind: para
    context: body
    en: |-
      the old site was fine I guess but it didn't feel like *me*. too generic,
      too "built by LLMs" which... yeah it literally was. now it's warm and
      has personality. the colors? completely random. I had a good recent
      photo with this palette --- soft cream, muted green, some brown --- and
      just went with it. not some deep design philosophy, just vibes.
    es: o site antigo era porreiro, suponho, mas não se sentia como *eu*. demasiado genérico, demasiado
      "feito por LLMs" o que... sim, literalmente era. agora é acolhedor e tem personalidade. as cores?
      completamente aleatórias. tinha uma boa foto recente com esta paleta --- creme suave, verde discreto,
      algum castanho --- e fui com isso. nenhuma filosofia de design profunda, só vibes.
  para-9f802e945162:
    kind: para
    context: body
    en: |-
      the whole thing is just quarto + github pages. renders from frozen
      computations so I don't have to wait around for notebooks to run every
      time I change a comma. highly recommend.
    es: tudo isto é só quarto + GitHub Pages. renderiza a partir de computações congeladas por isso não
      tenho de ficar à espera que os notebooks corram cada vez que mudo uma vírgula. recomendo vivamente.
