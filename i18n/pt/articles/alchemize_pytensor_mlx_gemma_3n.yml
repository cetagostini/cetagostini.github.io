    context: body
    en: Write the equations once
    es: Escrever as equações uma única vez
  list-item-0f54e37e4dfa:
    kind: list-item
    context: list
    en: |-
      **A graph you can open.** Every operation is inspectable and rewritable.
      You can ask what a rewrite changed instead of trusting a black box.
    es: |-
      **Um grafo que pode inspecionar.** Cada operação é audível e reescrevível.
      Pode perguntar o que uma reescrita alterou em vez de confiar numa caixa negra.
  list-item-6d22104d1860:
    kind: list-item
    context: list
    en: |-
      **Building LLM inference in PyTensor is straightforward.** Weight
      loaders, symbolic transformers, KV caches, generation loops, and
      numerical validation---all assembled from Python without modifying the
      framework.
    es: |-
      **Construir inferência de LLM em PyTensor é direto.** Carregadores de pesos,
      transformadores simbólicos, caches KV, ciclos de geração e validação
      numérica --- tudo montado a partir de Python sem modificar a framework.
  list-item-ced24aee7fe7:
    kind: list-item
    context: list
    en: |-
      **Independent logits beat plausible prose.** Exact tokens and
      all-position numerical agreement are stronger evidence than
      plausible-looking text.
    es: |-
      **Logits independentes superam prosa plausível.** Tokens exatos e concordância
      numérica em todas as posições são evidência mais forte do que texto
      aparentemente plausível.
  list-item-dd86d2233184:
    kind: list-item
    context: list
    en: |-
      **Inference that composes.** The model is a graph inside the scientific
      Python stack---chain it with a PyMC posterior, a SciPy optimizer, or any
      custom computation, all in the same framework.
    es: |-
      **Inferência que se compõe.** O modelo é um grafo dentro do ecossistema
      científico de Python --- encadeie-o com um posterior de PyMC, um
      otimizador de SciPy ou qualquer computação personalizada, tudo na mesma framework.
  list-item-4476eac090b5:
    kind: list-item
    context: list
    en: |-
      **One definition, any backend.** The same symbolic equations compile
      through C, Numba, MLX, or JAX. Swapping hardware targets is a
      one-argument change, not a rewrite.
    es: |-
      **Uma definição, qualquer backend.** As mesmas equações simbólicas compilam
      através de C, Numba, MLX ou JAX. Trocar o destino de hardware é uma
      alteração de um argumento, não uma reescrita.
  list-item-9bc0e8d35fa9:
    kind: list-item
    context: list
    en: |-
      **One symbolic definition survives multiple backends.** Gemma 3n
      executes through C/CVM, Numba, and MLX without a second model
      implementation.
    es: |-
      **Uma definição simbólica sobrevive a múltiplos backends.** Gemma 3n
      executa através de C/CVM, Numba e MLX sem uma segunda implementação
      do modelo.
  list-item-d9f5fc732373:
    kind: list-item
    context: list
    en: |-
      **PyTensor and `llama.cpp` are complementary.** `llama.cpp` owns
      production serving. PyTensor owns graph transparency and composability
      with scientific Python.
    es: |-
      **PyTensor e `llama.cpp` são complementares.** `llama.cpp` detém a
      serviçagem em produção. PyTensor detém a transparência do grafo e a
      composabilidade com o Python científico.
  list-item-a9988e436e90:
    kind: list-item
    context: list
    en: |-
      **PyTensor is a general graph compiler.** PyMC is its most visible
      consumer, not the boundary of what it can express.
    es: |-
      **PyTensor é um compilador de grafos generalista.** PyMC é o seu consumidor
      mais visível, não o limite do que consegue expressar.
  list-item-54947065d633:
    kind: list-item
    context: list
    en: |-
      **PyTensor** is the Python-native graph compiler for studying,
      modifying, and composing LLM inference. You do not just run a
      model---you can ask what a rewrite changed, compile the same equations
      through another linker, chain inference with a Bayesian posterior or a
      custom optimization loop, and validate every contract numerically.
    es: |-
      **PyTensor** é o compilador de grafos nativo de Python para estudar,
      modificar e compor inferência de LLM. Não se limita a executar um
      modelo --- pode perguntar o que uma reescrita alterou, compilar as mesmas
      equações através de outro linker, encadear inferência com um posterior
      bayesiano ou um ciclo de otimização personalizado, e validar cada
      contrato numericamente.
  list-item-6e74f45039b8:
    kind: list-item
    context: list
    en: |-
      **The remaining gaps are engineering, not architecture.** Native
      quantized kernels, paged KV caching, mmap zero-copy loading, and broader
      backend coverage are all buildable on PyTensor's existing foundation.
      The pytensor-ml project has already begun this work.
    es: |-
      **As lacunas restantes são de engenharia, não de arquitetura.** Kernels
      nativos quantizados, caching KV paginado, carregamento mmap zero-copy e
      maior cobertura de backends são tudo construtíveis sobre a fundação
      existente do PyTensor. O projeto pytensor-ml já iniciou este trabalho.
  list-item-38910fd52bf5:
    kind: list-item
    context: list
    en: |-
      **`llama.cpp`** is the C++ engine for running any GGUF model fast. It
      owns the full serving stack: quantized kernels, KV cache management,
      continuous batching, broad architecture support. If you need to serve
      models at production scale today, `llama.cpp` is the answer.
    es: |-
      **`llama.cpp`** é o motor C++ para executar qualquer modelo GGUF rapidamente.
      Detém toda a pilha de serviçagem: kernels quantizados, gestão de cache
      KV, batching contínuo, ampla suporte de arquitetura. Se precisa de
      servir modelos à escala de produção hoje, `llama.cpp` é a resposta.
