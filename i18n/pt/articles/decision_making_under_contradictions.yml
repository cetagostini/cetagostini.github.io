  list-item-cc70d0dcbff2:
    kind: list-item
    context: list
    en: $\alpha$ is the maximum achievable effect (the asymptote)
    es: $\alpha$ é o efeito máximo atingível (a assíntota)
  list-item-18d92a81ff96:
    kind: list-item
    context: list
    en: |-
      $\lambda$ is the half-saturation point (spend at which we reach half the
      maximum)
    es: |-
      $\lambda$ é o ponto de meia-saturação (investimento ao qual atingimos metade do
      máximo)
  list-item-ee7beb35820c:
    kind: list-item
    context: list
    en: |-
      **Bayesian Model Selection**: Use marginal likelihoods to assign model
      probabilities, then combine with minimax for a hybrid approach.
    es: |-
      **Seleção Bayesiana de Modelos**: Use verosimilhanças marginais para atribuir
      probabilidades aos modelos, depois combine com minimax para uma abordagem híbrida.
  list-item-4018aae729aa:
    kind: list-item
    context: list
    en: |-
      **Compute the normalised regret matrix** by cross-evaluating every
      allocation under every model.
    es: |-
      **Calcular a matriz de arrependimento normalizada** ao avaliar cada alocação
      sob cada modelo.
  list-item-5b03773b7719:
    kind: list-item
    context: list
    en: |-
      **Decision theory fills the gap.** When models disagree and you can't
      combine their estimates, you can still combine their *implications for
      decisions*. Minimax regret finds the allocation that minimizes the
      worst-case *normalised* opportunity cost across all models --- the
      fraction of optimal value left on the table.
    es: |-
      **A teoria da decisão preenche o vazio.** Quando os modelos discordam e não é possível
      combinar as suas estimativas, é ainda possível combinar as suas *implicações para
      as decisões*. O minimax regret encontra a alocação que minimiza o custo de
      oportunidade *normalizado* no pior caso em todos os modelos --- a
      fração do valor ótimo deixado sobre a mesa.
  list-item-d92517295559:
    kind: list-item
    context: list
    en: |-
      **Different measurement systems answer different questions.** A
      regression-based MMM, a controlled experiment, and an attribution model
      each capture a different facet of marketing effectiveness. Their
      disagreement is not a bug --- it's a feature of measuring a complex
      system from multiple angles.
    es: |-
      **Diferentes sistemas de medição respondem a diferentes questões.** Um
      MMM baseado em regressão, um experimento controlado e um modelo de atribuição
      capturam cada um uma faceta diferente da eficácia do marketing. A sua
      discordância não é um erro --- é uma caraterística de medir um sistema
      complexo a partir de múltiplos ângulos.
  list-item-077f64bb46ac:
    kind: list-item
    context: list
    en: |-
      **Established theory.** Minimax regret was formalised by [Leonard Savage
      (1951)](https://en.wikipedia.org/wiki/Minimax) and connects directly to
      **Distributionally Robust Optimisation (DRO)** in modern operations
      research and to **robust portfolio allocation** in finance.
    es: |-
      **Teoria estabelecida.** O minimax regret foi formalizado por [Leonard Savage
      (1951)](https://en.wikipedia.org/wiki/Minimax) e conecta-se diretamente à
      **Otimização Distribucionalmente Robusta (DRO)** na investigação operacional
      moderna e à **alocação robusta de portfólios** nas finanças.
  list-item-74bc164afbf0:
    kind: list-item
    context: list
    en: |-
      **Gather your views.** Collect the parameter estimates (or full
      posteriors) from each measurement system. Any view of reality ---
      attribution dashboards, experimental lift estimates, regression
      coefficients --- can become a PyMC model.
    es: |-
      **Recolha as suas visões.** Recolha as estimativas de parâmetros (ou posteriores
      completas) de cada sistema de medição. Qualquer visão da realidade ---
      painéis de atribuição, estimativas de lift experimental, coeficientes de
      regressão --- pode tornar-se um modelo PyMC.
  list-item-0afc7edfa17e:
    kind: list-item
    context: list
    en: |-
      **Handles incommensurable models.** We never combine the models'
      *parameters* --- we only evaluate each model's *response* to the same
      allocation. The normalised regret is always computed within a single
      model's framework, and because it measures the *fraction* of optimal
      value lost, it is invariant to the absolute scale of each model's
      response.
    es: |-
      **Lida com modelos incomensuráveis.** Nunca combinamos os *parâmetros* dos modelos
      --- avaliamos apenas a *resposta* de cada modelo à mesma alocação. O
      arrependimento normalizado é sempre calculado no quadro de um único modelo,
      e como mede a *fração* do valor ótimo perdido, é invariante à escala absoluta
      da resposta de cada modelo.
  list-item-e607b04fcf5a:
    kind: list-item
    context: list
    en: |-
      **Merge the models** with `BuildMergedModel` so all views share a single
      `channel_data` input --- one computational graph, every response surface
      accessible.
    es: |-
      **Combinar os modelos** com `BuildMergedModel` para que todas as visões partilhem
      uma única entrada `channel_data` --- um grafo computacional, todas as superfícies
      de resposta acessíveis.
  list-item-217b5c207e4e:
    kind: list-item
    context: list
    en: |-
      **No model weighting required.** Unlike Bayesian Model Averaging, we
      don't need to assign probabilities to each model being "correct." We
      simply protect against the worst case.
    es: |-
      **Não é necessário atribuir pesos aos modelos.** Ao contrário da Média Bayesiana de
      Modelos, não precisamos de atribuir probabilidades a cada modelo estar
      "correto." Simplesmente protegemos contra o pior caso.
  list-item-311fc518fa06:
    kind: list-item
    context: list
    en: |-
      **Optimise individually** using the `BudgetOptimizer` to find the
      optimal allocation under each view. This gives you the candidate
      allocations and the $V^*(m)$ benchmarks.
    es: |-
      **Otimizar individualmente** usando o `BudgetOptimizer` para encontrar a
      alocação ótima sob cada visão. Isto dá-nos as alocações candidatas e os
      benchmarks $V^*(m)$.
  list-item-7bcae54d98c9:
    kind: list-item
    context: list
    en: |-
      **Present to stakeholders.** Show the regret matrix and the comparison
      plot. The pitch: *"This allocation leaves the least value on the table
      no matter which model turns out to be correct."*
    es: |-
      **Apresentar aos intervenientes.** Mostre a matriz de arrependimento e o gráfico
      comparativo. O argumento: *"Esta alocação deixa o menor valor sobre a mesa
      independentemente de qual modelo se revelar correto."*
  list-item-dddf8cf2519c:
    kind: list-item
    context: list
    en: |-
      **Risk-averse evaluation**: Instead of using the posterior mean for
      $V(a, m)$, use a lower quantile (e.g., 5th percentile) for an even more
      conservative allocation.
    es: |-
      **Avaliação avessa ao risco**: Em vez de usar a média a posteriori para
      $V(a, m)$, use um quantil inferior (por exemplo, percentil 5) para uma alocação
      ainda mais conservadora.
  list-item-125ea25122a5:
    kind: list-item
    context: list
    en: |-
      **Robust to model error.** The resulting allocation hedges against all
      models, ensuring we never make a catastrophically bad decision under any
      of them.
    es: |-
      **Robusta a erros do modelo.** A alocação resultante faz cobertura contra todos
      os modelos, garantindo que nunca tomamos uma decisão catastroficamente má sob
      qualquer deles.
  list-item-41f1dd38be18:
    kind: list-item
    context: list
    en: |-
      **Scale asymmetry breaks naive aggregation.** When measurement systems
      operate at different scales --- as they invariably do in practice ---
      averaging lets the loudest system dominate. The sensitivity analysis
      confirms that averaged-model allocations shift dramatically as one
      model's scale changes by an order of magnitude, while minimax-regret
      allocations remain stable.
    es: |-
      **A assimetria de escala quebra a agregação ingénua.** Quando os sistemas de medição
      operam em escalas diferentes --- como invariavelmente acontece na prática ---
      a média deixa o sistema mais alto dominar. A análise de sensibilidade
      confirma que as alocações do modelo médio mudam dramaticamente quando a escala
      de um modelo muda uma ordem de magnitude, enquanto as alocações por minimax-regret
      permanecem estáveis.
  list-item-fd716ca83376:
    kind: list-item
    context: list
    en: |-
      **Solve for the robust allocation** by minimising the worst-case regret
      entry with a custom utility function in the `BudgetOptimizer`.
    es: |-
      **Resolver a alocação robusta** minimizando a entrada de pior caso da matriz
      de arrependimento com uma função de utilidade personalizada no `BudgetOptimizer`.
  list-item-39f99df8f6a8:
    kind: list-item
    context: list
    en: |-
      **The robust allocation hedges against model error.** By optimising for
      the worst case, minimax regret produces allocations that are competitive
      under every model --- never perfect, but never catastrophic. This is the
      portfolio diversification principle applied to model uncertainty.
    es: |-
      **A alocação robusta faz cobertura contra erros do modelo.** Ao otimizar para o pior
      caso, o minimax regret produz alocações que são competitivas sob cada modelo
      --- nunca perfeitas, mas nunca catastróficas. Este é o princípio de diversificação
      de portfólios aplicado à incerteza do modelo.
  list-item-3f8416d40ece:
    kind: list-item
    context: list
    en: |-
      **The workflow is practical and presentable.** Optimise under each
      model, compute the regret matrix, solve for the minimax allocation, and
      present the comparison. Stakeholders can see exactly how each strategy
      performs under each scenario --- no black boxes.
    es: |-
      **O fluxo de trabalho é prático e apresentável.** Otimize sob cada modelo,
      calcule a matriz de arrependimento, resolva a alocação minimax e
      apresente a comparação. Os intervenientes podem ver exatamente como cada estratégia
      se comporta sob cada cenário --- sem caixas negras.
  list-item-9793eb3aa7fb:
    kind: list-item
    context: list
    en: |-
      **Time-varying views**: If model reliability changes over time (e.g.,
      the experiment was recent but the MMM covers years), incorporate
      temporal weighting.
    es: |-
      **Visões variantes no tempo**: Se a fiabilidade do modelo mudar ao longo do tempo
      (por exemplo, o experimento foi recente mas o MMM cobre anos), incorpore
      ponderação temporal.
  list-item-89aac8c75aa3:
    kind: list-item
    context: list
    en: |-
      **Weighted minimax regret**: Assign confidence weights $w_m$ to each
      model and minimize $\max_m w_m \cdot R(a, m)$. This bridges the gap
      between pure minimax and Bayesian model averaging.
    es: |-
      **Minimax regret ponderado**: Atribua pesos de confiança $w_m$ a cada
      modelo e minimize $\max_m w_m \cdot R(a, m)$. Isto faz a ponte entre
      o minimax puro e a média bayesiana de modelos.
  list-item-e71d69e57509:
    kind: list-item
    context: list
    en: |-
      **You cannot average apples, oranges, and bananas.** Averaging model
      *outputs* across different measurement systems is a dimensional error.
      Even when it produces a distribution, no draw from that distribution
      corresponds to any real-world outcome. The "consensus model" is a
      Frankenstein with no coherent interpretation.
    es: |-
      **Não é possível fazer a média de maçãs, laranjas e bananas.** Fazer a média das
      *saídas* de modelos de diferentes sistemas de medição é um erro dimensional.
      Mesmo quando produz uma distribuição, nenhuma amostra dessa distribuição
      corresponde a qualquer resultado do mundo real. O "modelo consenso" é um
      Frankenstein sem interpretação coerente.
  list-item-caee51974cf6:
    kind: list-item
    context: list
    en: |-
      A **payoff function** $V(a, m)$ that gives the expected response when
      action $a$ is taken and model $m$ is the true one
    es: |-
      Uma **função de payoff** $V(a, m)$ que dá a resposta esperada quando
      a ação $a$ é tomada e o modelo $m$ é o verdadeiro
  list-item-cfc9d25d1bae:
    kind: list-item
    context: list
    en: |-
      A set of possible **actions** $a \in \mathcal{A}$ (budget allocations
      across channels)
    es: |-
      Um conjunto de possíveis **ações** $a \in \mathcal{A}$ (alocações de
      orçamento entre canais)
  list-item-68d0145e0092:
    kind: list-item
    context: list
    en: |-
      A set of possible **states of the world** $m \in \mathcal{M}$ (which
      model is correct)
    es: |-
      Um conjunto de possíveis **estados do mundo** $m \in \mathcal{M}$ (qual
      modelo está correto)
  list-item-b2007efbcc2f:
    kind: list-item
    context: list
    en: |-
      Building **three competing models** of marketing effectiveness, each
      representing a different measurement philosophy (regression,
      experimentation, attribution).
    es: |-
      Construir **três modelos concorrentes** de eficácia de marketing, cada um
      representando uma filosofia de medição diferente (regressão,
      experimentação, atribuição).
  list-item-5848d05e4bdd:
    kind: list-item
    context: list
    en: |-
      Computing the **normalised regret matrix** and finding the **robust
      allocation** that minimizes worst-case regret as a fraction of optimal
      value.
    es: |-
      Calcular a **matriz de arrependimento normalizada** e encontrar a **alocação
      robusta** que minimiza o arrependimento do pior caso como fração do valor
      ótimo.
  list-item-da81af199775:
    kind: list-item
    context: list
    en: |-
      Connecting everything back to the
      [PyMC-Marketing](https://www.pymc-marketing.io) `BudgetOptimizer`,
      `BuildMergedModel`, and `CustomModelWrapper`.
    es: |-
      Ligar tudo de volta ao [PyMC-Marketing](https://www.pymc-marketing.io)
      `BudgetOptimizer`, `BuildMergedModel` e `CustomModelWrapper`.
  list-item-6992e7a5a18c:
    kind: list-item
    context: list
    en: |-
      Demonstrating why **averaging** or **picking the most certain model**
      are flawed strategies --- including a dimensional analysis argument and
      a sensitivity test that makes the failure undeniable.
    es: |-
      Demonstrar porquê a **média** ou a **escolha do modelo mais certo**
      são estratégias falhadas --- incluindo um argumento de análise dimensional e
      um teste de sensibilidade que torna a falha inegável.
  list-item-769906c22747:
    kind: list-item
    context: list
    en: |-
      Each **cell** is the normalised regret --- the fraction of optimal value
      lost. A value of $0.15$ means we capture only 85% of what was achievable
      under that model.
    es: |-
      Cada **célula** é o arrependimento normalizado --- a fração do valor ótimo
      perdido. Um valor de $0.15$ significa que capturamos apenas 85% do que era atingível
      sob esse modelo.
  list-item-dd10745a1e10:
    kind: list-item
    context: list
    en: Each **column** is a scenario (which model turns out to be correct).
    es: Cada **coluna** é um cenário (qual modelo se revela correto).
  list-item-413bff2ddb0b:
    kind: list-item
    context: list
    en: Each **row** is a candidate allocation (what we might choose).
    es: Cada **linha** é uma alocação candidata (o que podemos escolher).
  list-item-5197763ff479:
    kind: list-item
    context: list
    en: |-
      Introducing **minimax regret** from classical decision theory as the
      principled resolution.
    es: |-
      Introduzir o **minimax regret** da teoria da decisão clássica como a
      resolução fundamentada.
  list-item-529826679237:
    kind: list-item
    context: list
    en: |-
      Minimax regret is **conservative by design**. It optimises for the worst
      case, which means it may sacrifice upside when one model is clearly
      superior.
    es: |-
      O minimax regret é **conservador por conceção**. Otimiza para o pior
      caso, o que significa que pode sacrificar o potencial de ganho quando um modelo é claramente
      superior.
  list-item-1815e937c42f:
    kind: list-item
    context: list
    en: |-
      Showing that these models produce **contradictory budget
      recommendations** when optimised individually.
    es: |-
      Mostrar que estes modelos produzem **recomendações orçamentais contraditórias**
      quando otimizados individualmente.
  list-item-7e842a7166f0:
    kind: list-item
    context: list
    en: |-
      Stakeholders need a **single, defensible recommendation** from a diverse
      set of inputs.
    es: |-
      Os intervenientes precisam de uma **recomendação única e defensável** a partir de um
      conjunto diverso de entradas.
  list-item-d90124ab620d:
    kind: list-item
    context: list
    en: |-
      The **cost of being wrong** is asymmetric or severe --- you'd rather
      avoid catastrophic failure than chase the best possible outcome.
    es: |-
      O **custo de estar errado** é assimétrico ou grave --- preferiria evitar uma falha
      catastrófica a perseguir o melhor resultado possível.
  list-item-b08282b8347a:
    kind: list-item
    context: list
    en: |-
      The **rightmost column** is the maximum normalised regret: the
      worst-case scenario for each allocation.
    es: |-
      A **coluna mais à direita** é o arrependimento normalizado máximo: o
      pior caso para cada alocação.
  list-item-0ad64abbeead:
    kind: list-item
    context: list
    en: |-
      The approach treats all models as equally plausible. If you have strong
      reasons to trust one model over others, **weighted regret** or
      **Bayesian model averaging** may be more appropriate.
    es: |-
      A abordagem trata todos os modelos como igualmente plausíveis. Se tiver razões
      fortes para confiar mais num modelo do que noutros, o **arrependimento ponderado** ou
      a **média bayesiana de modelos** pode ser mais adequado.
  list-item-41a687ebd617:
    kind: list-item
    context: list
    en: |-
      With many models, the worst case can dominate and produce overly
      diversified allocations. In practice, limit your model set to 3--5
      genuinely distinct views.
    es: |-
      Com muitos modelos, o pior caso pode dominar e produzir alocações excessivamente
      diversificadas. Na prática, limite o conjunto de modelos a 3-5 visões
      genuinamente distintas.
  list-item-c45745927773:
    kind: list-item
    context: list
    en: You **cannot assign reliable probabilities** to which model is correct.
    es: '**Não é possível atribuir probabilidades fiáveis** a qual modelo está correto.'
  list-item-0c418b6b9ba5:
    kind: list-item
    context: list
    en: |-
      You have **multiple measurement systems** that produce contradictory
      results.
    es: |-
      Tem **múltiplos sistemas de medição** que produzem resultados
      contraditórios.
  list-item-df6940f0ff9d:
    kind: list-item
    context: list
    en: |-
      [Black-Litterman Model ---
      Wikipedia](https://en.wikipedia.org/wiki/Black%E2%80%93Litterman_model)
    es: '[Modelo Black-Litterman --- Wikipédia](https://en.wikipedia.org/wiki/Black%E2%80%93Litterman_model)'
