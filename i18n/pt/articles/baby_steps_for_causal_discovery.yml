  para-4cd79f484c36:
    kind: para
    context: body
    en: |-
      If the indirect effect $a \times b$ is significant and the direct effect
      $c'$ is not, we conclude that $X1$'s impact on $T$ is fully mediated by
      $M$. Conversely, significant values for both $a \times b$ and $c'$
      suggest that $X1$ exerts both direct and indirect influences on $T$.
    es: Se o efeito indireto $a \times b$ for significativo e o efeito direto $c'$ não for, concluímos
      que o impacto de $X1$ em $T$ é totalmente mediado por $M$. Por outro lado, valores significativos
      tanto para $a \times b$ como para $c'$ sugerem que $X1$ exerce influências diretas e indiretas sobre
      $T$.
