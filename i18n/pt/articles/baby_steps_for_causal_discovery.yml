  para-0cde32e92170:
    kind: para
    context: body
    en: |-
      On the other hand, **Greedy Search** is a score-based method that
      iteratively improves a candidate causal model by locally modifying its
      structure. It begins with an initial directed acyclic graph and
      evaluates a scoring metric that balances goodness-of-fit with model
      complexity. The algorithm explores modifications such as adding,
      deleting, or reversing edges to find local improvements in the score. At
      each iteration, it selects the change that produces the highest increase
      in the score, following a step-by-step improvement strategy. The search
      continues until no single modification can further enhance the model's
      score. This method efficiently navigates the combinatorial search space
      of possible graphs by making locally optimal choices.
    es: Por outro lado, a **Pesquisa Gulosa** é um método baseado em pontuação que melhora iterativamente
      um modelo causal candidato ao modificar localmente a sua estrutura. Começa com um grafo acíclico
      direcionado inicial e avalia uma métrica de pontuação que equilibra a qualidade do ajuste com a
      complexidade do modelo. O algoritmo explora modificações como adicionar, eliminar ou inverter arestas
      para encontrar melhorias locais na pontuação. Em cada iteração, seleciona a alteração que produz
      o maior aumento na pontuação, seguindo uma estratégia de melhoria passo a passo. A pesquisa continua
      até que nenhuma alteração única possa melhorar ainda mais a pontuação do modelo. Este método navega
      eficientemente pelo espaço de pesquisa combinatório de grafos possíveis fazendo escolhas localmente
      ótimas.
  para-2b8fd258ff33:
