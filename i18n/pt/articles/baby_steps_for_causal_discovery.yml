    es: Então, por que é problemático controlar certas variáveis? Cada variável deveria acrescentar mais
      poder explicativo, não? Vamos começar a aprender sobre estruturas para compreender.
  para-61e28a330bb5:
    kind: para
    context: body
    en: |-
      Statistical Faithfulness: This assumption posits that all and only the
      conditional independence relations observed in the data are those
      implied by the causal graph. In other words, there are no accidental
      cancellations or coincidental independencies beyond what the causal
      structure predicts.
    es: 'Fidelidade Estatística: Este pressuposto postula que todas e apenas as relações de independência
      condicional observadas nos dados são aquelas implicadas pelo grafo causal. Por outras palavras,
      não existem cancelamentos acidentais ou independências coincidentes além das que a estrutura causal
      prevê.'
  para-6350664e9a39:
    kind: para
    context: body
    en: |-
      The **Peter-Clark algorithm** is a constraint-based method that infers
      causal structures from observational data using conditional independence
      tests. It starts with a fully connected undirected graph where every
      variable is initially connected to every other variable. The algorithm
      systematically tests conditional independence between pairs of
      variables, conditioning on increasingly larger subsets of other
      variables. When a conditional independence is detected, the
      corresponding edge is removed from the graph.
    es: O **algoritmo Peter-Clark** é um método baseado em restrições que infere estruturas causais a
      partir de dados observacionais utilizando testes de independência condicional. Começa com um grafo
      não direcionado totalmente conectado onde cada variável está inicialmente ligada a todas as outras
      variáveis. O algoritmo testa sistematicamente a independência condicional entre pares de variáveis,
      condicionando em subconjuntos cada vez maiores de outras variáveis. Quando é detetada uma independência
      condicional, a aresta correspondente é removida do grafo.
  para-fa6c1d5937d7:
    kind: para
    context: body
    en: |-
      The DAG above represents the causal structure that we are implicitly
      assuming when we fit the model. Here all variables are independent of
      each other, and those impact directly the target variable.
    es: O DAG acima representa a estrutura causal que estamos a assumir implicitamente quando ajustamos
      o modelo. Aqui todas as variáveis são independentes umas das outras e impactam diretamente a variável
      alvo.
  para-38e91946af07:
    kind: para
    context: body
    en: |-
      The `ParentCandidateIdentifier` class below will: 1. Run a baseline
      model with only an intercept 2. Run models with each potential parent
      variable 3. Compare how much probability mass is concentrated near zero
      in the residual distributions 4. Identify variables that improve the
      model fit as potential parent candidates
    es: 'A classe `ParentCandidateIdentifier` abaixo vai: 1. Executar um modelo de base apenas com um
      termo constante 2. Executar modelos com cada variável parental potencial 3. Comparar quanta massa
      de probabilidade está concentrada perto de zero nas distribuições de resíduos 4. Identificar variáveis
      que melhoram o ajuste do modelo como candidatos a pais'
  para-04531a743c63:
    kind: para
    context: body
    en: |-
      The answer is what we observed above, the model will not be able to
      recover the true causal structure.
    es: A resposta é o que observámos acima, o modelo não será capaz de recuperar a verdadeira estrutura
      causal.
  para-c85c31744949:
    kind: para
    context: body
    en: |-
      The bias in the reverse regression arises because conditioning on $x_2$
      introduces variability from the noise inherent in $x_2$. This
      misattribution conflates the independent variability of $x_1$ with that
      induced by $x_2$, leading to residuals that systematically deviate from
      zero. Respect to the null model, the residuals are further from zero.
    es: O enviesamento na regressão inversa surge porque condicionar em $x_2$ introduz variabilidade proveniente
      do ruído inerente a $x_2$. Esta má atribuição confunde a variabilidade independente de $x_1$ com
      a induzida por $x_2$, levando a resíduos que se desviam sistematicamente de zero. Em relação ao
      modelo nulo, os resíduos estão mais afastados de zero.
  para-783fd4d51e98:
    kind: para
    context: body
    en: |-
      The causal graph capture by greedy search is very similar to the true
      causal graph. Some arrows are directed to variables that are not
      related, but this is expected given the nature of the data, we still
      have noise in the data, and sporious correlations that can't be fully
      falsify by the independence tests. Additionally, the finded graph can
      lie in the markov equivalence class of the true causal graph, meaning
      that there are multiple DAGs that are compatible with the data.
    es: O grafo causal capturado pela pesquisa gulosa é muito semelhante ao verdadeiro grafo causal. Algumas
      setas estão direcionadas para variáveis que não estão relacionadas, mas isto é esperado dada a natureza
      dos dados; ainda temos ruído nos dados e correlações espúrias que não podem ser totalmente falsificadas
      pelos testes de independência. Além disso, o grafo encontrado pode situar-se na classe de equivalência
      de Markov do verdadeiro grafo causal, o que significa que existem múltiplos DAGs que são compatíveis
      com os dados.
  para-a8160d8be629:
    kind: para
    context: body
    en: |-
      The effect was recovered perfectly, using this model, we can safely
      inform how much we'll get back if we invest in x3. Nevertheless, we need
      to control by holiday and inflation to get the total effect. What happen
      if we don't have this control variables?
    es: O efeito foi perfeitamente recuperado. Com este modelo, podemos informar com segurança quanto
      receberemos de volta se investirmos em x3. No entanto, precisamos de controlar por feriado e inflação
      para obter o efeito total. O que acontece se não tivermos estas variáveis de controlo?
  para-77ba0b77963a:
    kind: para
    context: body
    en: |-
      The explanation is straightforward: by neglecting any causal structure,
      we inadvertently impose one onto the data. The issue lies in our
      assumption of the simplest causal framework, which rarely aligns with
      real-world complexity.
    es: 'A explicação é simples: ao negligenciar qualquer estrutura causal, impomos involuntariamente
      uma aos dados. O problema reside no nosso pressuposto do enquadramento causal mais simples, que
      raramente se alinha com a complexidade do mundo real.'
  para-4c5e72677379:
    kind: para
    context: body
    en: |-
      The following DAG shows a possible causal structure of the problem.
      Let's say we have the following variables:
    es: 'O DAG seguinte mostra uma possível estrutura causal do problema. Digamos que temos as seguintes
      variáveis:'
  para-61a10d227a67:
    kind: para
    context: body
    en: |-
      The following example shows the causal graph inferred using the Greedy
      Search algorithm.
    es: O exemplo seguinte mostra o grafo causal inferido utilizando o algoritmo de Pesquisa Gulosa.
  para-70939e2da262:
    kind: para
    context: body
    en: 'The function used to model the holiday effect is defined as follows:'
    es: 'A função utilizada para modelar o efeito de feriado é definida da seguinte forma:'
  para-3f3c1a033b38:
    kind: para
    context: body
    en: |-
      The number of possible models we can generate with two out of five
      variables as parents is around 12,000, while having just one parent
      increases that number to approximately 52,000. Interestingly, removing a
      single parent node triples the potential models we can create,
      effectively multiplying the number of possible scenarios.
    es: O número de modelos possíveis que podemos gerar com duas em cinco variáveis como pais é de cerca
      de 12.000, enquanto ter apenas um pai aumenta esse número para aproximadamente 52.000. Curiosamente,
      remover um único nó pai triplica os modelos potenciais que podemos criar, multiplicando efetivamente
      o número de cenários possíveis.
  para-9e8d87c1d68b:
    kind: para
    context: body
    en: |-
      The previous plot shows how the transformations affect each variable,
      and what would be the true contribution after each transformation.
    es: O gráfico anterior mostra como as transformações afetam cada variável e qual seria a verdadeira
      contribuição após cada transformação.
  para-0af1b84dd0d5:
    kind: para
    context: body
    en: |-
      The target variable is a combination of all variables before. The
      mathematical formula can be expressed as:
    es: 'A variável alvo é uma combinação de todas as variáveis anteriores. A fórmula matemática pode
      ser expressa como:'
  para-070fc012e0e3:
    kind: para
    context: body
    en: |-
      These equations allow us to capture the complex dynamics influencing
      each marketing channel: - **Holiday Effects** increase channel activity
      around specific dates, simulating seasonal spikes. - **Cross-channel
      Influences** introduce interdependencies, modeling how one channel's
      success can amplify another's.
    es: 'Estas equações permitem-nos capturar a dinâmica complexa que influencia cada canal de marketing:
      - **Efeitos de Feriado** aumentam a atividade do canal em torno de datas específicas, simulando
      picos sazonais. - **Influências entre Canais** introduzem interdependências, modelando como o sucesso
      de um canal pode amplificar o de outro.'
  para-9f034bcf6935:
    kind: para
    context: body
    en: |-
      This creates a complex causal structure, where variables are not fully
      independent and it is not easy to infer the causal impact of each
      channel on the target variable.
    es: Isto cria uma estrutura causal complexa, onde as variáveis não são totalmente independentes e
      não é fácil inferir o impacto causal de cada canal na variável alvo.
  para-deb719afbf82:
    kind: para
    context: body
    en: |-
      This discrepancy underscores the importance of preserving the correct
      causal direction to avoid bias, as reversing the regression violates the
      causal Markov condition.
    es: Esta discrepância sublinha a importância de preservar a direção causal correta para evitar enviesamento,
      pois inverter a regressão viola a condição causal de Markov.
  para-9572e537014c:
    kind: para
    context: body
    en: |-
      This instead of being a problem, is a great news because we can now
      start to work with experimentation to test the current structure, and
      improve it iteratively, without the need to wait for these answers to
      get the right estimates in a regression model.
    es: Isto, em vez de ser um problema, é uma boa notícia porque agora podemos começar a trabalhar com
      experimentação para testar a estrutura atual e melhorá-la iterativamente, sem necessidade de esperar
      por estas respostas para obter as estimativas corretas num modelo de regressão.
  para-4375664fe399:
    kind: para
    context: body
    en: |-
      This is great! Our new causal graph is more complex, but it is more
      accurate to the one defined before. Nevertheless, we need a significant
      amount of time, and manual work to arrive to this conclusion.
    es: Isto é ótimo! O nosso novo grafo causal é mais complexo, mas é mais preciso do que o definido
      anteriormente. No entanto, precisámos de uma quantidade significativa de tempo e trabalho manual
      para chegar a esta conclusão.
  para-e2f466fa5292:
    kind: para
    context: body
    en: |-
      This latter point aligns with our earlier observation: if we control for
      inappropriate variables, the model fails to recover the true causal
      structure.
    es: 'Este último ponto alinha-se com a nossa observação anterior: se controlarmos variáveis inadequadas,
      o modelo falha em recuperar a verdadeira estrutura causal.'
  para-3ed52890c08d:
    kind: para
    context: body
    en: |-
      This leads us to which causal DAG we assume is correct, based on our
      previous assumptions. If you recognize this process, congratulations!
      You've created a generative model or Structural Causal Model, with a
      Structural Causal Equation, using PyMC-marketing.
    es: Isto leva-nos a qual DAG causal assumimos como correto, com base nos nossos pressupostos anteriores.
      Se reconhece este processo, parabéns! Criou um modelo generativo ou Modelo Causal Estrutural, com
      uma Equação Causal Estrutural, utilizando PyMC-Marketing.
  para-e451cdb8c2da:
    kind: para
    context: body
    en: |-
      This means that each possible graph with N number of variables can be a
      specific model. How many models could we specify if we have 5 variables
      for one target?
    es: Isto significa que cada grafo possível com N variáveis pode ser um modelo específico. Quantos
      modelos poderíamos especificar se tivermos 5 variáveis para um alvo?
  para-6b1250ee543d:
    kind: para
    context: body
    en: |-
      This sheds light on the challenges posed by large models:\
      a) As the number of variables increases, the exponential growth in
      potential relationships becomes overwhelming, making it difficult to
      pinpoint our actual situation.\
      b) With more variables, the likelihood of mistakenly controlling for the
      wrong variables also increases.
    es: |-
      Isto lança luz sobre os desafios impostos por modelos grandes:\
      a) À medida que o número de variáveis aumenta, o crescimento exponencial nas relações potenciais torna-se avassalador, tornando difícil identificar a nossa situação atual.\
      b) Com mais variáveis, a probabilidade de controlar incorretamente as variáveis erradas também aumenta.
  para-e377108c13e3:
    kind: para
    context: body
    en: |-
      To estimate the total effect of x2 on y without bias, you need to block
      all backdoor (confounding) paths. This means controlling for the common
      causes:
    es: 'Para estimar o efeito total de x2 sobre y sem enviesamento, é necessário bloquear todos os caminhos
      retroativos (de confundimento). Isto significa controlar as causas comuns:'
  para-3fb3df5abada:
    kind: para
    context: body
    en: |-
      To systematically identify potential parent variables in our causal
      graph, we'll create a class that evaluates different regression models
      and compares their residual distributions. This approach leverages the
      principle that when we correctly model the causal direction, residuals
      should be more tightly centered around zero compared to misspecified
      models.
    es: Para identificar sistematicamente variáveis parentais potenciais no nosso grafo causal, criaremos
      uma classe que avalia diferentes modelos de regressão e compara as suas distribuições de resíduos.
      Esta abordagem aproveita o princípio de que quando modelamos corretamente a direção causal, os resíduos
      devem estar mais estreitamente centrados em torno de zero em comparação com modelos incorretamente
      especificados.
  para-437b2febc044:
    kind: para
    context: body
    en: |-
      Ultimately, each of these causal structures exhibits different
      observational behaviors. This means that based on the observational
      data, we can deduce which structure is present, and consecuently
      determinate whats the right variable set to control.
    es: Em última análise, cada uma destas estruturas causais exibe diferentes comportamentos observacionais.
      Isto significa que, com base nos dados observacionais, podemos deduzir qual estrutura está presente
      e, consequentemente, determinar qual é o conjunto correto de variáveis a controlar.
  para-c2bb30a2fb44:
    kind: para
    context: body
    en: |-
      Understanding the conditional independencies of the variables in our
      dataset allows us to identify the parents of each variable. Currently,
      we have identified that $x_3$ and $x_2$ are children of $x_1$, and $x_1$
      is independent or truly exogenous.
    es: Compreender as independências condicionais das variáveis no nosso conjunto de dados permite-nos
      identificar os pais de cada variável. Atualmente, identificámos que $x_3$ e $x_2$ são filhos de
      $x_1$, e que $x_1$ é independente ou verdadeiramente exógena.
  para-46c0ba61eafa:
    kind: para
    context: body
    en: |-
      Using this logic, we can identify not only independent variables but
      also the candidate parents for each variable based on how they deviate
      from the null model.
    es: Utilizando esta lógica, podemos identificar não apenas variáveis independentes mas também os pais
      candidatos para cada variável com base no modo como se desviam do modelo nulo.
  para-aae88c541e9a:
    kind: para
    context: body
    en: We can again, update our causal graph to reflect the new findings.
    es: Podemos, mais uma vez, atualizar o nosso grafo causal para refletir as novas descobertas.
  para-2a5868356b9f:
    kind: para
    context: body
    en: We can now use this information to update our causal graph.
    es: Podemos agora utilizar esta informação para atualizar o nosso grafo causal.
  para-879eee3240ad:
    kind: para
    context: body
    en: |-
      We can repeat this process for all the variables in our dataset to start
      to identify the parents of each variable, and thus identifying sections
      of the true causal graph.
    es: Podemos repetir este processo para todas as variáveis no nosso conjunto de dados para começar
      a identificar os pais de cada variável e, assim, identificar secções do verdadeiro grafo causal.
  para-f79535362206:
    kind: para
    context: body
    en: |-
      We can scale the full dataset and we'll have finally something very
      similar to reality.
    es: Podemos dimensionar o conjunto de dados completo e teremos finalmente algo muito semelhante à
      realidade.
  para-3dd4847cdab0:
    kind: para
    context: body
    en: |-
      We can see by the parameters of the model is able to recover the effect
      of x2 on y, even though we removed x3 from the model.
    es: Podemos ver pelos parâmetros que o modelo é capaz de recuperar o efeito de x2 sobre y, apesar
      de termos removido x3 do modelo.
  para-4810e6201054:
    kind: para
    context: body
    en: |-
      We'll assume all of marketing activities suffer the same transformations
      Adstock and Saturation. This means, each channel will have individual
      parameters for the selected transformations, in this case Geometrick
      adstock and michaelis menten.
    es: Assumiremos que todas as atividades de marketing sofrem as mesmas transformações Adstock e Saturação.
      Isto significa que cada canal terá parâmetros individuais para as transformações selecionadas, neste
      caso adstock geométrico e michaelis-menten.
  para-78523fc2cfcc:
    kind: para
    context: body
    en: |-
      We'll start by setting the date range. Here we'll use a date range from
      2022-01-01 to 2024-11-06, meaning we have almost 3 years of data (1041
      days).
    es: Começaremos por definir o intervalo de datas. Aqui utilizaremos um intervalo de datas de 2022-01-01
      a 2024-11-06, o que significa que temos quase 3 anos de dados (1041 dias).
  para-a73a9c48c768:
    kind: para
    context: body
    en: |-
      What kind of causal structure are we implicitly assuming when we fit the
      model?
    es: Que tipo de estrutura causal estamos a assumir implicitamente quando ajustamos o modelo?
  para-d6659ccf23e1:
    kind: para
    context: body
    en: |-
      When regressing $x_2$ on $x_1$, the model leverages the causal
      direction, and the conditional distribution $P(x_2 \mid do(x_1))$ is
      more concentrated than the marginal $P(x_2)$. This results in residuals
      that are centered around zero, indicating that most variability in $x_2$
      is explained by $x_1$.
    es: Ao fazer a regressão de $x_2$ em função de $x_1$, o modelo aproveita a direção causal, e a distribuição
      condicional $P(x_2 \mid do(x_1))$ é mais concentrada do que a marginal $P(x_2)$. Isto resulta em
      resíduos centrados em torno de zero, indicando que a maior parte da variabilidade em $x_2$ é explicada
      por $x_1$.
  para-589357cfd48b:
    kind: para
    context: body
    en: |-
      Where: - $\Delta t$ is the time difference (in days) between the current
      date and the holiday date. - $\sigma$ is the standard deviation that
      controls the spread of the effect around the holiday date.
    es: 'Onde: - $\Delta t$ é a diferença temporal (em dias) entre a data atual e a data do feriado. -
      $\sigma$ é o desvio padrão que controla a dispersão do efeito em torno da data do feriado.'
  para-1b30854ff7a7:
    kind: para
    context: body
    en: |-
      Where: - $t$: The time index, representing days since the start of the
      date range. - $baseline$: A constant added to $t$ to shift the starting
      point of the trend. This value affects the initial level of market
      growth. The starting value of the function will be
      $(baseline)^{exponent} - 1$, not 0. - $exponent$: The power to which the
      time index is raised, determining the rate at which the trend
      accelerates over time.
    es: 'Onde: - $t$: O índice temporal, representando dias desde o início do intervalo de datas. - $baseline$:
      Uma constante adicionada a $t$ para deslocar o ponto de partida da tendência. Este valor afeta o
      nível inicial de crescimento do mercado. O valor inicial da função será $(baseline)^{exponent} -
      1$, não 0. - $exponent$: A potência à qual o índice temporal é elevado, determinando a taxa a que
      a tendência acelera ao longo do tempo.'
  para-f0c5e92c1c2b:
    kind: para
    context: body
    en: |-
      Where: - **Intercept**: A baseline level of sales, set to 1.5,
      representing the base sales level in the absence of other effects. -
      **Inflation**: Represents the underlying market inflation, with an
      implicit negative coefficient of 1, adding a steady downward
      influence. - **Holiday Contributions**: Adds sales spikes around holiday
      periods, capturing the seasonal increase in consumer demand. -
      **$m(Impressions_{x3_t})$ and $m(Impressions_{x2_t})$**: Represent the
      **saturated adstock** values for the marketing channels $x3$ and $x2$. -
      **Noise $\epsilon$**: A small random error term, drawn from a normal
      distribution with mean 0 and standard deviation 0.08, to account for
      unexplained variability in sales.
    es: 'Onde: - **Interceção**: Um nível base de vendas, definido como 1.5, representando o nível base
      de vendas na ausência de outros efeitos. - **Inflação**: Representa a inflação subjacente do mercado,
      com um coeficiente negativo implícito de 1, adicionando uma influência descendente constante. -
      **Contribuições de Feriado**: Adiciona picos de vendas em torno de períodos de feriados, capturando
      o aumento sazonal na procura do consumidor. - **$m(Impressions_{x3_t})$ e $m(Impressions_{x2_t})$**:
      Representam os valores de **adstock saturado** para os canais de marketing $x3$ e $x2$. - **Ruído
      $\epsilon$**: Um pequeno termo de erro aleatório, extraído de uma distribuição normal com média
      0 e desvio padrão 0.08, para dar conta da variabilidade inexplicada nas vendas.'
  para-e3bb1f1ed337:
    kind: para
    context: body
    en: |-
      While this approach provides a good initial signal for causal
      relationships, it has limitations. The method assumes linear
      relationships, doesn't account for hidden confounders, and may struggle
      with complex causal structures. Results should be considered as
      preliminary evidence rather than definitive proof of causal
      relationships.
    es: Embora esta abordagem forneça um bom sinal inicial para relações causais, tem limitações. O método
      assume relações lineares, não tem em conta confundidores ocultos e pode ter dificuldades com estruturas
      causais complexas. Os resultados devem ser considerados como evidência preliminar em vez de prova
      definitiva de relações causais.
  para-4572d92d3f24:
    kind: para
    context: body
    en: |-
      Why do this on top of the causal discovery we have already done? The
      reason is that we can use the mediation analysis to verify the causal
      relationships we have identified, becuase if a node is parent the other
      then some effect is mediated, if we can detect that mediation, then we
      can decide if the causal relationship is direct or indirect. If we fail
      to detect mediation, then probably our findings are not robust to the
      causal discovery we have done.
    es: Por que fazer isto além da descoberta causal que já realizámos? A razão é que podemos utilizar
      a análise de mediação para verificar as relações causais que identificámos, porque se um nó é pai
      do outro, então algum efeito é mediado. Se conseguirmos detetar essa mediação, então podemos decidir
      se a relação causal é direta ou indireta. Se falharmos em detetar mediação, então provavelmente
      as nossas descobertas não são robustas à descoberta causal que realizámos.
  para-dff316fea92f:
    kind: para
    context: body
    en: |-
      Yes, it is possible! We can use causal discovery algorithms to automate
      this process.
    es: Sim, é possível! Podemos utilizar algoritmos de descoberta causal para automatizar este processo.
  para-303991ab7b79:
    kind: para
    context: body
    en: |-
      You've even defined the direction of your relationships. By defining
      these relationships and assuming no direct causal connections between
      our variables, we can conclude that, if the nature of their relationship
      is accurately represented by the provided equation, then by controlling
      the relevant channels, we could uncover their true effects.
    es: Definiu até mesmo a direção das suas relações. Ao definir estas relações e assumir que não existem
      conexões causais diretas entre as nossas variáveis, podemos concluir que, se a natureza da sua relação
      for representada com precisão pela equação fornecida, então ao controlar os canais relevantes, poderíamos
      descobrir os seus verdadeiros efeitos.
  para-61f483d20333:
    kind: para
    context: body
    en: |-
      where $x_1$ is exogenous and independent of any effects. This structure
      reflects that $x_1$'s distribution remains unchanged regardless of the
      downstream variable $x_2$.
    es: onde $x_1$ é exógena e independente de quaisquer efeitos. Esta estrutura reflete que a distribuição
      de $x_1$ permanece inalterada independentemente da variável a jusante $x_2$.
  plain-62abb49798c9:
    kind: plain
    context: body
    en: Causal Sufficiency Assumption
    es: Pressuposto de Suficiência Causal
