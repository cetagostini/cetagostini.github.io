  list-item-c9c290a66917:
    kind: list-item
    context: list
    en: |-
      Embrace Model Evolution: Don't get too attached to your first model! As
      we saw in our DAG progression, models can (and should) change as we
      learn more. Starting simple is fine, but be ready to level up your model
      game when the data shows there's more to the story.
    es: 'Abrace a Evolução do Modelo: Não se apegue demasiado ao seu primeiro modelo! Como vimos na nossa
      progressão de DAG, os modelos podem (e devem) mudar à medida que aprendemos mais. Começar simples
      é aceitável, mas esteja preparado para elevar o nível do seu modelo quando os dados mostrarem que
      há mais a descobrir.'
