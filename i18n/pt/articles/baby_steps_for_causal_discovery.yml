    en: |-
      Generative models are frameworks that describe how data could be
      produced in the real world. They outline a process by defining
      probability distributions for each component, simulating the creation of
      data from underlying random variables. This approach captures
      uncertainty and variability, providing a complete picture of the data
      generation mechanism.
    es: Os modelos generativos são estruturas que descrevem como os dados poderiam ser produzidos no mundo
      real. Descrevem um processo definindo distribuições de probabilidade para cada componente, simulando
      a criação de dados a partir de variáveis aleatórias subjacentes. Esta abordagem captura incerteza
      e variabilidade, fornecendo uma imagem completa do mecanismo de geração de dados.
