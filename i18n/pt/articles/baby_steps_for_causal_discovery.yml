  para-2bd5a21b09c7:
    kind: para
    context: body
    en: |-
      In a causal system where the true direction is $x_1$ to $x_2$, the joint
      distribution factorizes as $$
      P(x_1, x_2) = P(x_1) \, P(x_2 \mid x_1),
      $$
    es: |-
      Num sistema causal onde a direção verdadeira é $x_1$ para $x_2$, a distribuição conjunta fatoriza-se como $$
      P(x_1, x_2) = P(x_1) \, P(x_2 \mid x_1),
      $$
  para-72d945ea98da:
    kind: para
    context: body
    en: |-
      In contrast, reversing the regression by modeling $x_1$ as a function of
      $x_2$ disrupts the causal order. The conditional distribution
      $P(x_1 \mid do(x2))$ deviates from the true marginal $P(x_1)$, as it
      attempts to capture the cause from its effect, which is not supported by
      the causal structure.
    es: Em contraste, inverter a regressão modelando $x_1$ como função de $x_2$ perturba a ordem causal.
      A distribuição condicional $P(x_1 \mid do(x2))$ desvia-se da verdadeira marginal $P(x_1)$, pois
      tenta capturar a causa a partir do seu efeito, o que não é sustentado pela estrutura causal.
  para-6fe2604732e2:
    kind: para
    context: body
    en: |-
      In mediation analysis, the total effect of a predictor $X1$ on a target
      $T$ is decomposed into direct and indirect components. The indirect
      effect operates through a mediator $M$, modeled as
      $M = \alpha_m + a \times X1 + \text{error}$. Simultaneously, the outcome
      is modeled as $T = \alpha_y + c' \times X1 + b \times M + \text{error}$.
      Here, the product $a \times b$ quantifies the indirect effect, while
      $c'$ represents the direct effect of $X1$ on $T$. By estimating these
      coefficients, we can assess whether the influence of $X1$ on $T$ is
      transmitted via $M$, entirely direct, or a combination of both.
      Statistical inference is performed using credible intervals, where
      intervals excluding zero indicate significant effects.
    es: Na análise de mediação, o efeito total de um preditor $X1$ sobre um alvo $T$ é decomposto em componentes
      diretos e indiretos. O efeito indireto opera através de um mediador $M$, modelado como $M = \alpha_m
      + a \times X1 + \text{error}$. Simultaneamente, o resultado é modelado como $T = \alpha_y + c' \times
      X1 + b \times M + \text{error}$. Aqui, o produto $a \times b$ quantifica o efeito indireto, enquanto
      $c'$ representa o efeito direto de $X1$ sobre $T$. Ao estimar estes coeficientes, podemos avaliar
      se a influência de $X1$ sobre $T$ é transmitida via $M$, totalmente direta, ou uma combinação de
      ambos. A inferência estatística é realizada utilizando intervalos de credibilidade, onde intervalos
      que excluem zero indicam efeitos significativos.
  para-de4430acd29d:
    kind: para
    context: body
    en: |-
      In simple terms, mediation analysis helps us determine whether a
      predictor $X1$ influences an outcome $T$ directly or mainly by first
      affecting a mediator $M$, which then impacts $T$. If the mediator's
      effect is significant while the direct effect is not, it suggests that
      $X1$ affects $T$ primarily through its influence on $M$.
    es: Em termos simples, a análise de mediação ajuda-nos a determinar se um preditor $X1$ influencia
      um resultado $T$ diretamente ou principalmente ao afetar primeiro um mediador $M$, que depois impacta
      $T$. Se o efeito do mediador for significativo enquanto o efeito direto não é, sugere que $X1$ afeta
      $T$ principalmente através da sua influência em $M$.
