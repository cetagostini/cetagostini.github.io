  para-1b3d90b49f41:
    kind: para
    context: body
    en: |-
      **Chains**: A chain represents a sequential causal pathway where one
      variable influences another, which in turn affects a third variable.
      This structure highlights the mediation process through which causal
      effects are transmitted. The intermediate variable acts as a mediator,
      carrying the influence from the initial cause to the final outcome.
      Analyzing chains helps distinguish between direct and indirect effects
      in a causal system. Controlling for the mediator inappropriately may
      block parts of the causal effect that are of interest.
    es: '**Cadeias**: Uma cadeia representa um caminho causal sequencial onde uma variável influencia
      outra, que por sua vez afeta uma terceira variável. Esta estrutura destaca o processo de mediação
      através do qual os efeitos causais são transmitidos. A variável intermédia atua como mediadora,
      transportando a influência da causa inicial para o resultado final. Analisar cadeias ajuda a distinguir
      entre efeitos diretos e indiretos num sistema causal. Controlar inadequadamente o mediador pode
      bloquear partes do efeito causal que são de interesse.'
  para-2504adc38110:
    kind: para
    context: body
    en: |-
      **Channel $x1$**: As mentioned before, we generate $x1$ which is
      affected by the holiday signal, we could define it as:
    es: '**Canal $x1$**: Como mencionado anteriormente, geramos $x1$ que é afetado pelo sinal de feriado,
      podemos defini-lo como:'
  para-ac1a73e7e2fb:
    kind: para
    context: body
    en: |-
      **Channel $x2$**: On the other hand, we generate $x2$ which is affected
      by the holiday signal, and the influence of $x1$. We could define it as:
    es: '**Canal $x2$**: Por outro lado, geramos $x2$ que é afetado pelo sinal de feriado e pela influência
      de $x1$. Podemos defini-lo como:'
  para-04eba6c32209:
    kind: para
    context: body
    en: |-
      **Channel $x3$**: For the last variable, we generate $x3$ which is
      affected by $x1$ only.
    es: '**Canal $x3$**: Para a última variável, geramos $x3$ que é afetado apenas por $x1$.'
  para-5a0684716d79:
    kind: para
    context: body
    en: |-
      **Colliders**: A collider is a variable that is the common effect of two
      or more causal factors. It sits at the convergence of different causal
      paths and can introduce spurious associations when conditioned upon.
      Controlling for a collider can inadvertently open up non-causal,
      backdoor paths, leading to biased estimates. This phenomenon, known as
      collider bias, distorts the true relationships among the causal
      variables. Avoiding conditioning on colliders is crucial for maintaining
      the validity of causal models.
    es: '**Colisores**: Um colisor é uma variável que é o efeito comum de dois ou mais fatores causais.
      Situa-se na convergência de diferentes caminhos causais e pode introduzir associações espúrias quando
      se controla por ele. Controlar um colisor pode inadvertidamente abrir caminhos retroativos não causais,
      conduzindo a estimativas enviesadas. Este fenómeno, conhecido como enviesamento por colisão, distorce
      as verdadeiras relações entre as variáveis causais. Evitar controlar por colisores é crucial para
      manter a validade dos modelos causais.'
  para-22e510d51d6d:
    kind: para
    context: body
    en: '**Confounding paths:**'
    es: '**Caminhos de confundimento:**'
  para-f60878f3482d:
    kind: para
    context: body
    en: |-
      **Forks**: A fork is a causal structure where a single variable acts as
      a common cause for two or more other variables. This common cause
      transmits its influence to all its direct descendants. The existence of
      a fork creates confounding, making the relationship between the
      descendant variables appear related. Controlling for the common cause
      can effectively block the backdoor paths created by this structure.
    es: '**Garfos**: Um garfo é uma estrutura causal onde uma variável única atua como causa comum para
      duas ou mais outras variáveis. Esta causa comum transmite a sua influência a todos os seus descendentes
      diretos. A existência de um garfo cria confundimento, fazendo com que a relação entre as variáveis
      descendentes pareça estar relacionada. Controlar a causa comum pode efetivamente bloquear os caminhos
      retroativos criados por esta estrutura.'
  para-ab328ae31442:
    kind: para
    context: body
    en: '**Mediating path:**'
    es: '**Caminho mediador:**'
  para-bdff1e556bac:
    kind: para
    context: body
    en: '**What needs to be controlled?**'
    es: '**O que precisa de ser controlado?**'
  para-c6bd650e77e1:
    kind: para
    context: body
    en: |-
      **Why not control for x3?** Since x3 is a mediator (i.e., it transmits
      part of the effect of x2 to y), including it in your regression would
      block the indirect effect of x2 on y. This "over-control" would result
      in an estimate that reflects only the direct effect of x2 on y, not the
      total effect. Additionally, controlling for mediators can sometimes
      introduce bias if there are other complex relationships in the graph.
    es: '**Por que não controlar x3?** Uma vez que x3 é um mediador (ou seja, transmite parte do efeito
      de x2 para y), incluí-lo na sua regressão bloquearia o efeito indireto de x2 sobre y. Este "excesso
      de controlo" resultaria numa estimativa que reflete apenas o efeito direto de x2 sobre y, não o
      efeito total. Além disso, controlar mediadores pode por vezes introduzir enviesamento se existirem
      outras relações complexas no grafo.'
  para-00aead078cf3:
    kind: para
    context: body
    en: |-
      Any causal discovery algorithm is based on the assumption that all the
      relevant variables are observed. If some relevant variable is not
      observed, the algorithm will not be able to infer the correct causal
      graph. Each variable, even the unobserved ones, should be represented in
      the dataset, so the algorithm can include them in the causal graph and
      validation tests.
    es: Qualquer algoritmo de descoberta causal baseia-se no pressuposto de que todas as variáveis relevantes
      são observadas. Se alguma variável relevante não for observada, o algoritmo não será capaz de inferir
      o grafo causal correto. Cada variável, mesmo as não observadas, deve estar representada no conjunto
      de dados, para que o algoritmo possa incluí-las no grafo causal e nos testes de validação.
  para-3d063a959a2d:
    kind: para
    context: body
    en: |-
      As a company we probably invest in different channels to acquire new
      customers. Some actions are more direct, like paid ads, and others are
      more indirect, like offline media marketing, as marketers and scientist,
      we want to understand the impact of each channel on the target variable
      (number of new customers).
    es: Como empresa, provavelmente investimos em diferentes canais para adquirir novos clientes. Algumas
      ações são mais diretas, como publicidade paga, e outras são mais indiretas, como marketing em media
      offline. Como profissionais de marketing e cientistas, queremos compreender o impacto de cada canal
      na variável alvo (número de novos clientes).
  para-f5f62eb8a49d:
    kind: para
    context: body
    en: |-
      As a result, it enables a consistent estimation of causal effects, even
      when we encounter endogeneity. Therefore, grasping chain structures is
      essential, as it not only supports the rationale behind IV methods but
      also underscores the significance of identifying valid instruments.
    es: Como resultado, permite uma estimativa consistente dos efeitos causais, mesmo quando encontramos
      endogeneidade. Portanto, compreender as estruturas de cadeia é essencial, pois não só sustenta a
      lógica por trás dos métodos de IV como também sublinha a importância de identificar instrumentos
      válidos.
  para-e3522909a674:
    kind: para
    context: body
    en: |-
      As anticipated, the model fails to accurately reflect the true
      contributions, resulting in estimates that significantly deviate from
      the actual values. How can this occur, and why is this happening?
    es: Como previsto, o modelo não consegue refletir com precisão as verdadeiras contribuições, resultando
      em estimativas que desviam significativamente dos valores reais. Como pode isto acontecer, e por
      que razão está a acontecer?
  para-75df79a7c25b:
    kind: para
    context: body
    en: |-
      As expected, the effect of x2 on y is recovered, even though we removed
      control variables from the model, and use a gaussian process to account
      for the variability of the data instead.
    es: Como esperado, o efeito de x2 sobre y é recuperado, apesar de termos removido as variáveis de
      controlo do modelo, utilizando em vez disso um processo gaussiano para dar conta da variabilidade
      dos dados.
  para-eede6661509e:
    kind: para
    context: body
    en: |-
      Based on the provided DAG, we can create some synthetic data to test how
      our model performs when we have a complex causal structures. Using the
      same data, we can test different model compositions and see how could we
      improve our model to uncover the true causal impact of each channel on
      the target variable.
    es: Com base no DAG fornecido, podemos criar alguns dados sintéticos para testar como o nosso modelo
      se comporta quando temos estruturas causais complexas. Utilizando os mesmos dados, podemos testar
      diferentes composições de modelos e ver como podemos melhorar o nosso modelo para descobrir o verdadeiro
      impacto causal de cada canal na variável alvo.
  para-4e0d8345533b:
    kind: para
    context: body
    en: |-
      Bayesian regression models allow us to estimate the conditional
      expectation of an outcome given a set of predictors, effectively
      uncovering the underlying conditional probabilities. In a bayesian
      linear regression, for example, we estimate
      $E(Y \mid X) = \beta_0 + \beta_1X_1 + \ldots + \beta_kX_k$, which
      represents the average outcome $Y$ when the predictors $X_1, \dots, X_k$
      are held at specific values.
    es: Os modelos de regressão bayesianos permitem-nos estimar a esperança condicional de um resultado
      dado um conjunto de preditores, descobrindo efetivamente as probabilidades condicionais subjacentes.
      Numa regressão linear bayesiana, por exemplo, estimamos $E(Y \mid X) = \beta_0 + \beta_1X_1 + \ldots
      + \beta_kX_k$, que representa o resultado médio $Y$ quando os preditores $X_1, \dots, X_k$ são mantidos
      em valores específicos.
  para-3604bed2bfa8:
    kind: para
    context: body
    en: |-
      Causal Learn allows use to use different algorithms to infer the markov
      equivalent class of the causal graph. The previous class is a wrapper
      that allows us to use the different algorithms implemented in the causal
      learn library, and plot them more easily.
    es: O Causal Learn permite-nos utilizar diferentes algoritmos para inferir a classe equivalente de
      Markov do grafo causal. A classe anterior é um wrapper que nos permite utilizar os diferentes algoritmos
      implementados na biblioteca causal learn e representá-los graficamente de forma mais fácil.
  para-67aa9e7239f2:
    kind: para
    context: body
    en: |-
      Causal Markov Assumption: Each variable is independent of its
      non-effects given its direct causes, meaning that the joint probability
      distribution can be factorized according to the directed acyclic graph
      structure. This implies that once you condition on a variable's
      immediate causes, any further upstream or parallel influences are
      rendered statistically irrelevant.
    es: 'Pressuposto Causal de Markov: Cada variável é independente dos seus não-efeitos dadas as suas
      causas diretas, o que significa que a distribuição de probabilidade conjunta pode ser fatorizada
      de acordo com a estrutura do grafo acíclico direcionado. Isto implica que, ao controlar pelas causas
      imediatas de uma variável, quaisquer influências paralelas ou a montante tornam-se estatisticamente
      irrelevantes.'
  para-b928f186e0be:
    kind: para
    context: body
    en: |-
      Causal discovery infers directional cause-and-effect relationships from
      observational data. It uses computational algorithms to construct
      directed acyclic graphs that represent potential causal mechanisms.
      These techniques are based on the causal Markov condition and the
      assumption of statistical faithfulness. They employ statistical tests
      for conditional independence to differentiate direct influences from
      indirect associations. This approach integrates statistical inference
      and graph theory to model complex systems. Overall, it uncovers hidden
      causal structures that enhance our understanding and estimations of
      dynamic phenomena.
    es: A descoberta causal infere relações direcionais de causa e efeito a partir de dados observacionais.
      Utiliza algoritmos computacionais para construir grafos acíclicos direcionados que representam mecanismos
      causais potenciais. Estas técnicas baseiam-se na condição causal de Markov e no pressuposto de fidelidade
      estatística. Empregam testes estatísticos de independência condicional para diferenciar influências
      diretas de associações indiretas. Esta abordagem integra inferência estatística e teoria dos grafos
      para modelar sistemas complexos. No seu conjunto, descobre estruturas causais ocultas que melhoram
      a nossa compreensão e estimativas de fenómenos dinâmicos.
  para-9b4a2fc7b370:
    kind: para
    context: body
    en: |-
      Causal structures play a crucial role in various causal inference
      methods, serving as the foundation for their functionality. For
      instance, chain structures are key to methods like instrumental
      variables (IV). In IV analysis, this chain structure comes into play by
      introducing an instrument---a variable that impacts the exposure but
      does not directly affect the outcome, except through that exposure. This
      approach helps break the confounding path, allowing us to isolate the
      exogenous variation in treatment.
    es: As estruturas causais desempenham um papel crucial em vários métodos de inferência causal, servindo
      como base para o seu funcionamento. Por exemplo, as estruturas de cadeia são essenciais para métodos
      como variáveis instrumentais (IV). Na análise IV, esta estrutura de cadeia entra em jogo ao introduzir
      um instrumento --- uma variável que afeta a exposição mas não afeta diretamente o resultado, exceto
      através dessa exposição. Esta abordagem ajuda a quebrar o caminho de confundimento, permitindo-nos
      isolar a variação exógena no tratamento.
  para-6fe6f862e8b3:
    kind: para
    context: body
    en: |-
      Certain holidays, like Christmas, can have a significant impact on
      consumer behavior before and after the specific date, leading to
      seasonal spikes in sales. To capture these effects, we introduce a
      holiday signal based on Gaussian (normal) distributions centered around
      specific holiday dates.
    es: Certos feriados, como o Natal, podem ter um impacto significativo no comportamento do consumidor
      antes e depois da data específica, levando a picos sazonais nas vendas. Para capturar estes efeitos,
      introduzimos um sinal de feriado baseado em distribuições gaussianas (normais) centradas em torno
      de datas de feriados específicas.
  para-8add77ddfced:
    kind: para
    context: body
    en: |-
      Conditional independence is a core concept in probability theory and
      statistics where two variables are independent of each other once a
      third variable is held constant. This means that, given the value of the
      conditioning variable, the two variables do not provide additional
      information about one another. In causal discovery, conditional
      independencies are crucial because they reveal the underlying structure
      of causal relationships in a model or a directed acyclic graph (DAG). By
      identifying these independencies, we can determine how variables are
      related to each other, or not.
    es: A independência condicional é um conceito central na teoria das probabilidades e na estatística,
      em que duas variáveis são independentes uma da outra após uma terceira variável ser mantida constante.
      Isto significa que, dado o valor da variável de controlo, as duas variáveis não fornecem informação
      adicional sobre uma à outra. Na descoberta causal, as independências condicionais são cruciais porque
      revelam a estrutura subjacente das relações causais num modelo ou num grafo acíclico direcionado
      (DAG). Ao identificar estas independências, podemos determinar como as variáveis estão relacionadas
      entre si, ou não.
  para-6317164c45b4:
    kind: para
    context: body
    en: 'Currently we wrap the following algorithms:'
    es: 'Atualmente, envolvemos os seguintes algoritmos:'
  para-591c44495be6:
    kind: para
    context: body
    en: |-
      During the model development, we established a specific structure and
      flow for our data. We concluded that the impacts of our channels operate
      independently of each other. Moreover, we determined that if any
      component of our ecosystem is missing, its influence will be accounted
      for by the baseline term due to this equation. As you can see, even by
      adopting this basic model, we are making significant assumptions.
    es: Durante o desenvolvimento do modelo, estabelecemos uma estrutura e fluxo específicos para os nossos
      dados. Concluímos que os impactos dos nossos canais operam de forma independente uns dos outros.
      Além disso, determinámos que se qualquer componente do nosso ecossistema estiver em falta, a sua
