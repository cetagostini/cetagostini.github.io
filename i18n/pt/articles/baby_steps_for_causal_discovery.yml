  list-item-471ad7d509b3:
    kind: list-item
    context: list
    en: |-
      "Find" the Causal Truth: Dive into the world of causal structures and
      learn how to map out the hidden pathways that influence your outcomes.
      Not consider causal structures will drive you to consider more simple
      causal structures, which can be problematic in a real world enviroment.
    es: '"Encontrar" a Verdade Causal: Mergulhe no mundo das estruturas causais e aprenda a mapear os
      caminhos ocultos que influenciam os seus resultados. Não considerar estruturas causais levá-lo-á
      a considerar estruturas causais mais simples, o que pode ser problemático num ambiente do mundo
      real.'
