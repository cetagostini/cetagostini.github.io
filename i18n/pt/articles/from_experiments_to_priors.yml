  list-item-cc70d0dcbff2:
    kind: list-item
    context: list
    en: $\alpha$ is the maximum achievable effect (the asymptote)
    es: $\alpha$ é o efeito máximo alcançável (a assíntota)
  list-item-f18ee2795f82:
    kind: list-item
    context: list
    en: |-
      $\lambda$ is the half-saturation point (the spend level at which we
      reach half the maximum effect)
    es: $\lambda$ é o ponto de meia-saturação (o nível de gasto ao qual atingimos metade do efeito máximo)
  list-item-ef53b60af710:
    kind: list-item
    context: list
    en: |-
      **A small PyMC prior elicitation model replaces point optimization.**
      The Bayesian elicitation model produces a full joint posterior that
      honestly represents what the experiment tells us --- and multiple
      experiments pin down the curve further. Run experiments across different
      spend levels and time periods for the strongest elicitation.
    es: '**Um pequeno modelo de elicitação de prior do PyMC substitui a otimização por ponto.** O modelo
      bayesiano de elicitação produz um posterior conjunta completo que representa honestamente o que
      o experimento nos diz --- e múltiplos experimentos fixam a curva ainda mais. Execute experimentos
      em diferentes níveis de gasto e períodos temporais para a elicitação mais forte.'
  list-item-7ccb034f4824:
    kind: list-item
    context: list
    en: |-
      **Bottom panel**: The cumulative causal impact --- the running total of
      the pointwise differences over time.
    es: '**Painel inferior**: O impacto causal cumulativo --- o total acumulado das diferenças pontuais
      ao longo do tempo.'
  list-item-e9a6409adb4a:
    kind: list-item
    context: list
    en: '**Build on existing work** --- leverage community intelligence.'
    es: '**Aproveitar trabalho existente** --- alavancar a inteligência da comunidade.'
  list-item-68dba4582c19:
    kind: list-item
    context: list
    en: |-
      **Create custom workflows** --- combine causal inference and Bayesian
      modeling in ways no single tool supports.
    es: '**Criar fluxos de trabalho personalizados** --- combinar inferência causal e modelação bayesiana
      de formas que nenhuma ferramenta individual suporta.'
  list-item-1faeade69c9c:
    kind: list-item
    context: list
    en: |-
      **Ensure transparency** --- methodologies are open for inspection and
      validation.
    es: '**Assegurar transparência** --- as metodologias estão abertas a inspeção e validação.'
  list-item-43045efafd1d:
    kind: list-item
    context: list
    en: |-
      **Even a single experiment dramatically improves priors.** The
      experiment-informed model's priors were far more concentrated around the
      true values than the generic defaults, giving MCMC a much better
      starting point.
    es: '**Mesmo um único experimento melhora drasticamente as priors.** As priors do modelo informado
      por experimentos estavam muito mais concentradas em torno dos valores reais do que as predefinições
      genéricas, proporcionando ao MCMC um ponto de partida muito melhor.'
  list-item-2a43098d8144:
    kind: list-item
    context: list
    en: |-
      **Extend functionality** --- contribute to the codebase or build
      complementary tools.
    es: '**Estender funcionalidade** --- contribuir para o código-fonte ou construir ferramentas complementares.'
  list-item-d3a1ce8ee047:
    kind: list-item
    context: list
    en: |-
      **Middle panel**: The pointwise causal impact --- the difference between
      observed and synthetic at each time step. Near zero pre-intervention;
      distinctly negative afterward.
    es: '**Painel do meio**: O impacto causal pontual --- a diferença entre o observado e o sintético
      em cada passo temporal. Próximo de zero antes da intervenção; distintamente negativo depois.'
  list-item-52002c7f8f2a:
    kind: list-item
    context: list
    en: |-
      **Quasi-experiments are a natural source of prior information.** Using
      CausalPy's `SyntheticControl`, we estimated the causal effect of
      reducing advertising spend --- and translated that estimate into
      actionable prior distributions.
    es: '**Os quase-experimentos são uma fonte natural de informação de prior.** Utilizando o `SyntheticControl`
      do CausalPy, estimámos o efeito causal da redução do investimento em media --- e traduzimos essa
      estimativa em distribuições prior acionáveis.'
  list-item-e85c238d6003:
    kind: list-item
    context: list
    en: |-
      **The derivative of the saturation function is the bridge.** By placing
      our experimental observation in derivative space, we connect real-world
      causal evidence to the parameters ($\alpha$, $\lambda$) of the
      saturation curve.
    es: '**A derivada da função de saturação é a ponte.** Ao colocar a nossa observação experimental no
      espaço das derivadas, conectamos a evidência causal do mundo real aos parâmetros ($\alpha$, $\lambda$)
      da curva de saturação.'
  list-item-538788b67426:
    kind: list-item
    context: list
    en: |-
      **The multidimensional MMM from `pymc-marketing` makes this seamless.**
      The `Prior` class, transformation objects (`GeometricAdstock`,
      `MichaelisMentenSaturation`), and the unified `MMM` class let us inject
      experimental knowledge directly into the model specification --- no
      hacks required.
    es: '**O MMM multidimensional do `pymc-marketing` torna isto transparente.** A classe `Prior`, os
      objetos de transformação (`GeometricAdstock`, `MichaelisMentenSaturation`), e a classe unificada
      `MMM` permitem-nos injetar conhecimento experimental diretamente na especificação do modelo ---
      sem hacks necessários.'
  list-item-c5cca97545cf:
    kind: list-item
    context: list
    en: |-
      **Top panel**: Observed Venezuela sales versus the synthetic
      counterfactual constructed from Colombia. Before the intervention the
      synthetic closely tracks reality; after the intervention a visible gap
      opens --- the divergence between the synthetic and the observed.
    es: '**Painel superior**: Vendas observadas da Venezuela versus o contrafactual sintético construído
      a partir da Colômbia. Antes da intervenção, o sintético acompanha de perto a realidade; após a intervenção,
      abre-se um visível hiato --- a divergência entre o sintético e o observado.'
  list-item-57e276874790:
    kind: list-item
    context: list
    en: |-
      Building a small **PyMC prior elicitation model** that turns the
      experimental observation into a full posterior over saturation
      parameters.
    es: Construir um pequeno **modelo de elicitação de prior do PyMC** que transforma a observação experimental
      num posterior completo sobre os parâmetros de saturação.
