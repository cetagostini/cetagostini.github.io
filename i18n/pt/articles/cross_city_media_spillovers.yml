  list-item-7333017e9646:
    kind: list-item
    context: list
    en: $C_{r,t}$ is the contribution of the observed controls;
    es: $C_{r,t}$ é a contribuição dos controlos observados;
  list-item-df27ae05ee1c:
    kind: list-item
    context: list
    en: $M_{r,s,k}\in\{0,1\}$ is the pre-specified route mask;
    es: $M_{r,s,k}\in\{0,1\}$ é a máscara de rotas pré-especificada;
  list-item-448f12822034:
    kind: list-item
    context: list
    en: $S_{r,t}$ is the total spill arriving in receiving city $r$;
    es: $S_{r,t}$ é o total de transbordamento que chega à cidade recetora $r$;
  list-item-20a183b3debf:
    kind: list-item
    context: list
    en: |-
      $\beta_{r}$ is the baseline, the intercept the model learns for city
      $r$;
    es: $\beta_{r}$ é a linha de base, o intercepto que o modelo aprende para a cidade $r$;
  list-item-b15df26c32f9:
    kind: list-item
    context: list
    en: $\epsilon_{r,t}$ is the residual noise.
    es: $\epsilon_{r,t}$ é o ruído residual.
  list-item-c33b043e2ea6:
    kind: list-item
    context: list
    en: |-
      $\mu^{\text{direct}}_{r,t}$ is the contribution of that city's own
      media, after adstock and saturation;
    es: $\mu^{\text{direct}}_{r,t}$ é a contribuição dos media dessa própria cidade, após adstock e saturação;
  list-item-ecdaceea8a73:
    kind: list-item
    context: list
    en: |-
      $\rho_{s,k}$ is the learned share exported by source city $s$ and
      channel $k$;
    es: $\rho_{s,k}$ é a quota aprendida exportada pela cidade de origem $s$ e canal $k$;
  list-item-0bd9fdbef450:
    kind: list-item
    context: list
    en: |-
      $g_{s,k}(X_{s,k,t})$ is the direct contribution evaluated from the same
      model graph after adstock and saturation;
    es: $g_{s,k}(X_{s,k,t})$ é a contribuição direta calculada a partir do mesmo grafo do modelo após
      adstock e saturação;
  list-item-454585c30349:
    kind: list-item
    context: list
    en: |-
      **Adjacent-category TV demand.** A TV spot for one product category may
      shift demand toward a related category that shares shelf space.
    es: '**Procura de TV em categorias adjacentes.** Um anúncio de TV para uma categoria de produto pode
      desviar a procura para uma categoria relacionada que partilha espaço na prateleira.'
  list-item-82e21d1c5dbc:
    kind: list-item
    context: list
    en: |-
      **Causal geo experiments.** Randomized geographic holdouts or switchback
      designs remain the strongest tool for identifying cross-market effects.
      An observational model can represent the mechanism; an experiment can
      measure it.
    es: '**Experimentos geo causais.** Os bloqueios geográficos aleatorizados ou designs de switchback
      permanecem a ferramenta mais forte para identificar efeitos entre mercados. Um modelo observacional
      pode representar o mecanismo; um experimento pode medi-lo.'
  list-item-129307e09a2c:
    kind: list-item
    context: list
    en: |-
      **Hierarchical geo-level models.** [Sun et
      al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3804.pdf)
      pool response information across geographies with partial pooling. That
      can reduce data sparsity, but it does not explicitly route exposure from
      a source city to a receiver.
    es: '**Modelos geo de nível hierárquico.** [Sun et al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3804.pdf)
      agregam informação de resposta entre geografias com pooling parcial. Isso pode reduzir a esparsidade
      dos dados, mas não encaminha explicitamente a exposição de uma cidade de origem para uma recetora.'
  list-item-5748cf0dd883:
    kind: list-item
    context: list
    en: |-
      **Independent city MMMs encode a strong assumption.** They say media
      cannot move outcomes across city boundaries.
    es: '**MMMs de cidades independentes codificam uma suposição forte.** Dizem que os media não conseguem
      deslocar resultados através das fronteiras da cidade.'
  list-item-b5c08ae4c5aa:
    kind: list-item
    context: list
    en: |-
      **Outcome-dependent spill.** The current mask is fixed before seeing the
      data. If spill magnitude depends on the receiver city's demand state,
      the routing needs a richer structure --- for example, a multiplicative
      interaction or a state-dependent kernel.
    es: '**Transbordamento dependente do resultado.** A máscara atual é fixa antes de ver os dados. Se
      a magnitude do transbordamento depender do estado de procura da cidade recetora, o encaminhamento
      precisa de uma estrutura mais rica --- por exemplo, uma interação multiplicativa ou um kernel dependente
      do estado.'
  list-item-c17437536226:
    kind: list-item
    context: list
    en: |-
      **Paid-search brand halo.** A national brand campaign can lift branded
      search conversions in regions where no search ads were active that week.
    es: '**Halo de marca em pesquisa paga.** Uma campanha de marca nacional pode aumentar as conversões
      de pesquisa de marca em regiões onde não havia anúncios de pesquisa ativos nessa semana.'
  list-item-739542db7fc6:
    kind: list-item
    context: list
    en: |-
      **PyMC-Marketing already exposes the right seam.** A custom `MuEffect`
      adds the missing mechanism without rewriting the base MMM.
    es: '**O PyMC-Marketing já expõe a junção correta.** Um `MuEffect` personalizado adiciona o mecanismo
      em falta sem reescrever o MMM base.'
  list-item-93e62995be80:
    kind: list-item
    context: list
    en: |-
      **Receiver-specific response and adstock.** A receiver city may respond
      to the same channel with a different lag structure or saturation curve.
      Estimating those separately costs more parameters but captures
      asymmetric timing.
    es: '**Resposta e adstock específicos do recetor.** Uma cidade recetora pode responder ao mesmo canal
      com uma estrutura de atraso ou curva de saturação diferente. Estimá-los separadamente custa mais
      parâmetros, mas captura temporização assimétrica.'
  list-item-2935aaf150a5:
    kind: list-item
    context: list
    en: |-
      **Register spatial coordinates and the pre-specified route mask.**
      `create_data` adds a `spend_city` coordinate (mirroring `city`) and
      stores the Boolean path mask as a model constant. The mask comes from
      prior business knowledge---broadcast footprints, campaign eligibility,
      distribution territories---not from the outcome.
    es: '**Registar coordenadas espaciais e a máscara de rotas pré-especificada.** `create_data` adiciona
      uma coordenada `spend_city` (espelhando `city`) e armazena a máscara booleana de caminhos como constante
      do modelo. A máscara provém de conhecimento empresarial prévio---coberturas de radiodifusão, elegibilidade
      de campanha, territórios de distribuição---não do resultado.'
  list-item-e7eafcef1100:
    kind: list-item
    context: list
    en: |-
      **Representation is not identification.** The model can express spill
      and quantify uncertainty, but causal claims still require a credible
      design.
    es: '**A representação não é identificação.** O modelo consegue exprimir transbordamento e quantificar
      a incerteza, mas as alegações causais ainda requerem um design credível.'
  list-item-6cb7699f12a4:
    kind: list-item
    context: list
    en: |-
      **Retail-store proximity.** A new store opening can cannibalise sales at
      nearby locations --- a geographic spillover in the opposite direction.
    es: '**Proximidade de lojas de retalho.** A abertura de uma nova loja pode canibalizar vendas em localizações
      próximas --- um transbordamento geográfico na direção oposta.'
  list-item-4af1e6832081:
    kind: list-item
    context: list
    en: |-
      **Richer kernels.** Gaussian-process or spectral kernels over geographic
      distance can capture gradual decay rather than binary route presence.
    es: '**Kernels mais ricos.** Kernels de processos gaussianos ou espectrais sobre distância geográfica
      podem capturar decaimento gradual em vez de presença binária de rota.'
  list-item-7076af5c018e:
    kind: list-item
    context: list
    en: |-
      **Route the model-owned direct contribution to the receiving city and
      return `(date, city)`.** The effect reads `channel_contribution` from
      the model's own forward pass, multiplies by the bounded share and the
      route mask, and sums over sources.
    es: '**Encaminhar a contribuição direta pertencente ao modelo para a cidade recetora e devolver `(date,
      city)`.** O efeito lê `channel_contribution` da passagem direta do próprio modelo, multiplica pela
      quota limitada e pela máscara de rotas, e soma sobre as origens.'
  list-item-c61ce9b0984e:
    kind: list-item
    context: list
    en: |-
      **Sample bounded spill shares only on active source-channel pairs.**
      `create_effect` wraps a `MaskedPrior` over a $\operatorname{Beta}(1,1)$
      base prior, so only the allowed routes receive a free parameter.
    es: '**Amostrar quotas de transbordamento limitadas apenas em pares canal de origem ativos.** `create_effect`
      envolve um `MaskedPrior` sobre um prior base $\operatorname{Beta}(1,1)$, para que apenas as rotas
      permitidas recebam um parâmetro livre.'
  list-item-7a05e9b08477:
    kind: list-item
    context: list
    en: |-
      **Sparsity belongs in the graph.** `MaskedPrior` creates three
      coefficients for three plausible routes; it does not waste computation
      estimating seventeen coefficients that I rule out by design.
    es: '**A esparsidade pertence ao grafo.** `MaskedPrior` cria três coeficientes para três rotas plausíveis;
      não desperdiça computação a estimar dezassete coeficientos que eu excluo por design.'
  list-item-a9f96f8995e7:
    kind: list-item
    context: list
    en: |-
      **The PyMC-Marketing extension:** a custom `MuEffect` that routes a
      share of one city's media contribution into another city's mean.
    es: '**A extensão do PyMC-Marketing:** um `MuEffect` personalizado que encaminha uma quota da contribuição
      de media de uma cidade para a média de outra cidade.'
  list-item-e7c1563ebf8a:
    kind: list-item
    context: list
    en: |-
      **The data laboratory:** two synthetic cities with three known spill
      routes, each carrying exactly 10% of the source channel's true
      contribution.
    es: '**O laboratório de dados:** duas cidades sintéticas com três rotas de transbordamento conhecidas,
      cada uma transportando exatamente 10% da verdadeira contribuição do canal de origem.'
  list-item-c1675c3be746:
    kind: list-item
    context: list
    en: |-
      **The result:** sampler diagnostics, direct-effect recovery, and
      posterior spill recovery against known ground truth.
    es: '**O resultado:** diagnósticos do amostrador, recuperação do efeito direto e recuperação do transbordamento
      posterior face à verdade de referência conhecida.'
  list-item-2ed4636dbfd5:
    kind: list-item
    context: list
    en: |-
      **The source response curve should be reused.** Spill inherits the
      source channel's modeled adstock and saturation instead of estimating a
      duplicate curve.
    es: '**A curva de resposta da origem deve ser reutilizada.** O transbordamento herda o adstock e a
      saturação modelados do canal de origem em vez de estimar uma curva duplicada.'
  list-item-f3012f7c7560:
    kind: list-item
    context: list
    en: |-
      **The sparse policy:** `MaskedPrior` samples only three plausible spill
      coefficients rather than all twenty source-city-by-channel candidates.
    es: '**A política de esparsidade:** `MaskedPrior` amostra apenas três coeficientes de transbordamento
      plausíveis em vez dos vinte candidatos de cidade de origem por canal.'
