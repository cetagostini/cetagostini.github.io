meta:
  title:
    en: 'Media Does Not Stop at the City Border: Cross-City Spillovers with PyMC-Marketing'
    es: 'Os media não param na fronteira da cidade: transbordamentos entre cidades com PyMC-Marketing'
  pagetitle:
    en: ''
    es: ''
  description:
    en: A geo-level Bayesian MMM with sparse cross-city spillovers built on PyMC-Marketing MuEffect, MaskedPrior,
      and a pre-specified route mask for multi-market media measurement.
    es: Um MMM bayesiano ao nível geográfico com transbordamentos entre cidades, construído com PyMC-Marketing
      MuEffect, MaskedPrior e uma máscara de rotas pré-especificada para medição de media em múltiplos
      mercados.
  image-alt:
    en: A stylized route diagram showing cross-city media spill from Caracas to Valencia and back, with
      green arrows on a cream background.
    es: Um diagrama estilizado de rotas mostrando transbordamento de media entre cidades de Caracas para
      Valencia e vice-versa, com setas verdes sobre um fundo creme.
  categories:
    en:
    - mmm
    - pymc-marketing
    - spillovers
    - bayesian
    - python
    es:
    - mmm
    - pymc-marketing
    - transbordamentos
    - bayesiano
    - python
