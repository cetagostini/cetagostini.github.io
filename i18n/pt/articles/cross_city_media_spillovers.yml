    context: body
    en: Input panel schema
    es: Esquema do painel de entrada
  plain-70f5b0c108fa:
    kind: plain
    context: body
    en: |-
      MaskedPrior turns twenty possible source-city-by-channel coefficients
      into three sampled parameters. The remaining seventeen are structural
      zeros, not uncertain near-zero estimates.
    es: MaskedPrior transforma vinte possíveis coeficientes de cidade de origem por canal em três parâmetros
      amostrados. Os restantes dezassete são zeros estruturais, não estimativas incertas próximas de zero.
  plain-5b4f1fa4ebb0:
    kind: plain
    context: body
    en: |-
      Observed spend flows into each city's unobserved response oval. Three
      green edges cross the boundary: Caracas Facebook and Google Search
      contribute 10% each to Valencia response; Valencia Linear TV contributes
      10% to Caracas response.
    es: 'O investimento observado flui para o oval de resposta não observado de cada cidade. Três arestas
      verdes atravessam a fronteira: Facebook e Google Search de Caracas contribuem 10% cada para a resposta
      de Valencia; Linear TV de Valencia contribui 10% para a resposta de Caracas.'
  plain-f9aeedba18c3:
    kind: plain
    context: body
    en: Posterior spill shares by allowed route
    es: Quotas de transbordamento posteriors por rota permitida
  plain-e679c14ca60e:
    kind: plain
    context: body
    en: Representative MMM input rows (two per city; three channels shown)
    es: Linhas representativas de entrada do MMM (duas por cidade; três canais mostrados)
  plain-3ead5b987c77:
    kind: plain
    context: body
    en: Sampler quality gates
    es: Portões de qualidade do amostrador
  plain-b59664c1be08:
    kind: plain
    context: body
    en: Spill-graph structural invariants (by construction)
    es: Invariantes estruturais do grafo de transbordamento (por construção)
  plain-48bf46c57b7a:
    kind: plain
    context: body
    en: |-
      The Caracas--Valencia corridor, roughly 124.9 km end to end. Broadcast,
      search, and ecommerce are the kinds of mechanism that could carry media
      effects across a corridor like this one.
    es: O corredor Caracas--Valencia, com aproximadamente 124.9 km de ponta a ponta. Radiodifusão, pesquisa
      e comércio eletrónico são os tipos de mecanismo que poderiam transportar efeitos de media ao longo
      de um corredor como este.
  plain-b81dba5f159f:
    kind: plain
    context: body
    en: |-
      The target changes by the shape of media from the other city, not by
      random noise. An independent-city MMM has no named component for the
      shaded difference.
    es: O alvo muda com a forma dos media da outra cidade, não com ruído aleatório. Um MMM de cidades
      independentes não tem nenhum componente nomeado para a diferença sombreada.
  plain-6c899e0350ac:
    kind: plain
    context: body
    en: The whole API idea
    es: A ideia completa da API
  plain-3395a1409bf7:
    kind: plain
    context: body
    en: |-
      Valencia pools two source routes, so its city-level lift is more
      informative than either route split. Caracas receives one route; its
      city and route uncertainty coincide.
    es: Valencia agrega duas rotas de origem, pelo que o seu lift ao nível da cidade é mais informativo
      do que qualquer divisão por rota. Caracas recebe uma rota; a sua incerteza ao nível da cidade e
      da rota coincide.
  plain-c68c7e8fa0f4:
    kind: plain
    context: body
    en: What the model samples
    es: O que o modelo amostra
  plain-a1dd90bef9cf:
    kind: plain
    context: body
    en: '`MaskedPrior` is a gate, not a shrinkage prior'
    es: '`MaskedPrior` é uma porta, não um prior de encolhimento'
