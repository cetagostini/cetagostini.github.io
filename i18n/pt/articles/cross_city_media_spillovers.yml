  figure-caption-82318f8cd012:
    kind: figure-caption
    context: figure
    en: |-
      All three 94% intervals contain the known 10% share, but the route-level
      posteriors remain wide. The graph can represent the mechanism without
      pretending that every route is sharply identified.
    es: Os três intervalos de 94% contêm a quota conhecida de 10%, mas os posteriors ao nível da rota
      permanecem amplos. O grafo consegue representar o mecanismo sem fingir que cada rota está fortemente
      identificada.
  figure-caption-8a4c70c65575:
    kind: figure-caption
    context: figure
    en: Cumulative cross-city contribution by receiving city
    es: Contribuição cumulativa entre cidades por cidade recetora
  figure-caption-c7b40be29a75:
    kind: figure-caption
    context: figure
    en: Cumulative direct-contribution recovery
    es: Recuperação cumulativa da contribuição direta
  figure-caption-1dbda109162c:
    kind: figure-caption
    context: figure
    en: |-
      Direct-contribution recovery is good for some channels and materially
      low for Facebook, Programmatic Display, and Email. Because spill reuses
      these paths, direct attribution uncertainty propagates into spill
      attribution.
    es: A recuperação da contribuição direta é boa para alguns canais e significativamente baixa para
      Facebook, Programmatic Display e Email. Como o transbordamento reutiliza estes caminhos, a incerteza
      da atribuição direta propaga-se para a atribuição do transbordamento.
  figure-caption-e04de702425e:
    kind: figure-caption
    context: figure
    en: |-
      Focused PyMC dependency graph for the custom spill branch. It is
      generated from the built model, but it is a computational graph---not a
      causal DAG or evidence of causal identification.
    es: Grafo de dependência PyMC focado no ramo personalizado de transbordamento. É gerido a partir do
      modelo construído, mas é um grafo computacional---não um DAG causal nem evidência de identificação
      causal.
  figure-caption-19d8e8cb816d:
    kind: figure-caption
    context: figure
    en: Input panel schema
    es: Esquema do painel de entrada
  figure-caption-df92dfd9e890:
    kind: figure-caption
    context: figure
    en: |-
      MaskedPrior turns twenty possible source-city-by-channel coefficients
      into three sampled parameters. The remaining seventeen are structural
      zeros, not uncertain near-zero estimates.
    es: MaskedPrior transforma vinte possíveis coeficientes de cidade de origem por canal em três parâmetros
      amostrados. Os restantes dezassete são zeros estruturais, não estimativas incertas próximas de zero.
  figure-caption-17c2e6bc44b5:
    kind: figure-caption
    context: figure
    en: |-
      Observed spend flows into each city's unobserved response oval. Three
      green edges cross the boundary: Caracas Facebook and Google Search
      contribute 10% each to Valencia response; Valencia Linear TV contributes
      10% to Caracas response.
    es: 'O investimento observado flui para o oval de resposta não observado de cada cidade. Três arestas
      verdes atravessam a fronteira: Facebook e Google Search de Caracas contribuem 10% cada para a resposta
      de Valencia; Linear TV de Valencia contribui 10% para a resposta de Caracas.'
  figure-caption-04fd2a6d4201:
    kind: figure-caption
    context: figure
    en: Posterior spill shares by allowed route
    es: Quotas de transbordamento posteriors por rota permitida
  figure-caption-55811d83dc63:
    kind: figure-caption
