    en: |-
      the sum returns one spill contribution for each receiving city $r$ and
      week $t$.
    es: a soma devolve uma contribuição de transbordamento para cada cidade recetora $r$ e semana $t$.
  para-b45d532eb6f5:
    kind: para
    context: body
    en: |-
      "I fit one marketing mix model per city, so every campaign belongs to
      the city where I booked the spend."
    es: '"Ajusto um marketing mix model por cidade, por isso cada campanha pertence à cidade onde registei
      o investimento."'
  para-427e0184601b:
    kind: para
    context: body
    en: |-
      $r$ is a city index, $t$ is a time index, and everything on the
      right-hand side is learned from that city's own spend, its own controls,
      and its own target. Many teams also carry a seasonality term. I leave it
      out here so the only structural difference between the two models in
      this article is the one the article is about. This is the base formula,
      and the most common in industry.
    es: $r$ é um índice de cidade, $t$ é um índice temporal, e tudo do lado direito é aprendido a partir
      do investimento dessa cidade, dos seus próprios controlos e do seu próprio alvo. Muitas equipas
      incluem também um termo de sazonalidade. Deixo-o de fora aqui para que a única diferença estrutural
      entre os dois modelos neste artigo seja aquela sobre a qual o artigo trata. Esta é a fórmula base,
      e a mais comum na indústria.
  para-44bf6c435692:
    kind: para
    context: body
    en: |-
      **Could I just add the other city's raw spend as controls?** I could,
      but then I would estimate a second response curve disconnected from the
      source campaign's adstock and saturation. Reusing the source
      contribution is both more parsimonious and easier to interpret.
    es: '**Posso simplesmente adicionar o investimento bruto da outra cidade como controlos?** Posso,
      mas então estimaria uma segunda curva de resposta desconectada do adstock e da saturação da campanha
      de origem. Reutilizar a contribuição da origem é tanto mais parcimonioso como mais fácil de interpretar.'
  para-a46dd54885e6:
    kind: para
    context: body
    en: |-
      **Which cross-market route in your own media plan is currently being
      forced to look like noise?**
    es: '**Qual rota entre mercados no vosso próprio plano de media está atualmente a ser forçada a parecer
      ruído?**'
  para-01ac2a8170ee:
    kind: para
    context: body
    en: |-
      A multidimensional `MMM(dims=("city",))` already produces
      `channel_contribution` with city and channel coordinates. A custom
      `MuEffect` can read that tensor, route a bounded share to another city,
      and return a `(date, city)` contribution to the model mean.
    es: Um `MMM(dims=("city",))` multidimensional já produz `channel_contribution` com coordenadas de
      cidade e canal. Um `MuEffect` personalizado consegue ler esse tensor, encaminhar uma quota limitada
      para outra cidade e devolver uma contribuição `(date, city)` para a média do modelo.
  para-66712fcc94ac:
    kind: para
    context: body
    en: |-
      A posterior is only useful after it passes basic sampler diagnostics.
      The thresholds in that gate---zero divergences, $\hat{R} < 1.01$, and
      effective sample sizes above 400---follow standard MCMC practice.
      Divergent transitions signal regions of high curvature where the sampler
      cannot explore reliably ([Betancourt, 2017,
      §6.2](https://arxiv.org/abs/1701.02434)). The $\hat{R}$ threshold and
      the ESS floor of 400 total draws (≈100 per chain with four chains) come
      from the rank-normalized convergence diagnostic of [Vehtari et
      al. (2021)](https://arxiv.org/abs/1903.08008).
    es: Um posterior só é útil depois de passar nos diagnósticos básicos do amostrador. Os limiares nesse
      portão---zero divergências, $\hat{R} < 1.01$, e tamanhos efetivos de amostra acima de 400---seguem
      a prática MCMC padrão. As transições divergentes sinalizam regiões de alta curvatura onde o amostrador
      não consegue explorar de forma fiável ([Betancourt, 2017, §6.2](https://arxiv.org/abs/1701.02434)).
      O limiar de $\hat{R}$ e o piso de ESS de 400 extrações totais (≈100 por cadeia com quatro cadeias)
      provêm do diagnóstico de convergência normalizado por ranking de [Vehtari et al. (2021)](https://arxiv.org/abs/1903.08008).
  para-c05efc5304a0:
    kind: para
    context: body
    en: |-
      A regular MMM predicts the target $Y_{r,t}$ in receiving city $r$ at
      week $t$ as a sum of different components:
    es: 'Um MMM regular prevê o alvo $Y_{r,t}$ na cidade recetora $r$ na semana $t$ como uma soma de diferentes
      componentes:'
  para-6d5fafd0e6a3:
    kind: para
    context: body
    en: |-
      Because channels and targets are max-scaled, the response priors below
      live on a comparable scale across cities. A positive intercept removes a
      spurious negative-baseline mode, while a log-normal half-saturation
      prior keeps the sampler away from a zero-boundary funnel. These are
      identifiability and sampling choices, not evidence about the spill
      routes.
    es: Como os canais e os alvos são escalados pelo máximo, os priors de resposta abaixo vivem numa escala
      comparável entre cidades. Um intercepto positivo remove um modo espúrio de linha de base negativa,
      enquanto um prior log-normal de meia-saturação mantém o amostrador afastado de um funil de fronteira
      zero. Estas são escolhas de identificabilidade e amostragem, não evidência sobre as rotas de transbordamento.
  para-4b2e19223614:
    kind: para
    context: body
    en: |-
      Because the spill term is a share of a contribution that has already
      been through that chain, it arrives in the receiving city carrying the
      source channel's own carryover and saturation.
    es: Como o termo de transbordamento é uma quota de uma contribuição que já passou por essa cadeia,
      ele chega à cidade recetora transportando o carryover e a saturação do próprio canal de origem.
  para-e068b0578318:
    kind: para
    context: body
    en: |-
      Before trusting the spill result, I check the base MMM. Each point below
      is one active own-city channel. Perfect cumulative recovery lies on the
      diagonal. Several paths are close; Facebook, Programmatic Display, and
      Email are understated. That miss matters: spill inherits the source
      channel's modeled contribution, so error in direct attribution travels
      with it.
    es: 'Antes de confiar no resultado do transbordamento, verifico o MMM base. Cada ponto abaixo é um
      canal próprio ativo da cidade. A recuperação cumulativa perfeita situa-se na diagonal. Vários caminhos
      estão próximos; Facebook, Programmatic Display e Email estão subestimados. Esse erro importa: o
      transbordamento herda a contribuição modelada do canal de origem, pelo que o erro na atribuição
      direta viaja com ele.'
  para-560f0ee195ab:
    kind: para
    context: body
    en: 'But it is not the only solution. Other approaches worth considering:'
    es: 'Mas não é a única solução. Outras abordagens a considerar:'
  para-6aba51a1fb55:
    kind: para
    context: body
    en: |-
      Each path transfers 10% of the source channel's true own-city
      contribution. Everything else is structurally absent.
    es: Cada caminho transfere 10% da verdadeira contribuição própria da cidade do canal de origem. Tudo
      o resto está estruturalmente ausente.
  para-f7e8f92a22df:
    kind: para
    context: body
    en: |-
      Even with the right route graph, endogenous campaign placement can mimic
      spill. If regional demand raises Caracas spend and Valencia sales at the
      same time, the posterior can load that shared movement onto $\rho$.
      Geographic experiments, reach data, and institutional knowledge remain
      part of the identification strategy.
    es: Mesmo com o grafo de rotas correto, a colocação endógena de campanhas pode imitar transbordamento.
      Se a procura regional aumentar o investimento em Caracas e as vendas em Valencia ao mesmo tempo,
      o posterior pode carregar esse movimento partilhado em $\rho$. Os experimentos geográficos, dados
      de alcance e conhecimento institucional permanecem parte da estratégia de identificação.
  para-c827758b6820:
    kind: para
    context: body
    en: |-
      Finally, I return to the business unit: weekly sales contribution in the
      receiving city.
    es: 'Finalmente, volto à unidade de negócio: contribuição semanal de vendas na cidade recetora.'
  para-ce513751bef9:
    kind: para
    context: body
    en: |-
      First the sampler diagnostics and the structural invariants, then what
      the data can actually say about the size of the three allowed routes.
    es: Primeiro os diagnósticos do amostrador e os invariantes estruturais, depois o que os dados podem
      realmente dizer sobre a magnitude das três rotas permitidas.
  para-3a44b6e3f2ef:
    kind: para
    context: body
    en: First, the notebook setup and the imports.
    es: Primeiro, a configuração do notebook e as importações.
  para-dff0cdefc297:
    kind: para
    context: body
    en: |-
      Here $S_{r,t}$ is the spill arriving in receiving city $r$: a bounded
      share of the direct contribution that another city's media already
      produced. Every route share is capped at $\rho_{\max}$, so one route can
      never move more than $\rho_{\max}$ of its source contribution across the
      border. In this article $\rho_{\max}=0.20$ and the synthetic truth is
      $0.10$.
    es: 'Aqui $S_{r,t}$ é o transbordamento que chega à cidade recetora $r$: uma quota limitada da contribuição
      direta que os media de outra cidade já produziram. Cada quota de rota está limitada a $\rho_{\max}$,
      para que uma rota nunca possa mover mais do que $\rho_{\max}$ da sua contribuição de origem para
      além da fronteira. Neste artigo $\rho_{\max}=0.20$ e a verdade sintética é $0.10$.'
  para-c4a1c69e4d33:
    kind: para
    context: body
    en: |-
      I call this class `SpillEffect`. It inherits PyMC-Marketing's
      [`MuEffect`](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.additive_effect.html)
      protocol.
    es: Chamo a esta classe `SpillEffect`. Ela herda o protocolo [`MuEffect`](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.additive_effect.html)
      do PyMC-Marketing.
  para-006ba2bed2e5:
    kind: para
    context: body
    en: I model
    es: Eu modelo
  para-ca3ceb3df5f6:
    kind: para
    context: body
    en: |-
      I name them **Caracas** and **Valencia**. The names are a convenience:
      the two real cities sit close enough to make a cross-city corridor easy
      to picture, not because these synthetic routes describe anything that
      happens between them. Each has ten media channels, two observed
      controls, and 104 weekly observations. Three direct media paths reach
      the *other* city:
    es: 'Chamo-lhes **Caracas** e **Valencia**. Os nomes são uma conveniência: as duas cidades reais estão
      suficientemente próximas para tornar um corredor entre cidades fácil de imaginar, não porque estas
      rotas sintéticas descrevam algo que acontece entre elas. Cada uma tem dez canais de media, dois
      controlos observados e 104 observações semanais. Três caminhos diretos de media chegam à *outra*
      cidade:'
  para-5be5da2980d6:
    kind: para
    context: body
    en: |-
      It matters that the multiplier stays there. Adstock is linear, so a
      scalar does pass through it:
      $\text{adstock}(\rho x) = \rho \cdot \text{adstock}(x)$. Saturation is
      not, so $\rho \cdot f(\bar{x}) \neq f(\rho \bar{x})$ --- pushing the
      share inside the curve would move the half-saturation point and bend the
      response into a different shape. Applying the share after saturation is
      what keeps the receiving city on the source city's response curve
      instead of a distorted copy of it.
    es: 'Importa que o multiplicador permaneça aí. O adstock é linear, pelo que um escalar passa através
      dele: $\text{adstock}(\rho x) = \rho \cdot \text{adstock}(x)$. A saturação não é, pelo que $\rho
      \cdot f(\bar{x}) \neq f(\rho \bar{x})$ --- empurrar a quota para dentro da curva moveria o ponto
      de meia-saturação e curvaria a resposta numa forma diferente. Aplicar a quota após a saturação é
      o que mantém a cidade recetora na curva de resposta da cidade de origem em vez de uma cópia distorcida.'
  para-067011094f8a:
    kind: para
    context: body
    en: |-
      Let $V$ and $C$ abbreviate Valencia and Caracas, and let $\tau_{s,k,t}$
      denote channel $k$'s true own-city contribution in source city $s$ at
      week $t$. Then:
    es: 'Sejam $V$ e $C$ abreviaturas de Valencia e Caracas, e seja $\tau_{s,k,t}$ a verdadeira contribuição
      própria da cidade do canal $k$ na cidade de origem $s$ na semana $t$. Então:'
  para-d812d4dc0ce4:
    kind: para
    context: body
    en: |-
      Like any other MMM, the model transforms spend before it reaches the
      mean: [geometric
      adstock](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.adstock.GeometricAdstock.html)
      followed by [Michaelis-Menten
      saturation](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.saturation.MichaelisMentenSaturation.html).
      That is the same carryover-and-shape idea described by [Jin et
      al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3806.pdf),
      though not the same functional form: their paper uses a Hill response
      curve, and Michaelis-Menten is the member of that family with the
      exponent fixed at one.
    es: 'Como qualquer outro MMM, o modelo transforma o investimento antes de chegar à média: [adstock
      geométrico](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.adstock.GeometricAdstock.html)
      seguido de [saturação Michaelis-Menten](https://www.pymc-marketing.io/en/latest/api/generated/pymc_marketing.mmm.components.saturation.MichaelisMentenSaturation.html).
      A mesma ideia de carryover e forma descrita por [Jin et al. (2017)](https://storage.googleapis.com/gweb-research2023-media/pubtools/3806.pdf),
      embora não a mesma forma funcional: o artigoles usa uma curva de resposta Hill, e Michaelis-Menten
      é o membro dessa família com o expoente fixado em um.'
  para-46b6232650da:
    kind: para
    context: body
    en: |-
      Most of the class is named tensor bookkeeping. The actual model change
      is the short chain inside `create_effect`:
    es: 'A maior parte da classe é contabilidade nomeada de tensores. A mudança real no modelo é a cadeia
      curta dentro de `create_effect`:'
  para-36ad2653c426:
    kind: para
    context: body
    en: |-
      Now the synthetic data. I start from two weekly time series --- think
      cities, regions, or countries --- generated independently of each other,
      and then add spill from one to the other, in both directions.
    es: Agora os dados sintéticos. Começo de duas séries temporais semanais --- pense em cidades, regiões
      ou países --- geradas independentemente uma da outra, e depois adiciono transbordamento de uma para
      a outra, em ambas as direções.
  para-c7305005a7cc:
    kind: para
    context: body
    en: |-
      Reusing the source contribution and masking a handful of plausible
      routes is the easiest way to add cross-market spill when the source
      city's adstock and saturation shapes are already well estimated. The
      effect reads one tensor, multiplies by a small coefficient, and returns
      a contribution of the right dimension. That parsimony is the point.
    es: Reutilizar a contribuição da origem e mascarar um punhado de rotas plausíveis é a forma mais fácil
      de adicionar transbordamento entre mercados quando as formas de adstock e saturação da cidade de
      origem já estão bem estimadas. O efeito lê um tensor, multiplica por um pequeno coeficiente e devolve
      uma contribuição da dimensão correta. Essa parcimónia é o ponto.
  para-8f36d04ee571:
    kind: para
    context: body
    en: |-
      Separately, I verify structural invariants encoded by the tensor
      algebra: diagonal routes are exactly zero, inactive paths remain zero,
      and every spill share stays below the 20% cap. These are implementation
      sanity checks, not posterior-quality diagnostics.
    es: 'Separadamente, verifico invariantes estruturais codificados pela álgebra de tensores: as rotas
      diagonais são exatamente zero, os caminhos inativos permanecem zero e cada quota de transbordamento
      se mantém abaixo do limite de 20%. Estas são verificações de sanidade de implementação, não diagnósticos
      de qualidade do posterior.'
  para-26817ded4e0b:
    kind: para
    context: body
    en: |-
      Spill parameters are coupled to the source response curve. If direct
      adstock or saturation is weakly identified, spill will be weakly
      identified too. Check divergences, r-hat, bulk and tail ESS, and
      direct-effect recovery before interpreting the cross-city posterior.
    es: Os parâmetros de transbordamento estão acoplados à curva de resposta da origem. Se o adstock ou
      a saturação direta forem fracamente identificados, o transbordamento também será fracamente identificado.
      Verifique divergências, r-hat, ESS de cauda e corpo, e recuperação do efeito direto antes de interpretar
      o posterior entre cidades.
  para-62f6ef1b0b5c:
    kind: para
    context: body
    en: |-
      That model may predict well. It still has no route where a source city
      $s$ differs from the receiving city $r$. The shaded signal in
      @fig-target-spill must leak into direct attribution, the baseline,
      controls, or residual noise.
    es: Esse modelo pode prever bem. Ainda assim, não tem nenhuma rota onde uma cidade de origem $s$ difira
      da cidade recetora $r$. O sinal sombreado em @fig-target-spill deve vazar para a atribuição direta,
      a linha de base, os controlos ou o ruído residual.
  para-6c2d8e0de0e3:
    kind: para
    context: body
    en: |-
      The Bayesian measurement lens now becomes an engineering constraint:
      preserve the source response, fix the routes supplied by prior
      knowledge, and estimate only their uncertain magnitudes.
    es: 'A lente de medição bayesiana torna-se agora uma restrição de engenharia: preservar a curva de
      resposta da origem, fixar as rotas fornecidas pelo conhecimento prévio, e estimar apenas as suas
      magnitudes incertas.'
  para-2aec3d21ca9f:
    kind: para
    context: body
    en: |-
      The algebra is the whole argument: $\rho_{s,k}$ scales the ceiling
      $\alpha_{s,k}$ and leaves the half-saturation $\lambda_{s,k}$ untouched.
      A multiplier applied after saturation is therefore identical to fitting
      a separate saturation curve for each route, with capacity
      $\rho_{s,k} \cdot \alpha_{s,k}$ and the same $\lambda_{s,k}$ --- the
      same contribution, at one parameter instead of two.
    es: 'A álgebra é todo o argumento: $\rho_{s,k}$ escala o teto $\alpha_{s,k}$ e deixa a meia-saturação
      $\lambda_{s,k}$ intocada. Um multiplicador aplicado após a saturação é portanto idêntico a ajustar
      uma curva de saturação separada para cada rota, com capacidade $\rho_{s,k} \cdot \alpha_{s,k}$ e
      o mesmo $\lambda_{s,k}$ --- a mesma contribuição, a um parâmetro em vez de dois.'
  para-a4c7833faebc:
    kind: para
    context: body
    en: |-
      The contribution files (`caracas_contributions.csv`,
      `valencia_contributions.csv`) record the true channel-level
      decomposition used for scoring. Their magnitudes remain held out; the
      only information derived from that decomposition and supplied to the MMM
      is the six-path direct-activity mask I build later, when the model is
      assembled. The likelihood otherwise sees the target, observed media
      spend, and controls.
    es: Os ficheiros de contribuição (`caracas_contributions.csv`, `valencia_contributions.csv`) registam
      a verdadeira decomposição ao nível do canal usada para avaliação. As suas magnitudes permanecem
      reservadas; a única informação derivada dessa decomposição e fornecida ao MMM é a máscara de atividade
      direta de seis caminhos que construo mais tarde, quando o modelo é montado. A verosimilhança, de
      resto, vê o alvo, o investimento em media observado e os controlos.
  para-8fecffa0d2a7:
    kind: para
    context: body
    en: |-
      The direct contribution of source channel $k$ in city $s$, after adstock
      and Michaelis-Menten saturation, is
    es: A contribuição direta do canal de origem $k$ na cidade $s$, após adstock e saturação Michaelis-Menten,
      é
  para-fde9a1823d35:
    kind: para
    context: body
    en: |-
      The extension's main test is therefore not "did every path land exactly
      on 10%?" It is: **what can the data distinguish once the correct
      mechanism exists?**
    es: 'O principal teste da extensão não é portanto "cada caminho ficou exatamente nos 10%?" É: **o
      que os dados conseguem distinguir uma vez que o mecanismo correto existe?**'
  para-9ba2b5793725:
    kind: para
    context: body
    en: |-
      The familiar model fits each city with its own channels, controls, and
      baseline:
    es: 'O modelo familiar ajusta cada cidade com os seus próprios canais, controlos e linha de base:'
  para-33b583047629:
    kind: para
    context: body
    en: |-
      The framework's final discipline is to separate what was encoded from
      what was learned: the route mask supplied the possible cross-city paths,
      while the posterior quantified their uncertain shares.
    es: 'A disciplina final do framework é separar o que foi codificado do que foi aprendido: a máscara
      de rotas forneceu os caminhos possíveis entre cidades, enquanto o posterior quantificou as suas
      quotas incertas.'
  para-8ba9a86b1647:
    kind: para
    context: body
    en: |-
      The graph above is computational, not causal. It is a focused subgraph
      of the built PyMC model: raw channel spend enters through adstock and
      saturation, produces `channel_contribution`, and the `SpillEffect`
      multiplies that tensor by the bounded spill share and route mask. The
      diagram stops at `spill_contribution` for readability; the base MMM then
      adds that output to its direct, baseline, and control terms in the
      target likelihood.
    es: 'O grafo acima é computacional, não causal. É um subgrafo focado do modelo PyMC construído: o
      investimento bruto do canal entra através de adstock e saturação, produz `channel_contribution`,
      e o `SpillEffect` multiplica esse tensor pela quota de transbordamento limitada e pela máscara de
      rotas. O diagrama para em `spill_contribution` para legibilidade; o MMM base depois adiciona essa
      saída aos seus termos diretos, de linha de base e de controlo na verosimilhança alvo.'
  para-72b73ee411db:
    kind: para
    context: body
    en: |-
      The hierarchy in these results is the lesson. Valencia's individual
      route shares are broad while their city-level total is close to truth.
      Caracas has only one incoming route, so its city and route uncertainty
      coincide. Every interval carries direct-response uncertainty forward:
      adding the right mechanism does not manufacture information; it makes
      the remaining uncertainty legible.
    es: 'A hierarquia nestes resultados é a lição. As quotas de rota individuais de Valencia são amplas
      enquanto o seu total ao nível da cidade está próximo da verdade. Caracas tem apenas uma rota de
      entrada, pelo que a sua incerteza ao nível da cidade e da rota coincide. Cada intervalo transporta
      a incerteza da resposta direta para a frente: adicionar o mecanismo correto não fabrica informação;
      torna a incerteza restante legível.'
  para-ce0d4a298d8a:
    kind: para
    context: body
    en: 'The likelihood family stays the same. One term is added to the mean:'
    es: 'A família de verosimilhança permanece a mesma. Um termo é adicionado à média:'
  para-0e6f5d932f07:
    kind: para
    context: body
    en: |-
      The model graph should contain exactly three free spill parameters. That
      is the computational payoff of the mask.
    es: O grafo do modelo deve conter exatamente três parâmetros de transbordamento livres. Esse é o retorno
      computacional da máscara.
  para-e082716454ee:
    kind: para
    context: body
    en: |-
      The multiplier is fixed at 10% in the data-generating process. The model
      will not receive those contribution columns; they remain behind the
      curtain for scoring.
    es: O multiplicador está fixado em 10% no processo de geração de dados. O modelo não receberá essas
      colunas de contribuição; permanecem por trás da cortina para avaliação.
  para-1112f761d280:
    kind: para
    context: body
    en: |-
      The panel that enters the MMM contains 208 weekly rows (104 weeks × 2
      cities). Each row carries the ten raw media-spend channels, two observed
      controls, and the sales target. The generator writes two panel files ---
      `mmm_data_raw.csv` for the observables and `mmm_data_contributions.csv`
      for the true per-channel decomposition used only in scoring ---
      alongside the per-city inputs and contribution breakdowns under `data/`.
    es: O painel que entra no MMM contém 208 linhas semanais (104 semanas × 2 cidades). Cada linha transporta
      os dez canais de investimento em media brutos, dois controlos observados e o alvo de vendas. O gerador
      escreve dois ficheiros de painel --- `mmm_data_raw.csv` para os observáveis e `mmm_data_contributions.csv`
      para a verdadeira decomposição por canal usada apenas na avaliação --- juntamente com as entradas
      por cidade e as repartições de contribuição em `data/`.
  para-837d0f908ecb:
    kind: para
    context: body
    en: |-
      The practical "so what?" is budget allocation. If a campaign creates
      value outside the market where spend is booked, city-by-city
      optimization can understate its return and shift money away from
      campaigns with regional reach. A small modeling extension can change
      which city receives credit --- and therefore which campaign survives the
      next planning round.
    es: O "e daí?" prático é a alocação de orçamento. Se uma campanha cria valor fora do mercado onde
      o investimento é registado, a otimização cidade a cidade pode subestimar o seu retorno e desviar
      dinheiro de campanhas com alcance regional. Uma pequena extensão de modelação pode mudar qual cidade
      recebe crédito --- e portanto qual campanha sobrevive ao próximo ciclo de planeamento.
  para-9c9ffc831c3a:
    kind: para
    context: body
    en: |-
      The remainder of this article will delve into the details of that line.
      We'll start with the business context, followed by the equation, the
      tensor shapes, and finally, we'll present the complete class.
    es: O restante deste artigo aprofundará os detalhes dessa linha. Começaremos pelo contexto de negócios,
      seguido da equação, das formas dos tensores e, finalmente, apresentaremos a classe completa.
  para-708a5eebfbdd:
    kind: para
    context: body
    en: |-
      The representative rows below show a subset of the columns the MMM
      actually sees.
    es: As linhas representativas abaixo mostram um subconjunto das colunas que o MMM realmente vê.
  para-daf9d7e446e5:
    kind: para
    context: body
    en: |-
      The silver lining is that
      [PyMC-Marketing](https://www.pymc-marketing.io/) offers us an extension
      point to address this issue. We can maintain the foundational
      multidimensional `MMM`, implement an additive `MuEffect`, outline the
      possible routes using a Boolean mask, and seamlessly register it with a
      single line:
    es: 'A boa notícia é que o [PyMC-Marketing](https://www.pymc-marketing.io/) oferece-nos um ponto de
      extensão para resolver esta questão. Podemos manter o `MMM` multidimensional de base, implementar
      um `MuEffect` aditivo, delinear as rotas possíveis usando uma máscara booleana e registá-lo de forma
      transparente com uma única linha:'
  para-2c0ad814dd83:
    kind: para
    context: body
    en: |-
      The source-unit $\to$ receiver-unit structure appears whenever one
      marketing touch creates value outside its original target:
    es: 'A estrutura unidade de origem $\to$ unidade recetora aparece sempre que um toque de marketing
      cria valor fora do seu alvo original:'
  para-77330de97669:
    kind: para
    context: body
    en: |-
      The spill model multiplies that already-saturated contribution by the
      route share $\rho_{s,k}$, giving the amount a single route delivers to
      the receiving city:
    es: 'O modelo de transbordamento multiplica essa contribuição já saturada pela quota de rota $\rho_{s,k}$,
      dando a quantidade que uma única rota entrega à cidade recetora:'
  para-180c90ad93d5:
    kind: para
    context: body
    en: |-
      The takeaway is pragmatic: start with the simplest version that respects
      the business structure, check whether the posterior is identifiable, and
      add complexity only when the data and the question demand it.
    es: 'A conclusão é pragmática: começar com a versão mais simples que respeite a estrutura de negócios,
      verificar se o posterior é identificável e adicionar complexidade apenas quando os dados e a questão
      o exigirem.'
  para-2b4bcc99863d:
    kind: para
    context: body
    en: |-
      The three allowed paths came from the experiment design. In a real
      organization, they might come from broadcast footprints, campaign
      eligibility, distribution territories, ecommerce shipping patterns, or a
      pre-registered spill hypothesis. `MaskedPrior` makes that assumption
      computationally honest, but it does not validate it.
    es: Os três caminhos permitidos vieram do design do experimento. Numa organização real, poderiam vir
      de coberturas de radiodifusão, elegibilidade de campanha, territórios de distribuição, padrões de
      envio de comércio eletrónico, ou uma hipótese de transbordamento pré-registada. `MaskedPrior` torna
      essa suposição computacionalmente honesta, mas não a valida.
  para-824b3ca9d8f2:
    kind: para
    context: body
    en: |-
      The wrapped prior is sampled only where the mask is `True`, then
      expanded back to the full labeled tensor with exact zeros elsewhere.
    es: O prior envolvido é amostrado apenas onde a máscara é `True`, depois expandido de volta para o
      tensor etiquetado completo com zeros exatos nos restantes locais.
  para-0ec116f4faaa:
    kind: para
    context: body
    en: |-
      These are reasons to *consider* shared mechanisms in your own data, not
      evidence that the Caracas-Valencia routes in this demonstration exist in
      any real market.
    es: Estas são razões para *considerar* mecanismos partilhados nos vossos próprios dados, não evidência
      de que as rotas Caracas-Valencia nesta demonstração existem em qualquer mercado real.
  para-64738f2b044c:
    kind: para
    context: body
    en: 'This article walks you through:'
    es: 'Este artigo percorre-vos:'
  para-1c5cfbabb449:
    kind: para
    context: body
    en: |-
      This is the Bayesian measurement payoff: the model can preserve a
      credible route graph while admitting that the data identify an aggregate
      receiving-city effect more sharply than its route-by-route allocation.
    es: 'Este é o retorno da medição bayesiana: o modelo consegue preservar um grafo de rotas credível
      enquanto admite que os dados identificam um efeito agregado da cidade recetora de forma mais nítida
      do que a sua alocação rota a rota.'
  para-5c1d6c1a1c43:
    kind: para
    context: body
    en: |-
      This is the controlled failure. **The problem is not that the base MMM
      is badly implemented. The problem is that its mean function cannot
      express the business mechanism.**
    es: Este é o fracasso controlado. **O problema não é que o MMM base esteja mal implementado. O problema
      é que a sua função da média não consegue expressar o mecanismo de negócios.**
  para-8e21695f5bb8:
    kind: para
    context: body
    en: |-
      This reporting convention can be quite beneficial, but it doesn't always
      reflect the complexities of the real world. Media doesn't know about
      boundaries; for instance, a launch in Caracas might boost branded
      searches in Valencia. Additionally, a creator campaign targeting
      Valencia could generate orders in entirely different locations. If we
      insist on treating each city as an isolated unit, those extra orders
      don't just vanish; rather, the model simply mislabels them.
    es: Esta convenção de reporte pode ser bastante benéfica, mas nem sempre reflete as complexidades
      do mundo real. Os media não conhecem fronteiras; por exemplo, um lançamento em Caracas pode aumentar
      pesquisas de marca em Valencia. Além disso, uma campanha de criadores direcionada a Valencia pode
      gerar pedidos em locais completamente diferentes. Se insistirmos em tratar cada cidade como uma
      unidade isolada, esses pedidos extra não desaparecem; simplesmente, o modelo atribui-lhes um rótulo
      errado.
  para-87dfd1837c0d:
    kind: para
    context: body
    en: |-
      To keep the demonstration about spill rather than variable selection,
      the synthetic generator supplies a pre-specified direct activity mask:
      six city-channel response curves are known to exist before the MMM is
      fitted. It is not inferred from the observed target. In real work,
      define that mask from channel availability, prior business knowledge, or
      a proper variable-selection strategy.
    es: 'Para manter a demonstração centrada no transbordamento em vez da seleção de variáveis, o gerador
      sintético fornece uma máscara de atividade direta pré-especificada: seis curvas de resposta cidade-canal
      são conhecidas por existirem antes do MMM ser ajustado. Não é inferida a partir do alvo observado.
      Em trabalho real, defina essa máscara a partir da disponibilidade de canais, conhecimento empresarial
      prévio ou uma estratégia adequada de seleção de variáveis.'
  para-af5386361139:
    kind: para
    context: body
    en: |-
      Today I approach this as a **Bayesian measurement problem with
      structural knowledge**. I design a mask that encodes which cross-city
      routes the business considers possible, and the posterior estimates how
      large those allowed effects are. That distinction matters. I am not
      running causal discovery to find out whether a route exists; I assume
      the topology and estimate the magnitudes. In causal-inference terms this
      is an [interference
      problem](https://pmc.ncbi.nlm.nih.gov/articles/PMC2600548/): exposure
      assigned to one unit can change another unit's outcome.
    es: 'Hoje abordo isto como um **problema de medição bayesiana com conhecimento estrutural**. Desenho
      uma máscara que codifica quais rotas entre cidades a empresa considera possíveis, e o posterior
      estima quão grandes são esses efeitos permitidos. Essa distinção importa. Não estou a executar descoberta
      causal para descobrir se uma rota existe; assumo a topologia e estimo as magnitudes. Em termos de
      inferência causal, isto é um [problema de interferência](https://pmc.ncbi.nlm.nih.gov/articles/PMC2600548/):
      a exposição atribuída a uma unidade pode mudar o resultado de outra unidade.'
  para-81d9657198a7:
    kind: para
    context: body
    en: 'Where:'
    es: 'Onde:'
  para-6fade5354fd7:
    kind: para
    context: body
    en: |-
      With two cities and ten channels, there are twenty possible
      source-city-by-channel spill coefficients. In this synthetic design, I
      allow three. The other seventeen should not be weakly regularized or
      estimated near zero. They should not exist in the graph.
    es: Com duas cidades e dez canais, existem vinte possíveis coeficientes de transbordamento cidade
      de origem por canal. Neste design sintético, permito três. Os outros dezassete não devem ser fracamente
      regularizados nem estimados perto de zero. Não devem existir no grafo.
  para-fe569e6846c0:
    kind: para
    context: body
    en: |-
      With two cities, every exporting source has only one possible receiver.
      With three or more, a source channel may reach several markets. I would
      then need either receiver-specific shares $\rho_{r,s,k}$ or a total
      exported share plus an allocation simplex. The `MuEffect` protocol stays
      the same; only the routing tensor becomes richer.
    es: Com duas cidades, cada fonte exportadora tem apenas um possível recetor. Com três ou mais, um
      canal de origem pode atingir vários mercados. Seria necessário então ou quotas específicas do recetor
      $\rho_{r,s,k}$ ou uma quota total exportada mais um simplex de alocação. O protocolo `MuEffect`
      permanece o mesmo; apenas o tensor de encaminhamento se torna mais rico.
  para-2019558a9245:
    kind: para
    context: body
    en: 'Written out route by route, the new term is:'
    es: 'Escrito rota a rota, o novo termo é:'
  para-c208036728c9:
    kind: para
    context: body
    en: '`SpillEffect` has three responsibilities:'
    es: '`SpillEffect` tem três responsabilidades:'
  para-7f302e9d5853:
    kind: para
    context: body
    en: |-
      where $\bar{x}_{s,k,t}$ is the adstocked spend, $\alpha_{s,k}$ is the
      saturation capacity (the asymptotic ceiling), and $\lambda_{s,k}$ is the
      half-saturation constant (the spend level at which contribution reaches
      half the ceiling).
    es: onde $\bar{x}_{s,k,t}$ é o investimento após adstock, $\alpha_{s,k}$ é a capacidade de saturação
      (o teto assintótico), e $\lambda_{s,k}$ é a constante de meia-saturação (o nível de investimento
      no qual a contribuição atinge metade do teto).
  para-dca317f10e2c:
    kind: para
    context: body
    en: 'where:'
    es: 'onde:'
  para-483d92803a27:
    kind: para
    context: body
    en: |-
      with $\rho_{\max}=0.20$. The synthetic truth is 0.10, so it sits inside
      --- not on the boundary of --- the model's plausible interval.
    es: com $\rho_{\max}=0.20$. A verdade sintética é 0.10, pelo que se situa dentro --- não na fronteira
      --- do intervalo plausível do modelo.
  plain-e84a1ce8b74b:
    kind: plain
    context: body
    en: |-
      All three 94% intervals contain the known 10% share, but the route-level
      posteriors remain wide. The graph can represent the mechanism without
      pretending that every route is sharply identified.
    es: Os três intervalos de 94% contêm a quota conhecida de 10%, mas os posteriors ao nível da rota
      permanecem amplos. O grafo consegue representar o mecanismo sem fingir que cada rota está fortemente
      identificada.
  plain-da326eb74daa:
    kind: plain
    context: body
    en: Check identifiability before interpreting spill
    es: Verificar a identificabilidade antes de interpretar o transbordamento
  plain-91407175542a:
    kind: plain
    context: body
    en: Cumulative cross-city contribution by receiving city
    es: Contribuição cumulativa entre cidades por cidade recetora
  plain-0b4f54342b39:
    kind: plain
    context: body
    en: Cumulative direct-contribution recovery
    es: Recuperação cumulativa da contribuição direta
  plain-1342b1799067:
    kind: plain
    context: body
    en: |-
      Direct-contribution recovery is good for some channels and materially
      low for Facebook, Programmatic Display, and Email. Because spill reuses
      these paths, direct attribution uncertainty propagates into spill
      attribution.
    es: A recuperação da contribuição direta é boa para alguns canais e significativamente baixa para
      Facebook, Programmatic Display e Email. Como o transbordamento reutiliza estes caminhos, a incerteza
      da atribuição direta propaga-se para a atribuição do transbordamento.
  plain-4c14731cf832:
    kind: plain
    context: body
    en: |-
      Focused PyMC dependency graph for the custom spill branch. It is
      generated from the built model, but it is a computational graph---not a
      causal DAG or evidence of causal identification.
    es: Grafo de dependência PyMC focado no ramo personalizado de transbordamento. É gerido a partir do
      modelo construído, mas é um grafo computacional---não um DAG causal nem evidência de identificação
      causal.
  plain-88165873a0cc:
