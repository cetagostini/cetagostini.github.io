  title:
    en: Can You Trust Your Quasi-Experiment? A Bayesian Framework for Auditing Time-Series Causal Estimates
    es: Pode confiar no seu quase-experimento? Uma abordagem bayesiana para auditar estimativas causais
      em séries temporais
  pagetitle:
    en: ''
    es: ''
  description:
    en: A Bayesian framework using placebo tests and ROPE-based inference to audit whether your quasi-experimental
      causal estimates are trustworthy.
    es: Uma abordagem bayesiana baseada em testes placebo e inferência ROPE para auditar se as suas estimativas
      causais quase-experimentais são fiáveis.
  image-alt:
    en: Diagram showing a Bayesian placebo test framework for auditing quasi-experimental causal estimates
    es: Diagrama que mostra um framework bayesiano de teste placebo para auditar estimativas causais quase-experimentais
