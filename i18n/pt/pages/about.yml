                <li>Python</li>
                <li>Julia</li>
                <li>R</li>
              </ul>
            </div>
            <div class="rule-card">
              <h3>Technologies</h3>
              <ul class="rule-list">
                <li>Google Cloud Platform</li>
                <li>AWS</li>
                <li>Docker</li>
                <li>Git/GitHub</li>
                <li>Jupyter</li>
                <li>RStudio</li>
              </ul>
            </div>
          </div>
        </section>

        <section class="about-strip" aria-labelledby="connect-heading">
          <div>
            <h2 id="connect-heading">Let's connect</h2>
            <p>Have a project in mind, or just want to talk about data?</p>
