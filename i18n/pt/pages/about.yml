        <section class="about-hero" aria-labelledby="about-name">
          <div class="hero-section">
            <p class="hero-eyebrow"><span class="hero-status" aria-hidden="true"></span>About me · Venezuela → Chile → Estonia</p>
            <h1 class="hero-name" id="about-name">A causal journey to Bayesian applications<span class="hero-period">.</span></h1>
            <p class="hero-intro">I'm a globe-trotting data professional with a passion for statistics and mathematics. From studying in Venezuela to collaborating with teams across continents, my journey has been a whirlwind of diverse experiences. I'm all about using data to transform businesses and solve complex problems.</p>
            <div class="hero-cta">
              <a class="btn btn-primary" href="files/cv_carlos.pdf" target="_blank" rel="noopener">Download CV <span aria-hidden="true">↗</span></a>
              <a class="btn btn-quiet" href="mailto:carlos.trujillo@outlook.cl">Email me <span aria-hidden="true">↗</span></a>
            </div>
            <div class="hero-profile">
              <p class="profile-affiliation">Leading research at <a href="https://www.pymc-labs.com" target="_blank" rel="noopener">PyMC Labs</a><br><span>Bayesian inference · Causal modeling</span></p>
            </div>
          </div>
          <div class="about-portrait">
            <img src="images/profile.jpg" class="profile-photo" alt="Portrait of Carlos Trujillo" width="250" height="250">
          </div>
        </section>

        <section class="page-section" aria-labelledby="career-heading">
          <div class="section-heading">
            <div>
              <p class="section-eyebrow">2018 — now</p>
              <h2 id="career-heading">Where I've worked</h2>
            </div>
            <p class="section-note" id="career-instructions">Follow the timeline. Click a dot to explore the role. The two branches from 2024 ran in parallel.</p>
          </div>

          <div class="career" data-career data-edges="oym>raya raya>omnicom omnicom>bolt bolt>wise bolt>pymc">
            <div class="career-viewport">
            <div class="career-track" role="group" aria-label="Career timeline" aria-describedby="career-instructions">
              <svg class="career-wires" aria-hidden="true" focusable="false"></svg>
              <button type="button" class="rail-node" id="rail-oym" data-node="oym" data-pos="1">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">OYM Agencia</span>
                <span class="rail-period">2018 — 2019</span>
              </button>
              <button type="button" class="rail-node" id="rail-raya" data-node="raya" data-pos="2">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">Raya</span>
                <span class="rail-period">2019 — 2020</span>
              </button>
              <button type="button" class="rail-node" id="rail-omnicom" data-node="omnicom" data-pos="3">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">Omnicom</span>
                <span class="rail-period">2020 — 2022</span>
              </button>
              <button type="button" class="rail-node" id="rail-bolt" data-node="bolt" data-pos="4">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">Bolt</span>
                <span class="rail-period">2022 — 2024</span>
              </button>
              <button type="button" class="rail-node" id="rail-wise" data-node="wise" data-pos="down">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">Wise</span>
                <span class="rail-period">2024 — July 2026</span>
              </button>
              <button type="button" class="rail-node" id="rail-pymc" data-node="pymc" data-pos="up" data-now="1">
                <span class="rail-dot" aria-hidden="true"></span>
                <span class="rail-company">PyMC Labs <span class="rail-now">now</span></span>
                <span class="rail-period">2024 — present</span>
              </button>
            </div>
            </div>
            <p class="career-scroll-hint" aria-hidden="true">Scroll along the timeline <span aria-hidden="true">→</span></p>

            <div class="career-panels">
              <article class="career-panel" id="role-oym" aria-labelledby="role-company-oym role-title-oym" data-node="oym">
                <p class="panel-meta">2018 — 2019 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-oym" tabindex="-1">Performance Manager</h3>
                <p class="panel-company" id="role-company-oym">OYM Agencia</p>
                <p class="panel-summary">Managed digital marketing strategies for multiple brands, including analysis, optimization and investment across major platforms.</p>
                <ul class="panel-list">
                  <li>Managed analysis, optimization and investment in digital platforms including Facebook, Google Ads, and LinkedIn</li>
                  <li>Developed dashboards in Cyfe and DataStudio</li>
                  <li>Worked with brands including Jansport, BodyAndSoul, Ursus Trotter, and over 15 Chilean real estate companies</li>
                </ul>
              </article>

              <article class="career-panel" id="role-raya" aria-labelledby="role-company-raya role-title-raya" data-node="raya">
                <p class="panel-meta">2019 — 2020 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-raya" tabindex="-1">Data Analyst</h3>
                <p class="panel-company" id="role-company-raya">Raya</p>
                <p class="panel-summary">Managed analysis and reporting for different agency brands including Huawei, MercadoLibre, Concha y Toro, and Walmart Chile.</p>
                <ul class="panel-list">
                  <li>Responsible for interpretation, analysis, and reporting for different agency brands</li>
                  <li>Managed Brandwatch, Google Analytics, Tag Manager and similar tools to determine guidelines for paid or organic campaigns</li>
                  <li>Developed categorization and prediction models in Python for process optimization and advanced variable analysis</li>
                  <li>Worked with brands including Huawei, MercadoLibre, Concha y Toro, and Walmart Chile</li>
                </ul>
              </article>

              <article class="career-panel" id="role-omnicom" aria-labelledby="role-company-omnicom role-title-omnicom" data-node="omnicom">
                <p class="panel-meta">2020 — 2022 · Santiago, Chile</p>
                <h3 class="panel-title" id="role-title-omnicom" tabindex="-1">Head of Data Analytics</h3>
                <p class="panel-company" id="role-company-omnicom">Omnicom Media Group</p>
                <p class="panel-summary">Led the data department of the Marketing Science LATAM group, developing value solutions and creating analytical services around the region.</p>
                <h4 class="panel-subhead">Career progression</h4>
                <div class="panel-step">
                  <span class="panel-step-role">Head of Data Analytics</span>
                  <span class="panel-step-period">October 2021 — January 2022</span>
                </div>
                <ul class="panel-list">
                  <li>Led the data department of the Marketing Science LATAM group</li>
                  <li>Developed value solutions and created analytical services around the region</li>
                  <li>Utilized cloud technologies (AWS/GCP) to develop sustainable data structures</li>
                  <li>Maintained direct communication with Google and Facebook teams to develop use cases and service optimization</li>
                  <li>Created innovation proposals and fostered data culture to optimize operational processes</li>
                </ul>
                <div class="panel-step">
                  <span class="panel-step-role">Data Analytics Manager</span>
                  <span class="panel-step-period">July 2020 — October 2021</span>
                </div>
                <ul class="panel-list">
                  <li>Managed analyst team and ensured correct delivery of dashboards on platforms such as Tableau, Power BI, and Data Studio</li>
                  <li>Developed architectures in GCP and managed databases in AWS</li>
                  <li>Maintained direct contact with OMG teams in Miami for data centralization and optimization of information flows</li>
                  <li>Utilized visualization tools, Python/R, SQL, and NoSQL for data pre-processing</li>
                </ul>
              </article>

              <article class="career-panel" id="role-bolt" aria-labelledby="role-company-bolt role-title-bolt" data-node="bolt">
                <p class="panel-meta">2022 — 2024 · Tallinn, Estonia</p>
                <h3 class="panel-title" id="role-title-bolt" tabindex="-1">Marketing Ads, Functional Analyst</h3>
                <p class="panel-company" id="role-company-bolt">Bolt</p>
                <p class="panel-summary">Relocated from Chile to Estonia, applying data analytics to determine the most effective strategies for optimizing acquisition marketing efforts based on profitability.</p>
                <ul class="panel-list">
                  <li>Applied data analytics to determine best strategies to optimize acquisition marketing efforts based on profitability across Europe and South Africa</li>
                  <li>Performed daily analysis using Python or R to run marketing mix, causal impact and budget allocation models</li>
                  <li>Estimated marketing effects around the world to achieve company goals</li>
                </ul>
              </article>

              <article class="career-panel" id="role-wise" aria-labelledby="role-company-wise role-title-wise" data-node="wise">
                <p class="panel-meta">2024 — July 2026 · Tallinn, Estonia</p>
                <h3 class="panel-title" id="role-title-wise" tabindex="-1">Marketing Scientist</h3>
                <p class="panel-company" id="role-company-wise">Wise</p>
                <p class="panel-summary">Data scientist for the Marketing team, dedicated to measuring and improving the region's global strategies through the use of data.</p>
                <h4 class="panel-subhead">Career progression</h4>
                <div class="panel-step">
                  <span class="panel-step-role">Lead Data Scientist</span>
                  <span class="panel-step-period">March 2025 — July 2026</span>
                </div>
                <ul class="panel-list">
                  <li>Led the marketing science workstream, setting measurement strategy and priorities</li>
                  <li>Owned marketing mix modeling and incrementality testing in Python and PyMC</li>
                  <li>Partnered with marketing leadership to translate model outputs into budget decisions</li>
                </ul>
                <div class="panel-step">
                  <span class="panel-step-role">Senior Marketing Scientist</span>
                  <span class="panel-step-period">January 2024 — March 2025</span>
                </div>
                <ul class="panel-list">
                  <li>Built and maintained Bayesian marketing mix models to measure channel contribution</li>
                  <li>Designed and analyzed quasi-experiments to quantify campaign incrementality</li>
                  <li>Delivered actionable, data-driven insights to regional marketing teams</li>
                </ul>
              </article>

              <article class="career-panel" id="role-pymc" aria-labelledby="role-company-pymc role-title-pymc" data-node="pymc">
                <p class="panel-meta">2024 — present · Remote</p>
                <h3 class="panel-title" id="role-title-pymc" tabindex="-1">Principal Data Scientist</h3>
                <p class="panel-company" id="role-company-pymc">PyMC Labs</p>
                <p class="panel-summary">Leading research, solving complex business problems through advanced Bayesian statistical methods.</p>
                <ul class="panel-list">
                  <li>Leading research initiatives across Bayesian methods and causal inference</li>
                  <li>Solving business problems through Bayesian Statistics</li>
                  <li>Contributing to open-source PyMC and PyMC-Marketing</li>
                  <li>Advising clients on Bayesian modeling, MMM and budget optimization</li>
                </ul>
              </article>
            </div>

            <dialog class="career-dialog" id="career-dialog">
              <div class="career-dialog-toolbar">
                <span class="career-dialog-count" aria-hidden="true"></span>
                <button type="button" data-career-close>Close <span aria-hidden="true">×</span></button>
