                <p class="panel-summary">Gestão de estratégias de marketing digital para múltiplas marcas, incluindo análise, otimização e investimento nas principais plataformas.</p>
                <ul class="panel-list">
                  <li>Gestão de análise, otimização e investimento em plataformas digitais incluindo Facebook, Google Ads e LinkedIn</li>
