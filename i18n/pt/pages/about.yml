                  <li>Desenvolvimento de modelos de categorização e previsão em Python para otimização de processos e análise avançada de variáveis</li>
                  <li>Trabalho com marcas incluindo Huawei, MercadoLibre, Concha y Toro e Walmart Chile</li>
