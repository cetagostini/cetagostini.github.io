                <p class="panel-company" id="role-company-omnicom">Omnicom Media Group</p>
                <p class="panel-summary">Liderança do departamento de dados do grupo Marketing Science LATAM, desenvolvendo soluções de valor e criando serviços analíticos na região.</p>
