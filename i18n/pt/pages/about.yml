        <section class="about-hero" aria-labelledby="about-name">
          <div class="hero-section">
            <p class="hero-eyebrow"><span class="hero-status" aria-hidden="true"></span>Sobre mim · Venezuela → Chile → Estónia</p>
            <h1 class="hero-name" id="about-name">Uma jornada causal rumo às aplicações bayesianas<span class="hero-period">.</span></h1>
            <p class="hero-intro">Sou um profissional de dados com paixão por estatística e matemática. Desde estudar na Venezuela até colaborar com equipas em vários continentes, a minha jornada tem sido uma voragem de experiências diversificadas. Dedico-me a utilizar dados para transformar negócios e resolver problemas complexos.</p>
            <div class="hero-cta">
              <a class="btn btn-primary" href="files/cv_carlos.pdf" target="_blank" rel="noopener">Transferir CV <span aria-hidden="true">↗</span></a>
              <a class="btn btn-quiet" href="mailto:carlos.trujillo@outlook.cl">Enviar email <span aria-hidden="true">↗</span></a>
            </div>
            <div class="hero-profile">
              <p class="profile-affiliation">A liderar investigação na <a href="https://www.pymc-labs.com" target="_blank" rel="noopener">PyMC Labs</a><br><span>Inferência bayesiana · Modelação causal</span></p>
            </div>
          </div>
          <div class="about-portrait">
            <img src="images/profile.jpg" class="profile-photo" alt="Retrato de Carlos Trujillo" width="250" height="250">
          </div>
        </section>

