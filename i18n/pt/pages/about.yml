                <p class="panel-company" id="role-company-bolt">Bolt</p>
                <p class="panel-summary">Mudança do Chile para a Estónia, aplicando análise de dados para determinar as estratégias mais eficazes para otimizar os esforços de marketing de aquisição com base na rentabilidade.</p>
