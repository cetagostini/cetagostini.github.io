    kind: para
    context: body
    en: |-
      Redesigned the whole thing. Green, brown, DAGs everywhere. It feels like
      me now.
    es: Redesenhei tudo. Verde, castanho, DAGs por todo o lado. Agora parece ser eu.
  para-c4af39e95318:
    kind: para
    context: body
    en: |-
      Set up Hermes on an old HP Pavilion. Named my bot Merlin Vieira saar.
      MiMo voice is insane.
    es: Configurei o Hermes num HP Pavilion antigo. Chamei ao meu bot Merlin Vieira saar. A voz do MiMo
      é incrível.
  para-1999439d2d47:
    kind: para
    context: body
    en: The hour was always a proxy for value. AI just made the proxy collapse.
    es: A hora foi sempre um proxy para o valor. A IA apenas fez o proxy colapsar.
  para-5d2664d28a90:
