<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="dc-title dc-desc">
  <title id="dc-title">From DAGs to CPDAGs: equivalence classes</title>
  <desc id="dc-desc">The chain a to b to y, the fork with b pointing to both a and y, and the reverse chain y to b to a share one CPDAG: a undirected b undirected y. The collider a to b and y to b forms a separate singleton class. Its CPDAG preserves both arrows into b.</desc>

  <style>
    :root {
      --cream: #FDF6ED;
      --cream-alt: #F2EDE3;
      --ink: #2B2A26;
      --ink-muted: #6B665C;
      --sage: #778873;
      --sage-light: #A1BC98;
      --sage-deep: #4F6B4A;
      --brown: #6B5A48;
      --line: #E6DFD2;
      --accent: #DCCFC0;
    }
    text { font-family: 'Manrope', 'Inter', system-ui, sans-serif; }
    .heading { font-size: 14px; font-weight: 700; fill: var(--ink); }
    .node-lbl { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .dag-label { font-size: 11px; fill: var(--ink-muted); }
    .body { font-size: 12px; fill: var(--ink-muted); }
    .caption { font-size: 11.5px; fill: var(--ink-muted); font-style: italic; }
    .node { fill: var(--cream); stroke: var(--ink); stroke-width: 2; }
    .node-sage { fill: var(--cream); stroke: var(--sage-deep); stroke-width: 2; }
    .node-brown { fill: var(--cream); stroke: var(--brown); stroke-width: 2; }
    .arrow { stroke: var(--ink); stroke-width: 2; fill: none; marker-end: url(#ah); }
    .line-undirected { stroke: var(--sage-deep); stroke-width: 2.2; fill: none; }
    .summ-arrow { stroke: var(--sage); stroke-width: 1.5; fill: none; marker-end: url(#ah-sage); stroke-dasharray: 5 4; }
    .eq-box { fill: var(--cream-alt); stroke: var(--sage-deep); stroke-width: 1.5; }
    .eq-box-singleton { fill: var(--cream-alt); stroke: var(--brown); stroke-width: 1.5; }
    .sep { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
    </marker>
    <marker id="ah-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="var(--sage)" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="var(--cream)" rx="12"/>

  <!-- ============================================================ -->
  <!-- ROW 1: Three DAGs → one CPDAG                                -->
  <!-- ============================================================ -->

  <text x="390" y="30" text-anchor="middle" class="heading" font-size="14">Same skeleton, same colliders — one CPDAG</text>
  <line x1="80" y1="42" x2="700" y2="42" class="sep"/>

  <!-- DAG 1: chain  a → b → y -->
  <text x="130" y="64" text-anchor="middle" class="dag-label">Chain</text>
  <!-- Nodes at cx 60, 130, 200  radius 18  gap 70px -->
  <circle cx="60" cy="100" r="18" class="node"/>
  <text x="60" y="105" text-anchor="middle" class="node-lbl">a</text>
  <circle cx="130" cy="100" r="18" class="node"/>
  <text x="130" y="105" text-anchor="middle" class="node-lbl">b</text>
  <circle cx="200" cy="100" r="18" class="node"/>
  <text x="200" y="105" text-anchor="middle" class="node-lbl">y</text>
  <!-- a → b: from node edge (78) to node edge (112) = 34px -->
  <line x1="78" y1="100" x2="112" y2="100" class="arrow"/>
  <!-- b → y: from node edge (148) to node edge (182) = 34px -->
  <line x1="148" y1="100" x2="182" y2="100" class="arrow"/>

  <!-- DAG 2: fork  a ← b → y -->
  <text x="390" y="64" text-anchor="middle" class="dag-label">Fork</text>
  <circle cx="320" cy="100" r="18" class="node"/>
  <text x="320" y="105" text-anchor="middle" class="node-lbl">a</text>
  <circle cx="390" cy="100" r="18" class="node"/>
  <text x="390" y="105" text-anchor="middle" class="node-lbl">b</text>
  <circle cx="460" cy="100" r="18" class="node"/>
  <text x="460" y="105" text-anchor="middle" class="node-lbl">y</text>
  <!-- a ← b: arrow from b-left-edge (372) to a-right-edge (338) -->
  <line x1="372" y1="100" x2="338" y2="100" class="arrow"/>
  <!-- b → y: from b-right-edge (408) to y-left-edge (442) -->
  <line x1="408" y1="100" x2="442" y2="100" class="arrow"/>

  <!-- DAG 3: reverse chain  a ← b ← y -->
  <text x="650" y="64" text-anchor="middle" class="dag-label">Reverse chain</text>
  <circle cx="580" cy="100" r="18" class="node"/>
  <text x="580" y="105" text-anchor="middle" class="node-lbl">a</text>
  <circle cx="650" cy="100" r="18" class="node"/>
  <text x="650" y="105" text-anchor="middle" class="node-lbl">b</text>
  <circle cx="720" cy="100" r="18" class="node"/>
  <text x="720" y="105" text-anchor="middle" class="node-lbl">y</text>
  <!-- a ← b: from b-left-edge (632) to a-right-edge (598) -->
  <line x1="632" y1="100" x2="598" y2="100" class="arrow"/>
  <!-- b ← y: from y-left-edge (702) to b-right-edge (668) -->
  <line x1="702" y1="100" x2="668" y2="100" class="arrow"/>

  <!-- Dashed arrows from each DAG down to CPDAG -->
  <line x1="130" y1="120" x2="358" y2="188" class="summ-arrow"/>
  <line x1="390" y1="120" x2="390" y2="188" class="summ-arrow"/>
  <line x1="650" y1="120" x2="422" y2="188" class="summ-arrow"/>

  <!-- CPDAG box: a — b — y (all undirected) -->
  <rect x="308" y="192" width="164" height="58" rx="10" class="eq-box"/>
  <text x="390" y="210" text-anchor="middle" class="heading" fill="var(--sage-deep)" font-size="12">CPDAG</text>
  <circle cx="330" cy="232" r="14" class="node-sage"/>
  <text x="330" y="237" text-anchor="middle" class="node-lbl" font-size="12">a</text>
  <circle cx="390" cy="232" r="14" class="node-sage"/>
  <text x="390" y="237" text-anchor="middle" class="node-lbl" font-size="12">b</text>
  <circle cx="450" cy="232" r="14" class="node-sage"/>
  <text x="450" y="237" text-anchor="middle" class="node-lbl" font-size="12">y</text>
  <!-- Undirected lines (no arrowheads, no reciprocals) -->
  <line x1="344" y1="232" x2="376" y2="232" class="line-undirected"/>
  <line x1="404" y1="232" x2="436" y2="232" class="line-undirected"/>

  <!-- ============================================================ -->
  <!-- ROW 2: Collider → singleton CPDAG                            -->
  <!-- ============================================================ -->

  <line x1="80" y1="276" x2="700" y2="276" class="sep"/>
  <text x="390" y="298" text-anchor="middle" class="heading" font-size="14">Different colliders — different CPDAG</text>

  <!-- Collider DAG: a → b ← y -->
  <text x="200" y="326" text-anchor="middle" class="dag-label">Collider</text>
  <circle cx="120" cy="362" r="18" class="node"/>
  <text x="120" y="367" text-anchor="middle" class="node-lbl">a</text>
  <circle cx="200" cy="362" r="18" class="node"/>
  <text x="200" y="367" text-anchor="middle" class="node-lbl">b</text>
  <circle cx="280" cy="362" r="18" class="node"/>
  <text x="280" y="367" text-anchor="middle" class="node-lbl">y</text>
  <!-- a → b: from a-right-edge (138) to b-left-edge (182) = 44px -->
  <line x1="138" y1="362" x2="182" y2="362" class="arrow"/>
  <!-- y → b: from y-left-edge (262) to b-right-edge (218) = 44px -->
  <line x1="262" y1="362" x2="218" y2="362" class="arrow"/>

  <!-- Dashed arrow down -->
  <line x1="200" y1="382" x2="200" y2="424" class="summ-arrow"/>

  <!-- Collider CPDAG: a → b ← y (preserved — unshielded collider) -->
  <rect x="118" y="428" width="164" height="58" rx="10" class="eq-box-singleton"/>
  <text x="200" y="446" text-anchor="middle" class="heading" fill="var(--brown)" font-size="12">CPDAG</text>
  <circle cx="144" cy="468" r="14" class="node-brown"/>
  <text x="144" y="473" text-anchor="middle" class="node-lbl" font-size="12">a</text>
  <circle cx="200" cy="468" r="14" class="node-brown"/>
  <text x="200" y="473" text-anchor="middle" class="node-lbl" font-size="12">b</text>
  <circle cx="256" cy="468" r="14" class="node-brown"/>
  <text x="256" y="473" text-anchor="middle" class="node-lbl" font-size="12">y</text>
  <!-- a → b (directed — collider preserved) -->
  <line x1="158" y1="468" x2="186" y2="468" class="arrow"/>
  <!-- y → b (directed — collider preserved) -->
  <line x1="242" y1="468" x2="214" y2="468" class="arrow"/>

  <!-- Annotation: WHY collider is separate -->
  <rect x="370" y="320" width="370" height="170" rx="10" fill="var(--cream-alt)" stroke="var(--line)" stroke-width="1"/>
  <text x="555" y="346" text-anchor="middle" class="heading" font-size="13">Why the collider stays separate</text>
  <line x1="400" y1="356" x2="710" y2="356" class="sep"/>
  <text x="400" y="380" class="body">a and y have no edge.</text>
  <text x="400" y="405" class="body">Both point into b.</text>
  <text x="400" y="435" class="body">This collider changes the</text>
  <text x="400" y="460" class="body">independences implied</text>
  <text x="400" y="482" class="body">by the graph.</text>

  <!-- Bottom caption -->
  <text x="390" y="510" text-anchor="middle" class="caption" font-size="12">Same connections + same unshielded colliders → same CPDAG.</text>
</svg>
