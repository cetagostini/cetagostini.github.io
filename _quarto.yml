project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/**/*.qmd"
    - "diary/**/*.qmd"
    - "!README.md"
  post-render:
    - python3 js/build-llms-md.py
    - python3 generate_sitemap.py

execute:
  eval: true
  echo: true
  # Remove the conda-specific environment that's causing issues
  conda: cetagostini_web
  freeze: true

filters:
  - filters/llm-seo.lua

website:
  title: "Marketing Science Blog"
  favicon: "images/icon/fav.ico"
  site-url: https://cetagostini.github.io
  repo-url: https://github.com/cetagostini/cetagostini.github.io
  repo-actions: [edit, issue]
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: articles.qmd
        text: Articles
      - href: diary.qmd
        text: Diary
      - href: talks.qmd
        text: Talks
  page-footer:
    center: 
      - text: "© 2026 Carlos Trujillo"
    left:
      - text: "Connect with me:"
    right:
      - icon: github
        href: https://github.com/cetagostini
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/cetagostini
        aria-label: Twitter
      - icon: linkedin
        href: https://linkedin.com/in/cetagostini
        aria-label: LinkedIn
      - icon: instagram
        href: https://instagram.com/cetagostini
        aria-label: Instagram
      - icon: envelope
        href: mailto:carlos.trujillo.agostini@gmail.com
        aria-label: Email

format:
  html:
    theme: litera
    css: styles.css
    toc: true
    html-math-method: katex
    include-in-header: 
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
          <style>
            .navbar-title { background: none; -webkit-text-fill-color: initial; }
          </style>
    include-after-body:
      - text: |
          <script src="/js/cookie-consent.js"></script>
    include-before-body:
      - _includes/before-body.html
