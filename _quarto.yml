project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/**/*.qmd"
    - "diary/**/*.qmd"
    - "!README.md"
  # NOTE: every glob is anchored with "./". Unanchored globs are depth-insensitive
  # and would match the *rendered* English tree inside docs/ once the es profile
  # nests its output at docs/es (copying ~24MB of stale output into docs/es/docs/).
  resources:
    - "./articles/*/audio/**"
    - "./diary/audio/**"
    # Article art stays available for the Articles network sheet (and any page
    # that references an image only from frontmatter).
    - "./images/*.jpg"
    - "./images/*.png"
    - "./images/icon/**"
    - "./images/network/**"
  # Runs BEFORE the render: a bare `quarto render` would otherwise delete the
  # committed docs/es/ tree (see scripts/assert_bilingual_tree.py). Profile
  # passes and the sanctioned wrapper exit cleanly.
  pre-render:
    - python3 scripts/assert_bilingual_tree.py
  # Order matters. Every entry self-dispatches on QUARTO_PROFILE, because a
  # profile cannot clear inherited list entries.
  post-render:
    # listing cards are built outside the filter chain; rewrite their labels
    # before the LLM mirrors are generated from the HTML.
    - python3 scripts/i18n_listing_rewrite.py
    - python3 js/build-llms-md.py
    - python3 generate_articles_network.py
    # the combined bilingual sitemap is written on the final (es) pass
    - python3 generate_sitemap.py
    # last: records that an es tree exists, enabling the pre-render guard
    - python3 scripts/write_es_marker.py

execute:
  eval: true
  echo: true
  # Base env for the site engine + post-render scripts only. Every article
  # pins its own kernel via `jupyter: <slug>` in its frontmatter; each slug
  # is a conda env defined by articles/<slug>/environment.yml.
  # Provision with: bash scripts/setup_envs.sh
  conda: cetagostini_site
  freeze: true

# translate.lua MUST stay first: profile-declared filter lists APPEND, so a
# profile-declared translation filter would run after llm-seo.lua and leave the
# structured data English. It is a strict no-op unless QUARTO_PROFILE is `es`
# (translate) or `es-dump` (extraction).
filters:
  - filters/translate.lua
  - filters/llm-seo.lua

website:
  title: "Marketing Science Blog"
  favicon: "images/icon/fav.ico"
  site-url: https://cetagostini.github.io
  repo-url: https://github.com/cetagostini/cetagostini.github.io
  repo-actions: [edit, issue]
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: articles.qmd
        text: Articles
      - href: diary.qmd
        text: Diary
      - href: talks.qmd
        text: Talks
      # Language switch. Server-rendered so it exists without JS; on the English
      # site this already points at the Spanish site. js/language-switcher.js
      # refines it per page (same-route counterpart) and relabels it "English"
      # on Spanish pages. Deliberately a plain link, not a dropdown: it is one
      # click, needs no Bootstrap JS, and does not depend on the icon font
      # (an icon-only dropdown toggle rendered as an invisible blank).
      - text: "Español"
        href: /es/
        aria-label: "Cambiar a español"
  page-footer:
    center: 
      - text: "© 2026 Carlos Trujillo"
    left:
      - text: "Connect with me:"
    right:
      - icon: github
        href: https://github.com/cetagostini
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/cetagostini
        aria-label: Twitter
      - icon: linkedin
        href: https://linkedin.com/in/cetagostini
        aria-label: LinkedIn
      - icon: instagram
        href: https://instagram.com/cetagostini
        aria-label: Instagram
      - icon: envelope
        href: mailto:carlos.trujillo.agostini@gmail.com
        aria-label: Email

format:
  html:
    theme: litera
    css: styles.css
    toc: true
    html-math-method: katex
    include-in-header: 
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
          <style>
            .navbar-title { background: none; -webkit-text-fill-color: initial; }
          </style>
    include-after-body:
      - text: |
          <script src="/js/cookie-consent.js"></script>
    include-before-body:
      - _includes/before-body.html
